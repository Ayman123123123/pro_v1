<script language="JavaScript" type="text/JavaScript">
var currentpage =-1;
var pagenum = 0;
var RowCount = 0;
var allRowCount = 0;
var TableSize = 0;
function MM_callJS(rownum,currentpageno,allpagenum, tblSize, allRow)
{
	var i = 0;
	var idIpCfg;
	var PageIndex = "";
	var PageNo   = "";
    allRowCount = parseInt(allRow);
	RowCount = parseInt(rownum);
	pagenum = parseInt(allpagenum);
	currentpage = parseInt(currentpageno)-1;
	TableSize = parseInt(tblSize);
		
    document.forms[0].page.length = pagenum;
	for (i = 0; i < pagenum; i ++)
	{
		PageIndex="Page "+ (i + 1);	
		PageNo = ""+ i;
		document.forms[0].page.options[i].text = PageIndex;
		document.forms[0].page.options[i].value = PageNo;
		document.forms[0].page.options[i].selected = false;
	}
	
	for (i = 0; i < RowCount;i ++)
	{
		var preClassName="";
		if (i > 0)
		{
			idIpCfg = "idIpCfg" + (i-1);
			preClassName = document.getElementById(idIpCfg).className;
		} else {
			document.getElementById("idIpCfg0").className="";
		}
		idIpCfg = "idIpCfg" + i;
		document.getElementById(idIpCfg).style.display="";
		if( i > 0)
		document.getElementById(idIpCfg).className = preClassName?"":"interval";
	}
	if(RowCount>0) {
		 document.getElementById("last").style.display="none";
	     document.getElementById("IpCfgNone").style.display="none";
		 var lastClassName = document.getElementById(idIpCfg).className;
	     document.getElementById("last").className = lastClassName?"":"interval";
    } else {
		document.getElementById("last").className = "interval";
	}
	
	if (pagenum==0)
	{		
		document.forms[0].page.disabled = true;
	}
	else
	{
		document.forms[0].page.options[currentpage].selected = true;	
	}

	var idName, Name;
	var idFieldArray = new Array("idDomain","idPort","idDesc");
    for (i=0; i<RowCount; i++)	
	{
		for(var j in idFieldArray) 
		{
			idName = idFieldArray[j]+i;		
			Name = document.getElementById(idName);
			if (null != Name)
			{
				Name.title = Name.innerHTML;
			}		
		}
	}	
	
	mouse_click();
}

function mouse_click()
{
	var i = 0,Selectcount = 0;
	
	for (i = 0; i < RowCount;i++)
	{
	    if (eval("document.forms[0].IpCfgEnable"+i+".checked") == true)
		{
			Selectcount++;
		}
	}
	
	if (Selectcount==1)
	{
		document.forms[0].Del.disabled = false;
		document.forms[0].Mod.disabled = false;	
	}
	else if (Selectcount>1)
	{
		document.forms[0].Del.disabled = false;
		document.forms[0].Mod.disabled = true;
	}
	else
	{
		document.forms[0].Del.disabled = true;
		document.forms[0].Mod.disabled = true;
	}
	
	if (allRowCount >= TableSize)
	{
		document.forms[0].Add.disabled = true;
	}
}

function doRefresh()
{
	document.forms[0].action="/goform/IpCfgChange";
	for (i = 0; i < pagenum; i++)
	{
		if (document.forms[0].page.options[i].selected == true)
		{
			document.forms[0].curpage.value = ""+i;
			break;
		}
	}
	document.forms[0].submit();
}

function Permission()
{
	var permit = 1;
	if(permit == 0)
	{
		window.alert("You have no permission.\n Please visit the Access Control page.");
		return 0;
	}
	
	var license = 1;
	if(license == 0)
	{
		window.alert("You are not authorized.\n");
		return 0;
	}
	return 1;
}

function AddData()
{
	if(Permission())
	{
		location.href = "enIpCfgAdd.htm";
	}
}
function DelData()
{
	if(Permission() == 0)
	{
		return false;
	}
	
	if(confirm("Are you sure?" + "\n" + "when remove the sip trunk, the associated routing rules will also be deleted."))
	{  
		document.forms[0].action="/goform/IpCfgGoDel";
		return true;
	}
	return false;
}

function ModData()
{
	if(Permission() == 0)
	{
		return false;
	}
	
	document.forms[0].action="/goform/IpCfgGoMod";
	document.forms[0].submit();
}
</script>

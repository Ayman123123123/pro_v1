function check_box(index)
{
	if(document.getElementById("Index"+index).checked == false)
	{
		document.getElementById("DestNum"+index).disabled = true;
		document.getElementById("Prefix"+index).disabled = true;
		document.getElementById("Delete"+index).disabled = true;
	}
	else
	{	
		document.getElementById("DestNum"+index).disabled = false;
		document.getElementById("Prefix"+index).disabled = false;
		document.getElementById("Delete"+index).disabled = false;
	}
}

function SelectAll()
{
	var i=0;
	
	if(document.getElementById("IndexAll").checked == true)
	{
		for(i=0; i<totalRuleCount; i++)
		{
			document.getElementById("Index"+i).checked = true;
		}
	}
	else
	{
		for(i=0; i<totalRuleCount; i++)
		{
			document.getElementById("Index"+i).checked = false;
		}		
	}
	
	for(i=0; i<totalRuleCount; i++)
	{
		check_box(i);
	}
}

function SelectCheck()
{
	var i;
	var mark = 0;

	for (i = 0; i <totalRuleCount;i++)
	{
		if(true == document.getElementById("Index" + i).checked)
		{
			mark=1;
			break;
		}
	}
	
	if(0==mark)
	{
		alert("Please Select Port!");
		return false;
	}
}

function CopyDestNum()
{
	var i;
	
	if(SelectCheck() == false)
	{
		return;
	}
	
	for(i=0; i<totalRuleCount; i++)
	{
		if(document.getElementById("Index"+i).checked == true
		&& document.getElementById("DestNumAll").value.length != 0)
		{
			document.getElementById("DestNum"+i).value = document.getElementById("DestNumAll").value;
		}
	}
}

		{

		}
	}
}

function form_check()
{	
	var i=0;
	var re1 = /^\d{0,2}$/, re2 = /^((\+\d{0,14})|(\d{0,15}))$/;
	var str, pos, temp;
	for(i=0; i<totalRuleCount; i++)
	{
		if(document.getElementById("Index"+i).checked == true)
		{
			//å¤æ­ç®æ å·ç æ ¼å¼
			if(document.getElementById("DestNum"+i).value.length == 0
			|| document.getElementById("DestNum"+i).value.length >31)
			{
				alert("'Dest Num' is incorrect, input length must be less than 31!"); 
				document.getElementById("DestNum"+i).select();
				return false;
			}
			
			if(document.getElementById("Delete"+i).value > 31)
			{
				alert("'Digits to be Deleted' is incorrect, input value must be less than 31!"); 				
				return false;
			}
			
			if(document.getElementById("Prefix"+i).value.length  > 15)
			{
				alert("'Prefix to Add' is incorrect, input length must be less than 15!"); 				
				return false;
			}
			
			//å¤æ­å é¤å·ç ä½æ°
			if(re1.test(document.getElementById("Delete"+i).value) == false)
			{
				alert("Digits to be deleted' is incorrect!");
				document.getElementById("Delete"+i).select();
				return false;
			}
			
			if(document.getElementById("DestNum"+i).value.length < document.getElementById("Delete"+i).value)
			{
				alert("Digits to be deleted should be less than length of Destination Number!");
				return false;
			}
			
			//å¤æ­æ·»å å·ç åç¼
			if(re2.test(document.getElementById("Prefix"+i).value) == false)
			{
				alert("Prefix to Add' is incorrect!");
				document.getElementById("Prefix"+i).select();
				return false;
			}
		}
	}
	return true;
}

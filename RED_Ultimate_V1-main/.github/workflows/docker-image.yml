name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the backend Docker image
      # Context is RED_Ultimate/: backend-server/Dockerfile copies
      # shared-proto/ + backend-server/ relative to that root.
      run: docker build ./RED_Ultimate --file ./RED_Ultimate/backend-server/Dockerfile --tag red-backend:ci

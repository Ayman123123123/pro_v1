name: Backend Unit Tests

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-backend-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
      - name: Run backend tests
        # backend-server is an independent Spring build (own settings.gradle.kts
        # + wrapper; excluded from the Android settings on purpose). It has no
        # :backend-server project inside the Android graph — run its wrapper.
        working-directory: RED_Ultimate/backend-server
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: 'RED_Ultimate/backend-server/build/test-results/**/*.xml'

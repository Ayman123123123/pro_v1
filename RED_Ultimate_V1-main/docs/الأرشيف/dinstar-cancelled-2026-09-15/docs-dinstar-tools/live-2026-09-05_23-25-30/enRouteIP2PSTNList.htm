//设置当前页面值
function RouteCurrPageRecord_Set(cur)
{
	//参数判断
	if("undefined" == typeof(cur) || 0 != isNaN(parseInt(cur)))
	{
		alert("RouteCurrPageRecord_Set(): Parameter Error!!!");
		g_CurrPageRecord = 1;
		return 0; //第一个界面
	}		
	g_CurrPageRecord = parseInt(cur);
	if(g_CurrPageRecord < 1)
	{
		g_CurrPageRecord = 1;
	}
}
//获取当前页面值
function RouteCurrPageRecord_Get()
{
	var currPage = 1,total = 0;
	currPage = g_CurrPageRecord;
	total = WebFormContextTableTotal_Get(PER_PAGE_ELEM_MAX);
	//参数判断
	if(currPage > total) //如果当前页面值 大于 页面总数.
	{
		currPage = total;
		if(currPage < 1) //当前页面不能小于 1 
		{
			currPage = 1;
		}
		RouteCurrPageRecord_Set(currPage);//重新设置当前页面值.
	}
	
	return currPage;
}

//创建select对象
function SelectObject_Creat(sID,sType,sTotal,str1,str2)
{
	var i;
	var sel;	
	
	//0.参数判断
	
	//1.获取select对象ID
	sel = document.getElementById(sID);
	
	//1.删除原有的选项.
//	alert("parseInt(sel.length) = " + parseInt(sel.options.length));
	if(parseInt(sel.options.length) >　0)
	{
		for(i = parseInt(sel.options.length) - 1; i >= 0 ;i--) 
		{
			sel.options.remove(parseInt(i));
		}		
	}

	
	//3.操作  
	if(0 == parseInt(sType))//升序排列
	{
		for(i = 1; i <= parseInt(sTotal) ; i++) 
		{	
				var opt = document.createElement('option');
				//document.getElementById("idIndex"+i).disabled = true;
				opt.text = str1 + i + str2;
				opt.value = parseInt(i);
				sel.add(opt,null);	
		}			
	}
	else  //降序排列
	{
		for(i = parseInt(sTotal) - 1; i >= 0 ; i--) 
		{	
				var opt = document.createElement('option');
				//document.getElementById("idIndex"+i).disabled = true;
				opt.text = i;
				opt.value = parseInt(i);
				sel.add(opt,null);	
		}			
	}
}

//搜索有限路由个数
function RouteElemSum_Serach()
{
	var i,count  = 0;
	var obj;
	var obj_length;
	var route;	
	var index = 0;
	//获取全局对象
	obj = GlobalRouteObject_Get();	
	obj_length = obj.routing.length;
	
//	alert("string = " + Object2String(obj));

	for(i = 0 ;i < obj_length; i++)
	{
		route = obj.routing[i];
		if(1 == parseInt(route.enable))
		{
			++count;
			//g_RoutingID_Table[index++] = i;  //记录有效路由编号.
			g_RoutingID_Table[index++] = route.index;
		}
	}
	
	return count;
}

//web表单总数获取
function WebFormContextTableTotal_Get(formmax)
{
	var ret = 0;
	var count = 0;

	//参数判断
	if(parseInt(formmax) < 0 || "undefined" == typeof(formmax))
	{
		alert("WebFormContextTableTotal_Get(): Parameter Error!!!");
		return 0;
	}
	
	count = RouteElemSum_Serach();
	if(0 != formmax)
	{
	//	alert("count = " + count);
		if(0 == parseInt(parseInt(count)%parseInt(formmax)))
		{
			ret = parseInt(parseInt(count)/parseInt(formmax));
		}
		else
		{
			ret = parseInt(parseInt(count)/parseInt(formmax))+1;
		}		
	}

	
//	alert("WebFormContextTableTotal_Get(): ret = " + ret);
	return parseInt(ret);
}


//web表单创建
function WebFormContext_Creat(formmax)
{
	var obj ;
	var text = "";
	var formsize = 0;
	var i;
	var obj_length;
	//参数判断
	if(parseInt(formmax) <= 0 || "undefined" == typeof(formmax))
	{
		alert("WebFormContext_Creat(): Parameter Error!!!");
		return 0;
	}
	//获取全局对象
	obj = GlobalRouteObject_Get();	
//	alert("Object2String = " + Object2String(obj));
	obj_length = obj.routing.length;
	
	//遍历路由表
//	alert("RouteTableIndexRecord_Get() = "+RouteTableIndexRecord_Get());
	for(i = RouteTableIndexRecord_Get();i < obj_length; i++)
	{
		routing = obj.routing[i];
		if(routing.enable)
		{
			//创建字符串.
			text += WebFormElement_Creat(routing,routing.index);
			formsize++;
			if(formsize >= parseInt(formmax))
			{
				break;
			}		
		}
	}
	RouteTableIndexRecord_Set(i+1);
	return text;
}

function mouse_click()

	var i = 0,Selectcount = 0;

	Count = RouteElemSum_Serach();

	var CurrPage = RouteCurrPageRecord_Get();
	//
	var max_val = PerPageElemMaxVal_Get();	
	var min_val = (CurrPage - 1)*PER_PAGE_ELEM_MAX;
	for (i = min_val;i < max_val;i++)
	{
	  if (eval("document.forms[0].RouteIP2PSTNEnable"+g_RoutingID_Table[i]+".checked") == true)
		{
			Selectcount++;
		}
	}

	if (Selectcount == 1)
	{
		document.forms[0].Del.disabled = false;
		document.forms[0].Mod.disabled = false;	
	}
	else if (Selectcount > 1)
	{
		document.forms[0].Del.disabled = false;
		document.forms[0].Mod.disabled = true;
	}
	else
	{
		document.forms[0].Del.disabled = true;
		document.forms[0].Mod.disabled = true;
	}
//	alert("RowCount : " + RowCount +",TableSize : " + TableSize);
	if (RowCount >= MaxTableSize)
	{
		document.forms[0].Add.disabled = true;
	}	
}

	RoutingIDTotal = RouteElemSum_Serach();
	//获取当前页
	var CurrPage = RouteCurrPageRecord_Get();
	//
	var max_val = PerPageElemMaxVal_Get();	
	var min_val = (CurrPage - 1)*PER_PAGE_ELEM_MAX;
	if(true == IsSelectDelElement())
	{
		if(confirm("Are you sure ?") != 0)
		{			
			//删除全部
			for(var i = min_val;i < max_val; i++)
			{			
				routing = obj.routing[i];
	
				if(document.getElementById("RouteIP2PSTNEnable"+g_RoutingID_Table[i]).checked == true)
				{									
//					if(63 != g_RoutingID_Table[i])//63号路由不允许删除
					{
						routing.enable = 0;
						str += JSON.stringify(routing);
						str += ",";
					}		
				}
			}				
			//清除CheckAll勾选
			document.getElementById("RouteIP2PSTNCheckAll").checked = false;
			
			//2.发送数据给后台,然后重新加载内容；
			str = StringRmEndChar(str);
			str += "]}";	
//			alert("str :: " + str);
			url = "/SetRoutingIp2PstnList";	
			doRequestUsingPost(url, str, handleStateReturn);					
		}		
	}

	return true;
}

function StringRmEndChar(str)
{
	var newstr = str.substring(0,str.length - 1);
	return newstr;
}


function ModData()
{
	var str = "";
	var permit = 1;
	if(permit == 0)
	{
		window.alert("You have no permission.\n Please visit the Access Control page.");
		return false;
	}
	
	var license = 1;
	if(license == 0)
	{
		window.alert("You are not authorized.\n");
		return false;
	}
	
	if(true == IsSelectDelElement())
	{
		str += g_IsSelectIndexRecord;
//		alert("ModData str = " + str);
		url = "/SendRoutingIndex";				
		doRequestUsingPost(url, str, handleStateModifyBack);		
	}
}

function CheckAll()
{
	var i,total = 0;
	var CurrPage;
	
	//获取当前页
	CurrPage = RouteCurrPageRecord_Get();
	//
	var max_val = PerPageElemMaxVal_Get();	
	var min_val = (CurrPage - 1)*PER_PAGE_ELEM_MAX;
	
	if(document.getElementById("RouteIP2PSTNCheckAll").checked == true)
	{
	    for(i = min_val;i < max_val;i++)
	    {
	        if(document.getElementById("RouteIP2PSTNEnable"+g_RoutingID_Table[i]) != null )
	        {
	            document.getElementById("RouteIP2PSTNEnable"+g_RoutingID_Table[i]).checked = true;
	        }            
	    }
	}
	else
	{
	    for(i = min_val;i < max_val;i++)
	    {
	        if(document.getElementById("RouteIP2PSTNEnable"+g_RoutingID_Table[i]) != null )
	        {
	            document.getElementById("RouteIP2PSTNEnable"+g_RoutingID_Table[i]).checked = false;
	        }
	    }
	}

	mouse_click();    
}


function IsSelectDelElement()
{
	var count =0;
	//获取当前页
	CurrPage = RouteCurrPageRecord_Get();
	//
	var max_val = PerPageElemMaxVal_Get();	
	var min_val = (CurrPage - 1)*PER_PAGE_ELEM_MAX;
	
	for(var i = min_val;  i < max_val; i++)
	{
		if(document.getElementById("RouteIP2PSTNEnable"+g_RoutingID_Table[i]).checked == true)
		{
			g_IsSelectIndexRecord = g_RoutingID_Table[i];
			return true;
		}
			
	}
	return false;
}


//获取每个页面元素的最大值
function PerPageElemMaxVal_Get()
{
	var RoutingIDTotal = 0;
	var currPage = 1 ;	 //当前页面,最小值为 1
	var maxRouteVal = 0;
	
	//获取当前页
	currPage = RouteCurrPageRecord_Get();
	//获取所以页面路由总数
	RoutingIDTotal = RouteElemSum_Serach();
	
	//计算
	if(RoutingIDTotal - currPage * PER_PAGE_ELEM_MAX >= 0)
	{
		maxRouteVal = currPage * PER_PAGE_ELEM_MAX;
	}
	else
	{
		maxRouteVal = RoutingIDTotal;  //最后页面可能不是16的整数倍.
	}

	return maxRouteVal;
}

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>IpCfgAdd</title>
<link href="css/main.css" rel="stylesheet" type="text/css">
<script language="JavaScript" type="text/JavaScript" src="common/func.js"></script>
<script language="JavaScript" type="text/JavaScript">
function MM_callJS(TableSize, strIndexMap)
{
	var i;	
	if (strIndexMap != "")
	{				
		var sel = document.getElementById("AddIpCfgIndex");
		for (i=TableSize-1; i>=0; i--)
		{
			if (strIndexMap.charAt(i) == '1')
			{
				var idSel = document.getElementById("idIndex"+i);
				
				sel.remove(idSel.index);
			}
		}
	}	
}

function mouse_click()
{
	if(document.getElementById("SIPTransWay").value != 3)
	{
		document.getElementById("SipsUrlEnable").checked = false;
		document.getElementById("SipsUrlEnable").disabled = true;
	}
	else
	{
		document.getElementById("SipsUrlEnable").disabled = false;
	}
}
function form_check()
{
	var permit = 1;
	var pattern=/^[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+\.?$/;

	if(permit == 0)
	{
		window.alert("You have no permission.\n Please visit the Access Control page.");
		return false;
	}
	
	var license = 1;
	if(license == 0)
	{
		window.alert("You are not authorized.\n");
		return false;
	}
	
	if(!is_ipaddr(document.forms[0].AddIpCfgDomain.value)
	   && !pattern.test(document.forms[0].AddIpCfgDomain.value, 1))
	{
		alert("IP address is incorrect, please enter another one(e.g. 192.168.0.100) !");	
		document.forms[0].AddIpCfgDomain.select();
		return false;
	}
	if(!is_number(document.forms[0].AddIpCfgPort.value,0,65535))
	{
		alert("'Port' is incorrect, please enter a number between 0 and 65535!");			
		document.forms[0].AddIpCfgPort.select();
		return false;
	}	
    if (document.forms[0].AddIpCfgDesc.value.length == 0 
		|| document.forms[0].AddIpCfgDesc.value.length > 23)
	{
	   alert("'Description' is incorrect, input length must be less than 23!");	
	   document.forms[0].AddIpCfgDesc.select();
	   return false;			
	}	
	return true;
}
</script>
</head>
<body onLoad="MM_callJS('32', '00000000000000000000000000000001');">
<form action="/goform/IpCfgAdd" method="post" name="IpCfgAdd" id="IpCfgAdd">
<table width="600px" border=0 align="center" cellpadding=0 cellspacing=0>
 <tr class="title">
  <td width="1%"><img src="image/subarc_l.gif" alt="subarc_left" align="left"></td>
  <td>SIP Trunk Add</td>
  <td width="1%"><img src="image/subarc_r.gif" alt="subarc_right" align="right"></td>
 </tr>
</table>
<table width="600px" align="center" class="TB" cellpadding=0 cellspacing=0>
 <tr>
  <td class="swidth">&nbsp;</td>
  <td>
    <table width="100%" cellpadding=1 cellspacing=0>
	  <tr>
		 <td width="50%">&nbsp;</td>
		 <td width="50%">&nbsp;</td>
	  </tr>
	  <tr>
      <script language="JavaScript" type="text/JavaScript">
	  	document.write("<td>Index</td>");		
		document.write("<td><select name='AddIpCfgIndex' class='alist' id='AddIpCfgIndex' style='width:78%;' onChange='mouse_click();'>");
		for (var i='32'-1; i>=0; i--)
		{
			document.write("<option value='"+i+"' id='idIndex"+i+"'>"+i+"</option>");
		}
		document.write("</select></td>");
	  </script>
	  </tr>  
	  <tr>
	    <td>IP</td>
	    <td><input class="atext" id="AddIpCfgDomain" name="AddIpCfgDomain" style="width:75%;" maxlength="31" size="20" value="" onClick="mouse_click();"></td>
	    </tr>                        
	  <tr>
	    <td>Port</td>
	    <td><input class="atext" id="AddIpCfgPort" name="AddIpCfgPort" style="width:75%;" maxlength="5" size="20" value="" onClick="mouse_click();"></td>
	    </tr>        
	  <tr>
	    <td>Description</td>
	    <td><input class="atext" id="AddIpCfgDesc" name="AddIpCfgDesc" style="width:75%;" maxlength="23" size="20" value="" onClick="mouse_click();"></td>
	    </tr>

        <tr>
          <td>KeepAlive Enable</td>
          <td>
            <input id="KeepAliveAddEnable" name="KeepAliveAddEnable" type="checkbox">
          </td>
        </tr>       
	  <tr>
		 <td>&nbsp;</td>
		 <td>&nbsp;</td>
	  </tr>   
	</table>
  </td>
  <td class="swidth">&nbsp;</td>
 </tr>
 </table>
<p align="center">
<input name="Ok"  class="button" type="submit" id="Ok" value="OK" onClick="return form_check();">
&nbsp;&nbsp;&nbsp;&nbsp;
<input name="Reset"  class="button" type="reset" id="Reset" value="Reset">
&nbsp;&nbsp;&nbsp;&nbsp;
<input name="Cancel"  class="button" type="button" id="Cancel" value="Cancel" onClick="javascript:window.history.go(-1);">
</p>
</form>
</body>
</html>

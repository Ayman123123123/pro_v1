services:
  pstn-gateway:
    build: ./pstn-asterisk
    image: red-pstn-gateway:local
    container_name: red-pstn-gateway
    restart: unless-stopped
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    network_mode: host
    environment:
      - AMI_PASSWORD=${AMI_PASSWORD:?AMI_PASSWORD is required}
      - DINSTAR_IP=${DINSTAR_IP:-192.168.11.4}
      - DINSTAR_IPS=${DINSTAR_IPS:-${DINSTAR_IP:-192.168.11.4}}
      - DINSTAR_SIP_USER=${DINSTAR_SIP_USER:?DINSTAR_SIP_USER is required}
      - DINSTAR_SIP_PASSWORD=${DINSTAR_SIP_PASSWORD:?DINSTAR_SIP_PASSWORD is required}
      - DINSTAR_PORT_ACCOUNTS=${DINSTAR_PORT_ACCOUNTS:-}
      - DINSTAR_PORT_SIP_PORTS=${DINSTAR_PORT_SIP_PORTS:-}
      - EXTERNAL_MEDIA_ADDRESS=${PSTN_EXTERNAL_IP:-${MEDIASOUP_ANNOUNCED_IP:-${TURN_PUBLIC_HOST:-}}}
      - EXTERNAL_SIGNALING_ADDRESS=${PSTN_EXTERNAL_IP:-${MEDIASOUP_ANNOUNCED_IP:-${TURN_PUBLIC_HOST:-}}}
      - ASTERISK_EXTERNAL_IP=${PSTN_EXTERNAL_IP:-${TURN_EXTERNAL_IP:-${TURN_PUBLIC_HOST:-}}}
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST:-}
      - PSTN_INTERNAL_SECRET=${PSTN_INTERNAL_SECRET:-}
      - TLS_SAN_IP=${TLS_SAN_IP:-192.168.11.10}
      - ASTERISK_STARTUP_TIMEOUT=${ASTERISK_STARTUP_TIMEOUT:-60}
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
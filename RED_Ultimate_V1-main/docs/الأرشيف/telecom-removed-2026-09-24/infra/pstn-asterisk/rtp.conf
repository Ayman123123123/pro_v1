[general]
; نطاق RTP مُوسّع 2026-09-06: 1001 منفذ = ~500 مكالمات متزامنة كحد أقصى
; (كل مكالمة تأخذ منفذين: RTP + RTCP) — مع docker-compose ports 10000-11000.
; ملاحظة: نطاق 10000-20000 يعلّق Docker Desktop على Windows (NAT لكل منفذ).
rtpstart=10000
rtpend=10030
icesupport=yes
; ── Best-practice media liveness (GSM gateways) ─────────────────────
; تُنهي المكالمات الميتة بدل تعليقها للأبد (سبب رئيسي لـ"قطع/تعليق" المكالمات):
; rtptimeout = لا RTP لمدة N ثانية → Hangup. rtpholdtimeout للمكالمات على Hold.
; rtpkeepalive = إبقاء NAT مفتوحاً بإرسال comfort-noise دوري.
rtptimeout=60
rtpholdtimeout=180
rtpkeepalive=15
strictrtp=yes
dtmftimeout=3000
; ── NAT / ICE notes (Docker) ──────────────────────────────────────────
; rtp_symmetric=yes + force_rport + rewrite_contact are set per-endpoint in
; pjsip.conf (transport-udp, dinstar-gw-*, red-webrtc-client). rtp.conf
; controls media ports only — no per-endpoint NAT flags here.
; EXTERNAL_MEDIA_ADDRESS / EXTERNAL_SIGNALING_ADDRESS are injected at
; runtime from docker-compose via ${TURN_PUBLIC_HOST} into pjsip.conf
; as external_media_address / external_signaling_address and
; media_address on WebRTC endpoint. rtp.conf deliberately does NOT
; override them, so LAN vs public IP works without editing this file.
; STUN disabled by default: STUN inside Docker behind strict NAT often
; adds ~200 ms ICE delay and breaks host-candidate path; Coturn on
; 3478/443 provides STUN+TURN externally. Enable only if you run
; Asterisk without TURN and need external reflexive candidates.
; stunaddr محذوف — نعتمد على Coturn TURN على 3478/443 (STUN المدمج). STUN الخارجي يضيف 200ms تأخير ICE بلا فائدة خلف NAT صارم
; stunaddr=stun.l.google.com:19302
; rtp checksums off is default for modern Asterisk; keep as-is for perf

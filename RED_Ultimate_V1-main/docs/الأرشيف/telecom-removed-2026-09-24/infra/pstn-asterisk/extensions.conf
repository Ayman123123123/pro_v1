; ═══════════════════════════════════════════════════════════════════════════
; RED Sovereign — Asterisk Dialplan v4 (Legendary Professional Edition)
; ═══════════════════════════════════════════════════════════════════════════
;
; PRODUCTION-READY FEATURES:
;   ✅ Atomic port reservation via V47 migration
;   ✅ Progress() passthrough for real carrier ringback tones
;   ✅ Per-provider tone zones (Sabafon/YOU/YemenMobile/Y Telecom)
;   ✅ Port index extraction via Via header for incoming calls
;   ✅ DTMF forwarding during active calls
;   ✅ Admin bridge with proper WebRTC-to-GSM bridging
;   ✅ VoiceBridge ARI integration for AI bots
;   ✅ WebRTC client support for PSTN calls
;   ✅ Comprehensive CDR tracking and logging
;
; CONTEXTS:
;   [from-red-backend]       ← PSTN outbound via AMI (GSM calls)
;   [from-dinstar]           ← PSTN inbound from GSM → UserEvent
;   [from-incoming-bridge]   ← Bridge incoming GSM to WebRTC client
;   [from-dinstar-dtmf]      ← DTMF forwarding during active calls
;   [from-untrusted]         ← Reject unauthorized calls
;   [from-red-client]        ← Block direct client bypass
;   [from-red-client-webrtc] ← PSTN outbound from WebRTC app
;   [from-admin-bridge]      ← Admin WebRTC-to-GSM bridge
;   [voicebridge-*]          ← AI voice bot ARI integration
;   [from-red-testcall]      ← Testing and diagnostics
;
; YEMEN NUMBERING PLAN:
;   70x → Y Telecom (Yemeni)      | 71x/722x → Sabafon
;   73x → YOU (MTN pre-2021)       | 77x/78x → Yemen Mobile
;   10x → Yemen Forgy (data only)  | 1x-5x → PSTN landlines
;
; LEGENDARY FIX — Progress() PASSTHROUGH:
;   For ALL PSTN legs (outbound to DINSTAR and inbound from GSM),
;   use Progress() which sends 183 Session Progress WITH SDP.
;   This passes through the REAL carrier ringback from Sabafon/
;   YOU/YemenMobile — caller hears the operator's actual network
;   ring, not a synthetic local tone.
;
;   NEVER use Ringing() (180 without SDP) for PSTN-terminated calls —
;   it GENERATES local tone from indications.conf and hides carrier
;   early media. Ringing() is kept ONLY for WebRTC-to-WebRTC calls.
;
;   Fallback per-provider local tones in indications.conf:
;     [ye-sabafon] 425 Hz | [ye-you] 400 Hz | [ye-yemobile] 440 Hz | [ye-ytelecom] 420 Hz
; ═══════════════════════════════════════════════════════════════════════════

; ─── Globals ──────────────────────────────────────────────────────────────
[globals]
DEFAULT_GW=dinstar-gateway
DIAL_TIMEOUT=60
RING_TIMEOUT=40

; ═══════════════════════════════════════════════════════════════════════════
; PER-PROVIDER RINGTONE SELECTION (Yemen Operators)
; ═══════════════════════════════════════════════════════════════════════════

; ─── ye-operator-tone — per-provider tone_zone selector (Gosub) ─────────
; Usage: Gosub(ye-operator-tone,s,1(${EXTEN})) before Ringing()
; Sets CHANNEL(tone_zone) to ye-sabafon / ye-you / ye-yemobile / ye-ytelecom
; Preference: Progress() passthrough is better — this is fallback only.
; Normalizes +967, 00967, 967, 0 prefixes before prefix check.
[ye-operator-tone]
exten => s,1,NoOp(Select Yemen operator tone for ${ARG1})
  same => n,Set(_RAWNUM=${ARG1})
  same => n,Set(_NUM=${FILTER(0123456789+${_RAWNUM})})
  ; strip +967 / 00967 / 967 / 0
  same => n,ExecIf($["${_NUM:0:4}"="+967"]?Set(_NUM=${_NUM:4}))
  same => n,ExecIf($["${_NUM:0:5}"="00967"]?Set(_NUM=${_NUM:5}))
  same => n,ExecIf($["${_NUM:0:3}"="967"]?Set(_NUM=${_NUM:3}))
  same => n,ExecIf($["${_NUM:0:1}"="0"]?Set(_NUM=${_NUM:1}))
  same => n,GotoIf($["${_NUM:0:3}"="722"]?sabafon)
  same => n,GotoIf($["${_NUM:0:2}"="70"]?ytelecom)
  same => n,GotoIf($["${_NUM:0:2}"="71"]?sabafon)
  same => n,GotoIf($["${_NUM:0:2}"="73"]?you)
  same => n,GotoIf($["${_NUM:0:2}"="77"]?yemobile)
  same => n,GotoIf($["${_NUM:0:2}"="78"]?yemobile)
  same => n,Set(CHANNEL(tone_zone)=ye)
  same => n,Return()
  same => n(ytelecom),Set(CHANNEL(tone_zone)=ye-ytelecom)
  same => n,Return()
  same => n(sabafon),Set(CHANNEL(tone_zone)=ye-sabafon)
  same => n,Return()
  same => n(you),Set(CHANNEL(tone_zone)=ye-you)
  same => n,Return()
  same => n(yemobile),Set(CHANNEL(tone_zone)=ye-yemobile)
  same => n,Return()
; Alternative entry for direct EXTEN pattern match (without Gosub)
exten => _70X.,1,Set(CHANNEL(tone_zone)=ye-ytelecom)
  same => n,Return()
exten => _722X.,1,Set(CHANNEL(tone_zone)=ye-sabafon)
  same => n,Return()
exten => _71X.,1,Set(CHANNEL(tone_zone)=ye-sabafon)
  same => n,Return()
exten => _73X.,1,Set(CHANNEL(tone_zone)=ye-you)
  same => n,Return()
exten => _77X.,1,Set(CHANNEL(tone_zone)=ye-yemobile)
  same => n,Return()
exten => _78X.,1,Set(CHANNEL(tone_zone)=ye-yemobile)
  same => n,Return()
exten => _X.,1,Set(CHANNEL(tone_zone)=ye)
  same => n,Return()

; ─── from-red-backend ─────────────────────────────────────────────────────
; PSTN outbound to DINSTAR gateways
; AMI creates Local channels in this context exclusively.
; The backend validates the Yemeni number, daily limit, and PSTN eligibility.
[from-red-backend]
exten => _X.,1,NoOp(RED PSTN outbound: ${EXTEN} / callId=${RED_CALL_ID} sim=${RED_SIM_NUMBER})
 same => n,Set(GW=${IF($["${RED_GW}" != ""]?${RED_GW}:${DEFAULT_GW})})
 ; Guard: only allow simple peer names to prevent destination injection
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
 ; Record callId in CDR userfield for DB correlation
 same => n,Set(CDR(userfield)=RED_DINSTAR:${GW}:${RED_CALL_ID}:${RED_SIM_NUMBER})
 ; Export callId as channel variable — read by DinstarEventListener via VarSet
 same => n,Set(RED_CALL_ID=${RED_CALL_ID})
 ; Export portIndex as channel variable — read by DinstarEventListener via VarSet
 same => n,Set(RED_PORT_INDEX=${RED_PORT_INDEX})
 ; Show real SIM number to external recipient (1:1 always)
 same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(num)=${RED_SIM_NUMBER}))
 same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(ani)=${RED_SIM_NUMBER}))
 ; Select exact peer: the Dial destination itself pins the physical port.
 ; DinstarLoadBalancer.pjsipEndpointFor sends RED_GW with -port-N already,
 ; so appending here without guard produces …-port-3-port-3 = missing peer.
 ; We append only when RED_GW is generic (no port suffix) and RED_PORT_INDEX is set.
 same => n,Set(NEEDS_PORT=${IF($["${REGEX("^[0-9]+$" ${RED_PORT_INDEX})}" = "1" & "${REGEX("-port-[0-9]+$" ${GW})}" = "0"]?1:0)})
 same => n,ExecIf($["${NEEDS_PORT}" = "1"]?Set(GW=${GW}-port-${RED_PORT_INDEX}))
 same => n,NoOp(Routing ${EXTEN} via PJSIP endpoint ${GW} on Port Index ${RED_PORT_INDEX})
 ; PSTN outbound: carrier ringback passed through via Dial early media.
 ; Do NOT generate local tone — Progress() passthrough is automatic in Dial.
 ; For local testing without trunk, uncomment next line for per-provider tone:
 ; same => n,Gosub(ye-operator-tone,s,1(${EXTEN}))
 ; Explicit Progress() for clarity — Dial handles early media automatically
 same => n,Progress()
 ; Send the call — K=call-waiting, U=subroutine for DTMF forwarding
 same => n,Dial(PJSIP/${EXTEN}@${GW},${DIAL_TIMEOUT},KU(from-dinstar-dtmf))
 same => n,NoOp(Outbound leg ended: status=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()
 same => n(badgw),NoOp(Rejected malformed gateway name: ${GW})
 same => n,Hangup(21)

; ─── from-dinstar ─────────────────────────────────────────────────────────
; المكالمات الواردة من شبكة GSM عبر أي بوابة DINSTAR
; الخطوة 1: UserEvent يُنبّه الخادم → يُ broadcast للمستخدم عبر WebSocket
; الخطوة 2: المستخدم يضغط "قبول" → Backend يُعيد توجيه القناة إلى from-incoming-bridge
; الخطوة 3: from-incoming-bridge يُجري Dial لـ WebRTC client → جسر المكالمة
; ⚠️ لا نُغلق القناة هنا — ننتظر Redirect من Backend
;
; ═══ تحديد المنفذ الخلوي للمكالمة الواردة ═══
; INVITE الوارد من البوابة **بلا مصادقة**، فيُطابَق بالعنوان (identify) على
; النظير العام dinstar-gw-<ip> الذي لا يحمل set_var=RED_PORT_INDEX. ومع
; NAT الخاص بـDocker يصل العنوان مترجَمًا (172.19.0.1) فلا يفيد أيضًا،
; واسم القناة يحمل عدّاد أستيريكس لا رقم المنفذ.
; ⇒ كان المنفذ الحقيقي مجهولًا في كل مكالمة واردة، فلا يُحلّ مالك الشريحة
;   (resolvePortOwner بلا منفذ) ولا يُحرَّر المنفذ عند الإنهاء
;   (handleHangup لا يجد منفذًا ⇒ يبقى محجوزًا حتى المهلة).
;
; المصدر الموثوق: ترويسة Via تحمل مقبس البوابة الحقيقي غير المترجَم،
; ولكل منفذ خلوي مقبسه الخاص (5061..5067، والمنفذ 0 على 5068 حيًّا).
; الخريطة DINSTAR_PORT_FOR_<socket> يولّدها docker-entrypoint من
; DINSTAR_PORT_SIP_PORTS، فتبقى مطابقة لِما هو مضبوط على الجهاز فعلًا.
[from-dinstar]
exten => _X.,1,NoOp(Incoming GSM call from ${CALLERID(num)} on port ${EXTEN} via ${CHANNEL(endpoint)})
 same => n,Gosub(dinstar-resolve-port,s,1())
 ; تسجيل بيانات المكالمة الواردة
 same => n,Set(CDR(userfield)=INCOMING_DINSTAR:${CHANNEL(endpoint)}:port-${RED_PORT_INDEX})
 same => n,Set(CDR(accountcode)=${CALLERID(num)})
  ; إرسال UserEvent يُلتقطه DinstarEventListener في الخادم
  ; استخدم أسماء ManagerEvent القياسية: مكتبة Asterisk-Java لا تكشف
  ; اسم UserEvent أو الحقول المخصصة CallerID/Port/Gateway.
  same => n,UserEvent(DinstarIncomingCall,CallerIDNum:${CALLERID(num)},Channel:${CHANNEL(name)},Exten:${EXTEN},Context:from-dinstar)
  ; ⚠️ asterisk-java يُسقط UserEvent المخصص بصمت (مُثبت حياً) — المسار
  ; الأساسي الموثوق: سكربت جسر يستقبل معاملات موضعية نظيفة (بلا اقتباس
  ; JSON مضمن) وينادي HTTP الداخلي للخادم عبر شبكة Docker.
  ; المعاملان 4 و5 جديدان: المنفذ الحقيقي ومضيف البوابة — بلاهما كان
  ; الخادم يخمّن المنفذ من اسم القناة ويفشل دائمًا في المكالمات الواردة.
  same => n,System(/usr/local/bin/pstn-incoming.sh "${CALLERID(num)}" "${EXTEN}" "${CHANNEL(name)}" "${RED_PORT_INDEX}" "${DINSTAR_VIA_HOST}")
  ; إشارة مبكرة للمتصل GSM — Progress يرسل 183 Session Progress بلا Answer (لا احتساب بلا إجابة)
  same => n,Progress()
  ; انتظار Redirect من Backend (حد أقصى RING_TIMEOUT ثانية — محاذاة مع CallRingPolicy 45s / TTL 120s)
  same => n,Wait(${RING_TIMEOUT})
  ; إذا لم يُرَد أو لم يُعاد توجيه — إنهاء المكالمة
  same => n,NoOp(Call from ${CALLERID(num)} unanswered after ${RING_TIMEOUT}s)
  same => n,Hangup()

; امتداد s للمكالمات بدون رقم محدد
exten => s,1,NoOp(Incoming GSM call from ${CALLERID(num)} - no extension)
  same => n,Gosub(dinstar-resolve-port,s,1())
  same => n,Set(CDR(userfield)=INCOMING_DINSTAR:${CHANNEL(endpoint)}:port-${RED_PORT_INDEX})
  same => n,UserEvent(DinstarIncomingCall,CallerIDNum:${CALLERID(num)},Channel:${CHANNEL(name)},Exten:s,Context:from-dinstar)
  same => n,System(/usr/local/bin/pstn-incoming.sh "${CALLERID(num)}" "s" "${CHANNEL(name)}" "${RED_PORT_INDEX}" "${DINSTAR_VIA_HOST}")
  same => n,Progress()
  same => n,Wait(${RING_TIMEOUT})
  same => n,Hangup()

; ─── dinstar-resolve-port ─────────────────────────────────────────────────
; يستخرج مقبس البوابة الحقيقي من ترويسة Via ويحوّله إلى فهرس المنفذ.
; Via النمطي: `SIP/2.0/UDP 192.168.11.1:5064;branch=z9hG4bK…;rport`
;   CUT(…,;,1) → `SIP/2.0/UDP 192.168.11.1:5064`
;   CUT(…,/,3) → `UDP 192.168.11.1:5064`      (بروتوكول بلا أرقام)
;   CUT(…,:,1) → `UDP 192.168.11.1` ← FILTER يبقي الأرقام والنقاط
;   CUT(…,:,2) → `5064`
; ثم DINSTAR_PORT_FOR_5064 → 4 من خريطة الجذور المولَّدة في entrypoint.
; ترتيب الأولوية:
;   1) set_var على النظير (يعمل عندما تُطابق INVITE نظير حساب ymnNN)
;   2) الخريطة عبر Via  ← المسار الغالب للمكالمات الواردة
;   3) فراغ — الخادم يعود إلى حلّ المالك بالرقم المطلوب وحده
; Set على متغيّر القناة يُنتج حدث VarSet يلتقطه DinstarEventListener،
; فيُسجَّل channel-port وهو ما يجعل تحرير المنفذ عند Hangup دقيقًا.
[dinstar-resolve-port]
exten => s,1,NoOp(Resolving DINSTAR physical port for ${CHANNEL(name)})
  same => n,Set(VIA_RAW=${PJSIP_HEADER(read,Via)})
  ; ⚠️ الفاصلة المنقوطة تبدأ تعليقًا في extensions.conf، فتُقصّ بقية السطر
  ; قبل أن يراها المُفسِّر. غير مهروبة كان السطر يُحمَّل كـ
  ;     Set(VIA_HOSTPORT=${CUT(VIA_RAW,
  ; (مُثبت من `dialplan show`) فيفشل القصّ ويبقى المنفذ مجهولًا. `\;` هو
  ; الهروب المعتمد ويصل إلى CUT كفاصلة منقوطة مفردة.
  same => n,Set(VIA_HOSTPORT=${CUT(VIA_RAW,\;,1)})
  same => n,Set(VIA_TAIL=${CUT(VIA_HOSTPORT,/,3)})
  same => n,Set(DINSTAR_VIA_HOST=${FILTER(0123456789.,${CUT(VIA_TAIL,:,1)})})
  same => n,Set(VIA_PORT=${FILTER(0123456789,${CUT(VIA_TAIL,:,2)})})
  same => n,ExecIf($["${VIA_PORT}" = ""]?Set(VIA_PORT=5060))
  same => n,Set(MAPPED_PORT=${DINSTAR_PORT_FOR_${VIA_PORT}})
  ; النظير أولًا (أدق حين تتوفّر مصادقة)، ثم الخريطة
  same => n,ExecIf($["${REGEX("^[0-9]+$" ${RED_PORT_INDEX})}" != "1"]?Set(RED_PORT_INDEX=${MAPPED_PORT}))
  same => n,NoOp(DINSTAR inbound port resolved: via=${VIA_HOSTPORT} socket=${VIA_PORT} port=${RED_PORT_INDEX})
  same => n,Return()


; ─── from-incoming-bridge ──────────────────────────────────────────────────
; جسر المكالمات الواردة من DINSTAR إلى عميل WebRTC (التطبيق)
; PstnManager.acceptIncomingCall() يُعيد توجيه قناة DINSTAR إلى هنا
; exten = "s" لأن RedirectAction يستخدم s كامتداد افتراضي
; legendary fix: Progress() (183 with SDP) not Ringing() (180) — for GSM
; inbound legs we do NOT generate local synthetic ring; Progress() lets the
; GSM caller keep hearing early media while WebRTC Dial proceeds. If you
; MUST generate local per-provider tone (no trunk / WebRTC-only test),
; uncomment Gosub line below to set CHANNEL(tone_zone)=ye-* before Ringing():
;   same => n,Gosub(ye-operator-tone,s,1(${CALLERID(num)}))
;   same => n,Ringing()
; But for PSTN-terminated bridge, Progress() passthrough is preferred and
; per-provider tones in indications.conf are fallback only (see ye-* zones).
[from-incoming-bridge]
exten => s,1,NoOp(Bridging incoming GSM call to WebRTC client)
  same => n,Set(CDR(userfield)=INCOMING_BRIDGE)
  ; إرسال 183 Progress للمتصل GSM أثناء اتصال WebRTC الداخلي (early media
  ; مع SDP — يمرّر النغمة الحقيقية بدل توليد نغمة محلية. Ringing() يُستخدم
  ; فقط لمكالمات WebRTC-to-WebRTC الخالصة بلا trunk).
  same => n,Progress()
  ; Fallback per-provider local tone (uncomment if you need synthetic ring):
  ; same => n,Gosub(ye-operator-tone,s,1(${CALLERID(num)}))
  ; same => n,Ringing()
  same => n,Dial(PJSIP/red-webrtc-client,${DIAL_TIMEOUT},tT)
  same => n,Hangup()

; ─── from-admin-bridge ────────────────────────────────────────────────────
; Admin bridged call: Admin answers first, then GSM leg is requested and bridged.
;
; Why this context exists:
;   The old method used Local/<num>@from-red-backend with Application=Wait
;   and Data=1 — Asterisk would request GSM, and when the recipient answers
;   it executes Wait(1) then hangs up. No second leg, no audio path.
;   It was "testing" the connection, never connecting it.
;
;   Here the order is reversed and correct: The original channel is the
;   admin endpoint (WebRTC), so when the admin answers this context dials
;   the GSM destination. The admin hears the real carrier ringback via
;   early media because Dial passes 183 with SDP automatically.
;
; Variables from AMI Originate:
;   RED_GW / RED_PORT_INDEX / RED_CALL_ID / RED_SIM_NUMBER
;   (same as from-red-backend — no separate branch in port selection logic)
[from-admin-bridge]
exten => _X.,1,NoOp(RED admin bridge: dest=${EXTEN} callId=${RED_CALL_ID} sim=${RED_SIM_NUMBER})
 same => n,Set(GW=${IF($["${RED_GW}" != ""]?${RED_GW}:${DEFAULT_GW})})
 ; Same injection guard as from-red-backend
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
 same => n,Set(CDR(userfield)=RED_ADMIN_BRIDGE:${GW}:${RED_CALL_ID}:${RED_SIM_NUMBER})
 same => n,Set(RED_CALL_ID=${RED_CALL_ID})
 same => n,Set(RED_PORT_INDEX=${RED_PORT_INDEX})
 ; Show real SIM number to external recipient instead of general ID
 same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(num)=${RED_SIM_NUMBER}))
 same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(ani)=${RED_SIM_NUMBER}))
 ; Append port suffix only if RED_GW is generic — avoid …-port-3-port-3
 same => n,Set(NEEDS_PORT=${IF($["${REGEX("^[0-9]+$" ${RED_PORT_INDEX})}" = "1" & "${REGEX("-port-[0-9]+$" ${GW})}" = "0"]?1:0)})
 same => n,ExecIf($["${NEEDS_PORT}" = "1"]?Set(GW=${GW}-port-${RED_PORT_INDEX}))
 same => n,NoOp(Admin bridge dialing ${EXTEN} via ${GW})
 ; Actual bridge: admin is already answered, so this leg connects directly.
 ; tT = allows both parties to transfer, U() = pass DTMF during active call.
 same => n,Progress()
 same => n,Dial(PJSIP/${EXTEN}@${GW},${DIAL_TIMEOUT},tTU(from-dinstar-dtmf))
 same => n,NoOp(Admin bridge ended: status=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()
 same => n(badgw),NoOp(Admin bridge rejected malformed gateway: ${GW})
 same => n,Hangup(21)

; ─── from-dinstar-dtmf ────────────────────────────────────────────────────
; سياق معالجة DTMF أثناء مكالمة نشطة (لإرسال أرقام عبر الشبكة)
; يُستخدَم عبر خيار U() في Dial() من from-red-backend
[from-dinstar-dtmf]
exten => s,1,Return()
exten => _[0-9*#],1,NoOp(DTMF ${EXTEN} from backend during active call)
 same => n,SendDTMF(${EXTEN})
 same => n,Return()

; ─── from-untrusted ──────────────────────────────────────────────────────
; المكالمات من نظير غير معروف — ترفض دائمًا
; النظير [anonymous] في pjsip.conf يشير إلى هنا.
[from-untrusted]
exten => _[0-9*#+].,1,NoOp(Rejected anonymous SIP call to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=REJECTED_ANONYMOUS)
 same => n,Hangup(21)
exten => s,1,NoOp(Rejected anonymous SIP call with no extension)
 same => n,Hangup(21)
exten => i,1,Hangup(21)
exten => h,1,Hangup()

; ─── from-red-client ──────────────────────────────────────────────────────
; منع محاولة الالتفاف المباشر من عميل SIP على الحد اليومي والتفويض
exten => _X.,1,NoOp(Blocked direct client PSTN attempt from ${CALLERID(num)})
 same => n,Hangup(21)

; ═════════════════════════════════════════════════════════════════════════════
; VOICEBRIDGE / ARI STASIS INTEGRATION
; ════════════════════════════════════════════════════════════════════════════
; These contexts handle AI voice bot integration via ARI Stasis + ExternalMedia
; Architecture: SIP → Stasis(voicebridge) → ARI/ExternalMedia → AI Bot → RTP duplex
; ═════════════════════════════════════════════════════════════════════════════

; ─── VoiceBridge Inbound: AI Voice Bot answers inbound calls ───────────────
; Called from: Inbound Route → Custom Destination → this context
; Or: Dinstar Tel→IP routing for specific DID → this context
[voicebridge-inbound]
exten => _X.,1,NoOp(VoiceBridge Inbound: AI Bot answering ${EXTEN} from ${CALLERID(num)})
 ; Answer the call before handing to Stasis
 same => n,Answer()
 ; Set CDR tracking
 same => n,Set(CDR(userfield)=VOICEBRIDGE_INBOUND:${CALLERID(num)}:${EXTEN})
 ; Record start time for analytics
 same => n,Set(VOICEBRIDGE_START=${EPOCH})
 ; Hand off to VoiceBridge ARI application
 ; The app name matches voicebridge.stasis-app-name in application.yml
 same => n,Stasis(voicebridge)
 ; If Stasis returns (app ended), hangup
 same => n,Hangup()

; ─── VoiceBridge Outbound: AI Bot initiates outbound calls ──────────────────
; Called from: AMI Originate → this context with RED_GW/RED_PORT_INDEX vars
; Or: VoiceBridge ARI app originates call → this context
[voicebridge-outbound]
exten => _X.,1,NoOp(VoiceBridge Outbound: AI Bot calling ${EXTEN})
 ; Validate gateway
 same => n,Set(GW=${IF($["${RED_GW}" != ""]?${RED_GW}:${DEFAULT_GW})})
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
 ; Set call tracking
 same => n,Set(RED_CALL_ID=${IF($["${RED_CALL_ID}" != ""]?${RED_CALL_ID}:${UNIQUEID})})
 same => n,Set(CDR(userfield)=VOICEBRIDGE_OUTBOUND:${GW}:${RED_CALL_ID}:${CALLERID(num)})
 ; Set caller ID to the AI bot's assigned number
 same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(num)=${RED_SIM_NUMBER}))
 same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(ani)=${RED_SIM_NUMBER}))
 ; Attach port index if needed
 same => n,Set(NEEDS_PORT=${IF($["${REGEX("^[0-9]+$" ${RED_PORT_INDEX})}" = "1" & "${REGEX("-port-[0-9]+$" ${GW})}" = "0"]?1:0)})
 same => n,ExecIf($["${NEEDS_PORT}" = "1"]?Set(GW=${GW}-port-${RED_PORT_INDEX}))
 ; Hand off to VoiceBridge Stasis for AI control
 same => n,Stasis(voicebridge)
 same => n,Hangup()

exten => _X.,n(badgw),NoOp(Rejected malformed gateway name: ${GW})
 same => n,Hangup(21)

; ─── VoiceBridge Handoff: Called from ARI app to bridge with specific endpoint ────
; Used by VoiceBridge ARI app to bridge AI media with a specific channel
[voicebridge-bridge]
exten => _X.,1,NoOp(VoiceBridge Bridge: Connecting ${CHANNEL(name)} to ${EXTEN})
 ; This is called via ARI channel originate from VoiceBridge app
 ; The dialplan just bridges - all logic is in ARI app
 same => n,Bridge(PJSIP/${EXTEN})
 same => n,Hangup()

; ─── VoiceBridge Transfer: SIP REFER handling for AI-to-human transfer ────────
; VoiceBridge uses SIP REFER to transfer to human agent queue
[voicebridge-transfer]
exten => _X.,1,NoOp(VoiceBridge Transfer: REFER to ${EXTEN})
 ; The REFER target is passed in the Refer-To header
 ; We just need to allow the transfer
 same => n,Set(REFER_TARGET=${SIP_HEADER(Refer-To)})
 same => n,NoOp(Transfer target: ${REFER_TARGET})
 same => n,Hangup()

; ─── VoiceBridge DTMF: Handle DTMF during AI calls ──────────────────────────
[voicebridge-dtmf]
exten => s,1,Return()
exten => _[0-9*#],1,NoOp(VoiceBridge DTMF: ${EXTEN} during AI call)
 ; Forward to ARI app via channel variable
 same => n,Set(VOICEBRIDGE_DTMF=${EXTEN})
 same => n,Return()

; ─── VoiceBridge Recording: On-demand recording control ──────────────────────
[voicebridge-record]
exten => start,1,NoOp(VoiceBridge Record: Start recording)
 same => n,Set(RECORD_FILE=${VOICEBRIDGE_RECORDING_PATH}/${UNIQUEID}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,MixMonitor(${RECORD_FILE}.wav,ab)
 same => n,Return()

exten => stop,1,NoOp(VoiceBridge Record: Stop recording)
 same => n,StopMixMonitor()
 same => n,Return()


; ─── from-red-client ──────────────────────────────────────────────────────

; ─── from-red-client-webrtc ──────────────────────────────────────────────
; PSTN outbound calls from the mobile app via WebRTC
; The user connects to Asterisk via WSS and is routed to DINSTAR
;
; CRITICAL: Channel-to-Call Binding — without this, ports get stuck
;
; Previous issue: This context only read X-Red-Gw and didn't set
; RED_CALL_ID or RED_PORT_INDEX. DinstarEventListener.handleVarSet
; only works with these variables, resulting in:
;   • No channel-callid key → handleHangup uses findCallIdFromPort
;   • No channel-port key → port release depends on channel name guessing
;   • No attachChannel → no RINGING/ACTIVE/ENDED stages reach the app
; Port stays reserved until timeout (up to 60 minutes).
;
; The app sends both headers (PstnWebRtcManager.kt:362-363):
;   X-Red-Call-Id: <callId from /api/pstn/bridge>
;   X-Red-Gw:      dinstar-...-port-N
; We extract the port from the endpoint name suffix — this is more accurate
; than guessing because the server sets it from users.pstn_port_index.
;
; LEGENDARY FIX: Progress() passthrough for real carrier ringback.
[from-red-client-webrtc]
exten => _X.,1,NoOp(WebRTC PSTN call from app: ${EXTEN} caller=${CALLERID(num)})
 ; Read custom headers from Android App WebRTC client
 same => n,Set(APP_GW=${PJSIP_HEADER(read,X-Red-Gw)})
 same => n,Set(GW=${IF($["${APP_GW}" != ""]?${APP_GW}:${DEFAULT_GW})})
 ; Validate gateway name to prevent injection attacks
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
 ; Extract callId from app — Set on channel variable produces VarSet captured by server
 same => n,Set(APP_CALL_ID=${FILTER(A-Za-z0-9\-,${PJSIP_HEADER(read,X-Red-Call-Id)})})
 same => n,ExecIf($["${APP_CALL_ID}" != ""]?Set(RED_CALL_ID=${APP_CALL_ID}))
 ; Extract physical port from endpoint name suffix (e.g. dinstar-port-7 or dinstar-gw-192-168-11-1-port-7)
 same => n,Set(EXTRACTED_PORT=${CUT(GW,port-,2)})
 same => n,ExecIf($["${EXTRACTED_PORT}" != ""]?Set(RED_PORT_INDEX=${EXTRACTED_PORT}))
 ; CDR tracking for complete audit trail
 same => n,Set(CDR(userfield)=WEBRTC_PSTN:${GW}:${RED_CALL_ID}:${CALLERID(num)})
 ; Bridge call: WebRTC ← Asterisk → DINSTAR
 same => n,NoOp(Bridging WebRTC call to DINSTAR: ${EXTEN} via ${GW} callId=${RED_CALL_ID} port=${RED_PORT_INDEX})
 ; Progress() sends 183 Session Progress WITH SDP for real carrier ringback passthrough
 same => n,Progress()
 ; Dial with DTMF forwarding support (U option)
 same => n,Dial(PJSIP/${EXTEN}@${GW},${DIAL_TIMEOUT},KU(from-dinstar-dtmf))
 same => n,NoOp(WebRTC PSTN leg ended: status=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()
 same => n(badgw),NoOp(Rejected malformed gateway name: ${GW})
 same => n,Hangup(21)

; ─── from-red-testcall ────────────────────────────────────────────────────
; سياق اختبار وتشخيص دائم — لا يُستخدم في الإنتاج، فقط للتحقق من:
;   1) مسار الصوت ثنائي الاتجاه (Echo)
;   2) رنين الناقل الحقيقي عبر GSM (ring test)
;   3) انتظار القناة للربط اليدوي (land)
;
; الاستخدام من CLI:
;   channel originate Local/echo-test@from-red-testcall extension land@from-red-testcall
;   channel originate PJSIP/780488700@dinstar-gw-192-168-11-1-port-7 application Echo
;
; ملاحظة الأرقام (2026-09-06):
;   785681741 = رقم الشريحة الفعلي في المنفذ 7 (الربط الدائم red_admin)
;   780488700 = هاتف اختبار خارجي (الوجهة — نتصل به لا منه)
[from-red-testcall]
; اختبار رنين حقيقي عبر GSM — يسمع المتصل رنين الناقل الفعلي (Progress passthrough)
exten => _X.,1,NoOp(RED live ring test to ${EXTEN} via port-7 SIM 785681741)
 same => n,Set(CALLERID(num)=785681741)
 same => n,Set(CALLERID(ani)=785681741)
 same => n,Progress()
 same => n,Dial(PJSIP/${EXTEN}@dinstar-gw-192-168-11-1-port-7,60)
 same => n,Verbose(0, RED-TEST-DIAL-END status=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()
; قناة انتظار للربط اليدوي — تبقى مفتوحة 70 ثانية للاختبار
exten => land,1,NoOp(RED test landing channel — waiting for manual bridge)
 same => n,Wait(70)
 same => n,Hangup()
; اختبار صدى محلي — يرد الصوت للتحقق من مسار RTP ثنائي الاتجاه
exten => echoland,1,NoOp(RED local echo test — speak to verify two-way RTP)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
; اختبار نغمة المشغل — للتحقق من tone_zone لكل مشغل يمني
exten => tonetest,1,NoOp(RED operator tone test for ${CALLERID(num)})
 same => n,Gosub(ye-operator-tone,s,1(${CALLERID(num)}))
 same => n,Answer()
 same => n,Playback(tt-monkeys)
 same => n,Hangup()





; --- WebRTC Configuration ---
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8090

[red-webrtc-client]
type=aor
max_contacts=5
remove_existing=yes

[red-webrtc-client]
type=auth
auth_type=userpass
password=red-secret-token
username=red-webrtc-client

[red-webrtc-client]
type=endpoint
aors=red-webrtc-client
auth=red-webrtc-client
context=from-red-client-webrtc
disallow=all
allow=opus,alaw,ulaw
dtls_auto_generate_cert=yes
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_timeout=60
rtp_timeout_hold=180
timers=yes
timers_min_se=90

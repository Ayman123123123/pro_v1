; IPs are generated dynamically by docker-entrypoint.sh from DINSTAR_IPS=192.168.11.1.
; This static template is overwritten at container boot — do not rely on it for diagnostics.
[global]
type=global
endpoint_identifier_order=username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
external_media_address=192.168.11.10
external_signaling_address=192.168.11.10
local_net=172.16.0.0/12
local_net=127.0.0.0/8

[anonymous]
type=endpoint
context=from-untrusted
disallow=all
allow=alaw,ulaw
allow_subscribe=no

; LEGENDARY FIX P0-8: Endpoint 'anonymous' has no AORs — REGISTER backend→Asterisk فاشل
; نقطة backend الموحدة (تطابق extensions.conf from-red-backend)
[red-backend]
type=aor
contact=sip:red-backend:5060
qualify_frequency=30
qualify_timeout=5.0
max_contacts=5

[red-backend]
type=auth
auth_type=userpass
username=red-backend
password=${RED_SIP_PASSWORD:-red-secret-token}
realm=red.sovereign

[red-backend]
type=endpoint
context=from-red-backend
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=red-backend
auth=red-backend
rtp_timeout=120
rtp_timeout_hold=180
timers=yes
timers_min_se=90

[dinstar-gw-192-168-11-1]
type=aor
contact=sip:192.168.11.1:5060
qualify_frequency=30
qualify_timeout=5.0

[dinstar-gw-192-168-11-1]
type=endpoint
context=from-dinstar
disallow=all
allow=alaw,ulaw,gsm,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=1000000
aors=dinstar-gw-192-168-11-1
transport=transport-udp
media_address=192.168.11.10
rtp_timeout=60
rtp_timeout_hold=180
timers=yes
timers_min_se=90
trust_id_inbound=yes
send_connected_line=no

[dinstar-gw-192-168-11-1]
type=identify
endpoint=dinstar-gw-192-168-11-1
match=192.168.11.1
match=172.16.0.0/12
match=10.0.0.0/8

; Per-port endpoints — each port has its own SIP listener socket.
; DINSTAR_PORT_SIP_PORTS=5068,5061,5062,5063,5064,5065,5066,5067
[dinstar-gw-192-168-11-1-port-0]
type=aor
contact=sip:192.168.11.1:5068
qualify_frequency=30

[dinstar-gw-192-168-11-1-port-0]
type=endpoint
context=from-dinstar
disallow=all
allow=alaw,ulaw,gsm,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=1000000
aors=dinstar-gw-192-168-11-1-port-0
transport=transport-udp
media_address=192.168.11.10
set_var=RED_PORT_INDEX=0
rtp_timeout=60
rtp_timeout_hold=180
timers=yes
timers_min_se=90


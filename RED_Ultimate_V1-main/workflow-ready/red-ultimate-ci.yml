name: RED Ultimate CI
on: [push]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - run: chmod +x RED_Ultimate/gradlew && RED_Ultimate/gradlew :shared-proto:build :backend-server:test --dependency-verification strict
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd RED_Ultimate/admin_dashboard && npm ci && npm run build
  sfu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd RED_Ultimate/media-sfu && npm ci && node --check server.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - run: chmod +x RED_Ultimate/gradlew && RED_Ultimate/gradlew :app:assembleDebug -PRED_SERVER_URL=http://192.168.1.50 --dependency-verification strict
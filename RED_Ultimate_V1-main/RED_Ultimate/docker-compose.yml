name: red-sovereign

x-common-variables: &common-variables
  TZ: "UTC"
  LANG: "C.UTF-8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-resource-limits-small: &resource-limits-small
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: '0.5'
      reservations:
        memory: 128M
        cpus: '0.25'

x-resource-limits-medium: &resource-limits-medium
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
      reservations:
        memory: 256M
        cpus: '0.5'

x-resource-limits-large: &resource-limits-large
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: '1.5'
      reservations:
        memory: 512M
        cpus: '0.75'

x-resource-limits-xlarge: &resource-limits-xlarge
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '2.0'
      reservations:
        memory: 1G
        cpus: '1.0'

services:
  # ━━━━━━━━━━━━ 1. Infrastructure ━━━━━━━━━━━━
  postgres:
    image: postgres:16.15-bookworm
    container_name: red-db-sql
    restart: unless-stopped
    <<: *resource-limits-xlarge
    environment:
      <<: *common-variables
      - POSTGRES_DB=red_sovereign
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
      - -c
      - effective_cache_size=1GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "red_sovereign"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - db_password

  mongo:
    image: mongo:8.0.13-noble
    container_name: red-db-nosql
    restart: unless-stopped
    <<: *resource-limits-xlarge
    environment:
      <<: *common-variables
      - MONGO_INITDB_ROOT_USERNAME=red_user
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_password
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "2"
      - --enableMajorityReadConcern
      - "false"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username red_user --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      <<: *healthcheck-defaults
      start_period: 40s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - mongo_password

  redis:
    image: redis:7.4.11-bookworm
    container_name: red-cache
    restart: unless-stopped
    <<: *resource-limits-medium
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - "volatile-lru"
      - --save
      - "900 1"
      - --save
      - "300 10"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  minio:
    image: minio/minio:RELEASE.2026-06-06T02-44-06Z
    container_name: red-storage
    restart: unless-stopped
    <<: *resource-limits-medium
    command: server /data --console-address ":9001"
    environment:
      <<: *common-variables
      - MINIO_ROOT_USER=redadmin
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      <<: *healthcheck-defaults
      start_period: 20s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - minio_password

  # ━━━━━━━━━━━━ 2. Application Services ━━━━━━━━━━━━
  identity-init:
    image: alpine:3.22
    container_name: red-identity-init
    restart: "no"
    network_mode: none
    read_only: true
    command:
      - sh
      - -ec
      - |
        private=/source/red_identity_private_key.pem
        public=/source/red_identity_public_key.pem
        [ -f "$$private" ] && [ -s "$$private" ] || { echo '[identity] missing private key' >&2; exit 1; }
        [ -f "$$public" ] && [ -s "$$public" ] || { echo '[identity] missing public key' >&2; exit 1; }
        cp "$$private" /target/red_identity_private_key.pem.tmp
        cp "$$public" /target/red_identity_public_key.pem.tmp
        chown 10001:10001 /target/*.tmp
        chmod 400 /target/red_identity_private_key.pem.tmp
        chmod 444 /target/red_identity_public_key.pem.tmp
        mv -f /target/red_identity_private_key.pem.tmp /target/red_identity_private_key.pem
        mv -f /target/red_identity_public_key.pem.tmp /target/red_identity_public_key.pem
        echo '[identity] authority keys staged for non-root backend'
    volumes:
      - ./secrets:/source:ro
      - identity-secrets:/target
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend-server/Dockerfile
    image: red-backend:prod
    container_name: red-backend
    restart: unless-stopped
    <<: *resource-limits-xlarge
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    environment:
      <<: *common-variables
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - YOUNES_RUNTIME=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/red_sovereign
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD_FILE=/run/secrets/db_password
      - SPRING_DATA_MONGODB_URI=mongodb://red_user:$${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/red_sovereign?authSource=admin
      - MONGO_USER=red_user
      - MONGO_PASSWORD_FILE=/run/secrets/mongo_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SFU_TICKET_SECRET_FILE=/run/secrets/sfu_ticket_secret
      - RED_ADMIN_USERNAME=${RED_ADMIN_USERNAME}
      - RED_ADMIN_PASSWORD_FILE=/run/secrets/red_admin_password
      - OPENRELAY_ENABLED=${OPENRELAY_ENABLED:-false}
      - OPENRELAY_USERNAME=${OPENRELAY_USERNAME:-openrelayproject}
      - OPENRELAY_PASSWORD=${OPENRELAY_PASSWORD:-openrelayproject}
      - DB_USER=${DB_USER:-admin}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=redadmin
      - MINIO_BUCKET=red-media
      - MINIO_BUCKET_MEDIA=red-media
      - MINIO_BUCKET_AVATARS=red-avatars
      - MINIO_BUCKET_STORIES=red-stories
      - RED_RETENTION_AUDIT_DAYS=${RED_RETENTION_AUDIT_DAYS:-365}
      - RED_RETENTION_CDR_DAYS=${RED_RETENTION_CDR_DAYS:-365}
      - RED_RETENTION_HEALTH_DAYS=${RED_RETENTION_HEALTH_DAYS:-90}
      - RED_RETENTION_TELEMETRY_DAYS=${RED_RETENTION_TELEMETRY_DAYS:-90}
      - RED_RETENTION_BATCH_SIZE=${RED_RETENTION_BATCH_SIZE:-10000}
      - MINIO_PASSWORD_FILE=/run/secrets/minio_password
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RED_IDENTITY_PRIVATE_KEY_PATH=/run/secrets/red_identity_private_key
      - RED_IDENTITY_PUBLIC_KEY_PATH=/run/secrets/red_identity_public_key
      - RED_DEVICE_CERTIFICATE_VALID_DAYS=${RED_DEVICE_CERTIFICATE_VALID_DAYS:-90}
      - REFRESH_EXPIRATION_DAYS=${REFRESH_EXPIRATION_DAYS:-30}
      - TURN_SECRET_FILE=/run/secrets/turn_secret
      - PUSH_ALLOW_HTTP_ENDPOINTS=${PUSH_ALLOW_HTTP_ENDPOINTS:-true}
      - PUSH_CONNECT_TIMEOUT_MS=${PUSH_CONNECT_TIMEOUT_MS:-5000}
      - PUSH_READ_TIMEOUT_MS=${PUSH_READ_TIMEOUT_MS:-5000}
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP}
      - TURN_PORT=3478
      - BACKUP_ROOT=/backups
      - RED_TRUST_X_FORWARDED_FOR=true
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - RED_ADMIN_COOKIE_SECURE=${RED_ADMIN_COOKIE_SECURE:-true}
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1g -XX:+UseG1GC -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - identity-secrets:/run/secrets/identity:ro
      - backup-data:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    stop_grace_period: 30s
    depends_on:
      identity-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - db_password
      - mongo_password
      - redis_password
      - jwt_secret
      - sfu_ticket_secret
      - red_admin_password
      - minio_password
      - turn_secret
      - red_identity_private_key
      - red_identity_public_key

  media-sfu:
    build:
      context: ./media-sfu
      dockerfile: Dockerfile
    image: red-media-sfu:prod
    container_name: red-media-sfu
    restart: unless-stopped
    <<: *resource-limits-xlarge
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'
    environment:
      <<: *common-variables
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SFU_TICKET_SECRET_FILE=/run/secrets/sfu_ticket_secret
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP}
      - MEDIASOUP_EXTERNAL_IP=${MEDIASOUP_EXTERNAL_IP}
      - MEDIASOUP_WORKERS=${MEDIASOUP_WORKERS:-4}
      - MEDIASOUP_FORCE_LOCAL_BUILD=${MEDIASOUP_FORCE_LOCAL_BUILD:-}
      - RTC_MIN_PORT=${RTC_MIN_PORT:-40000}
      - RTC_MAX_PORT=${RTC_MAX_PORT:-40100}
    ports:
      - "4000:4000"
      - "40000-40100:40000-40100/udp"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      <<: *healthcheck-defaults
      start_period: 20s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - jwt_secret
      - sfu_ticket_secret

  admin-dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    image: red-admin-dashboard:prod
    container_name: red-admin-dashboard
    restart: unless-stopped
    <<: *resource-limits-small
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/panel-alive"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 3. Networking ━━━━━━━━━━━━
  nginx:
    image: nginx:1.29.1-alpine
    container_name: red-proxy
    restart: unless-stopped
    <<: *resource-limits-small
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      admin-dashboard:
        condition: service_healthy
      media-sfu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  coturn:
    image: coturn/coturn:4.6.2-r10
    container_name: red-turn
    restart: unless-stopped
    <<: *resource-limits-small
    command:
      - -n
      - --lt-cred-mech
      - --realm=red.sovereign
      - --user=turn:$${TURN_PASSWORD}
      - --static-auth-secret=$${TURN_SECRET}
      - --min-port=45000
      - --max-port=45050
      - --external-ip=${TURN_EXTERNAL_IP:-${TURN_PUBLIC_HOST}}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "443:443/tcp"
      - "80:80/tcp"
      - "45000-45050:45000-45050/udp"
      - "45000-45050:45000-45050/tcp"
    environment:
      <<: *common-variables
      - TURN_SECRET_FILE=/run/secrets/turn_secret
      - TURN_PASSWORD_FILE=/run/secrets/turn_password
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3478' || exit 1"]
      <<: *healthcheck-defaults
      start_period: 10s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - turn_secret
      - turn_password

  # ━━━━━━━━━━━━ 4. Observability ━━━━━━━━━━━━
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: red-prometheus
    restart: unless-stopped
    <<: *resource-limits-medium
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: red-grafana
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - grafana_admin_password

  loki:
    image: grafana/loki:3.7.7
    container_name: red-loki
    restart: unless-stopped
    <<: *resource-limits-medium
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki-data:/loki
      - ./infrastructure/observability/loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: red-tempo
    restart: unless-stopped
    <<: *resource-limits-medium
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - tempo-data:/var/tempo
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4319:4317"
      - "4320:4318"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  pyroscope:
    image: grafana/pyroscope:1.10.0
    container_name: red-pyroscope
    restart: unless-stopped
    <<: *resource-limits-medium
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.0
    container_name: red-otel-collector
    restart: unless-stopped
    <<: *resource-limits-small
    command: --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./infrastructure/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

networks:
  red-net:
    driver: bridge
    enable_ipv6: false

volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  pyroscope-data:
    driver: local
  certs:
    driver: local
  backup-data:
    driver: local
  identity-secrets:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  sfu_ticket_secret:
    file: ./secrets/sfu_ticket_secret.txt
  red_admin_password:
    file: ./secrets/red_admin_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
  turn_secret:
    file: ./secrets/turn_secret.txt
  turn_password:
    file: ./secrets/turn_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  red_identity_private_key:
    file: ./secrets/red_identity_private_key.pem
  red_identity_public_key:
    file: ./secrets/red_identity_public_key.pem
name: red-sovereign

x-common-variables: &common-variables
  TZ: "UTC"
  LANG: "C.UTF-8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-resource-limits-small: &resource-limits-small
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: '0.5'
      reservations:
        memory: 128M
        cpus: '0.25'

x-resource-limits-medium: &resource-limits-medium
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
      reservations:
        memory: 256M
        cpus: '0.5'

x-resource-limits-large: &resource-limits-large
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: '1.5'
      reservations:
        memory: 512M
        cpus: '0.75'

x-resource-limits-xlarge: &resource-limits-xlarge
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '2.0'
      reservations:
        memory: 1G
        cpus: '1.0'

services:
  # ━━━━━━━━━━━━ 1. Infrastructure ━━━━━━━━━━━━
  postgres:
    image: postgres:16.15-bookworm
    container_name: red-db-sql
    restart: unless-stopped
    <<: *resource-limits-xlarge
    environment:
      <<: *common-variables
      POSTGRES_DB: "red_sovereign"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD_FILE: "/run/secrets/db_password"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
      - -c
      - effective_cache_size=1GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "red_sovereign"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - db_password

  mongo:
    image: mongo:8.0.13-noble
    container_name: red-db-nosql
    restart: unless-stopped
    <<: *resource-limits-xlarge
    environment:
      <<: *common-variables
      MONGO_INITDB_ROOT_USERNAME: "red_user"
      MONGO_INITDB_ROOT_PASSWORD_FILE: "/run/secrets/mongo_password"
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "2"
      - --enableMajorityReadConcern
      - "false"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # _FILE model: MONGO_INITDB_ROOT_PASSWORD is never exported in this container,
      # so read the mounted secret file directly (old probe used an empty env var).
      test: ["CMD-SHELL", "mongosh --quiet --username red_user --password \"$$(cat /run/secrets/mongo_password)\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      <<: *healthcheck-defaults
      start_period: 40s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - mongo_password

  redis:
    image: redis:7.4.11-bookworm
    container_name: red-cache
    restart: unless-stopped
    <<: *resource-limits-medium
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - "volatile-lru"
      - --save
      - "900 1"
      - --save
      - "300 10"
    volumes:
      - redis-data:/data
    healthcheck:
      # REDISCLI_AUTH avoids `-a` (which leaks the password in `ps` output).
      # NOTE: keep ./secrets/redis_password.txt identical to the host $REDIS_PASSWORD
      # interpolated in `command:` above — the server password and this probe must match.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --raw ping | grep -q PONG"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - redis_password

  minio:
    image: minio/minio:RELEASE.2026-06-06T02-44-06Z
    container_name: red-storage
    restart: unless-stopped
    <<: *resource-limits-medium
    command: server /data --console-address ":9001"
    environment:
      <<: *common-variables
      MINIO_ROOT_USER: "redadmin"
      MINIO_ROOT_PASSWORD_FILE: "/run/secrets/minio_password"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      <<: *healthcheck-defaults
      start_period: 20s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - minio_password

  # ━━━━━━━━━━━━ 2. Application Services ━━━━━━━━━━━━
  identity-init:
    image: alpine:3.22
    container_name: red-identity-init
    restart: "no"
    network_mode: none
    read_only: true
    command:
      - sh
      - -ec
      - |
        private=/source/red_identity_private_key.pem
        public=/source/red_identity_public_key.pem
        [ -f "$$private" ] && [ -s "$$private" ] || { echo '[identity] missing private key' >&2; exit 1; }
        [ -f "$$public" ] && [ -s "$$public" ] || { echo '[identity] missing public key' >&2; exit 1; }
        cp "$$private" /target/red_identity_private_key.pem.tmp
        cp "$$public" /target/red_identity_public_key.pem.tmp
        chown 10001:10001 /target/*.tmp
        chmod 400 /target/red_identity_private_key.pem.tmp
        chmod 444 /target/red_identity_public_key.pem.tmp
        mv -f /target/red_identity_private_key.pem.tmp /target/red_identity_private_key.pem
        mv -f /target/red_identity_public_key.pem.tmp /target/red_identity_public_key.pem
        echo '[identity] authority keys staged for non-root backend'
    volumes:
      - ./secrets:/source:ro
      - identity-secrets:/target
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend-server/Dockerfile
    image: red-backend:prod
    restart: unless-stopped
    <<: *resource-limits-xlarge
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    # Secrets model (unified): every credential is mounted via `secrets:` as a *_FILE
    # pointer and materialized into plain env by backend-server/entrypoint.sh BEFORE
    # Spring boots (Spring does not resolve *_FILE natively). Activation needs one
    # Dockerfile line (out of scope here): COPY entrypoint.sh + ENTRYPOINT ["/app/entrypoint.sh"].
    # NOTE: media-sfu mounts JWT/SFU *_FILE too but Node reads plain JWT_SECRET /
    # SFU_TICKET_SECRET — the same file_env shim is still TODO on that service.
    environment:
      <<: *common-variables
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"
      YOUNES_RUNTIME: "docker"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/red_sovereign"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD_FILE: "/run/secrets/db_password"
      SPRING_DATA_MONGODB_URI: "mongodb://red_user:$${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/red_sovereign?authSource=admin"
      MONGO_USER: "red_user"
      MONGO_PASSWORD_FILE: "/run/secrets/mongo_password"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PASSWORD_FILE: "/run/secrets/redis_password"
      JWT_SECRET_FILE: "/run/secrets/jwt_secret"
      SFU_TICKET_SECRET_FILE: "/run/secrets/sfu_ticket_secret"
      RED_ADMIN_USERNAME: "${RED_ADMIN_USERNAME}"
      RED_ADMIN_PASSWORD_FILE: "/run/secrets/red_admin_password"
      OPENRELAY_ENABLED: "${OPENRELAY_ENABLED:-false}"
      OPENRELAY_USERNAME: "${OPENRELAY_USERNAME:-openrelayproject}"
      OPENRELAY_PASSWORD: "${OPENRELAY_PASSWORD:-openrelayproject}"
      DB_USER: "${DB_USER:-admin}"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "redadmin"
      MINIO_BUCKET: "red-media"
      MINIO_BUCKET_MEDIA: "red-media"
      MINIO_BUCKET_AVATARS: "red-avatars"
      MINIO_BUCKET_STORIES: "red-stories"
      RED_RETENTION_AUDIT_DAYS: "${RED_RETENTION_AUDIT_DAYS:-365}"
      RED_RETENTION_CDR_DAYS: "${RED_RETENTION_CDR_DAYS:-365}"
      RED_RETENTION_HEALTH_DAYS: "${RED_RETENTION_HEALTH_DAYS:-90}"
      RED_RETENTION_TELEMETRY_DAYS: "${RED_RETENTION_TELEMETRY_DAYS:-90}"
      RED_RETENTION_BATCH_SIZE: "${RED_RETENTION_BATCH_SIZE:-10000}"
      MINIO_PASSWORD_FILE: "/run/secrets/minio_password"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      RED_IDENTITY_PRIVATE_KEY_PATH: "/run/secrets/red_identity_private_key"
      RED_IDENTITY_PUBLIC_KEY_PATH: "/run/secrets/red_identity_public_key"
      RED_DEVICE_CERTIFATE_VALID_DAYS: "${RED_DEVICE_CERTIFICATE_VALID_DAYS:-90}"
      REFRESH_EXPIRATION_DAYS: "${REFRESH_EXPIRATION_DAYS:-30}"
      TURN_SECRET_FILE: "/run/secrets/turn_secret"
      PUSH_ALLOW_HTTP_ENDPOINTS: "${PUSH_ALLOW_HTTP_ENDPOINTS:-true}"
      PUSH_CONNECT_TIMEOUT_MS: "${PUSH_CONNECT_TIMEOUT_MS:-5000}"
      PUSH_READ_TIMEOUT_MS: "${PUSH_READ_TIMEOUT_MS:-5000}"
      TURN_PUBLIC_HOST: "${TURN_PUBLIC_HOST}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP}"
      TURN_PORT: "3478"
      BACKUP_ROOT: "/backups"
      RED_TRUST_X_FORWARDED_FOR: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      RED_ADMIN_COOKIE_SECURE: "${RED_ADMIN_COOKIE_SECURE:-true}"
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g -XX:+UseZGC -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - identity-secrets:/run/secrets/identity:ro
      - backup-data:/backups
      # Makes entrypoint.sh visible at /app/entrypoint.sh; inert until the Dockerfile
      # ENTRYPOINT wires it (see environment note above).
      - ./backend-server/entrypoint.sh:/app/entrypoint.sh:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    stop_grace_period: 30s
    depends_on:
      identity-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Canonical probes (probes enabled in application.yml):
      #   liveness  = /actuator/health/liveness (no dependencies, always 200 when JVM alive)
      #   readiness = /actuator/health/readiness (503 while mandatory services are down)
      # Legacy app aliases kept by HealthController + edge nginx: /health/live, /health.
      # PREREQ (SecurityConfig, out of scope): permitAll currently matches exact
      # "/actuator/health" while "/actuator/**" needs ADMIN — subpaths /liveness and
      # /readiness must be opened to anonymous, else this probe gets 403. Fallback if
      # not yet fixed: probe http://localhost:8080/health/live instead.
      # NOTE: backend Dockerfile HEALTHCHECK still probes legacy /health (Dockerfile out of scope).
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - db_password
      - mongo_password
      - redis_password
      - jwt_secret
      - sfu_ticket_secret
      - red_admin_password
      - minio_password
      - turn_secret
      - red_identity_private_key
      - red_identity_public_key

  media-sfu:
    build:
      context: ./media-sfu
      dockerfile: Dockerfile
    image: red-media-sfu:prod
    restart: unless-stopped
    <<: *resource-limits-xlarge
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'
    environment:
      <<: *common-variables
      JWT_SECRET_FILE: "/run/secrets/jwt_secret"
      SFU_TICKET_SECRET_FILE: "/run/secrets/sfu_ticket_secret"
      # NOTE: Node reads plain JWT_SECRET/SFU_TICKET_SECRET, not *_FILE — same
      # file_env shim as backend entrypoint.sh is still TODO here (doc only).
      MEDIASOUP_ANNOUNCED_IP: "${MEDIASOUP_ANNOUNCED_IP}"
      MEDIASOUP_EXTERNAL_IP: "${MEDIASOUP_EXTERNAL_IP}"
      MEDIASOUP_WORKERS: "${MEDIASOUP_WORKERS:-4}"
      MEDIASOUP_FORCE_LOCAL_BUILD: "${MEDIASOUP_FORCE_LOCAL_BUILD:-}"
      RTC_MIN_PORT: "${RTC_MIN_PORT:-40000}"
      RTC_MAX_PORT: "${RTC_MAX_PORT:-40100}"
    ports:
      - "4000:4000"
      - "40000-40100:40000-40100/udp"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      <<: *healthcheck-defaults
      start_period: 20s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - jwt_secret
      - sfu_ticket_secret

  admin-dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    image: red-admin-dashboard:prod
    restart: unless-stopped
    <<: *resource-limits-small
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/panel-alive"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 3. Networking ━━━━━━━━━━━━
  # TLS bootstrap (one-shot, doc only — uncomment to enable). Fills the `certs`
  # volume consumed at /etc/ssl/red by nginx. Image built from
  # infrastructure/tls-init.Dockerfile (mkcert: localhost + red.local + $TLS_SAN_*).
  # First boot: `docker compose up tls-init` (or add it to nginx depends_on), then start nginx.
  # tls-init:
  #   build:
  #     context: .
  #     dockerfile: infrastructure/tls-init.Dockerfile
  #   container_name: red-tls-init
  #   restart: "no"
  #   network_mode: none
  #   environment:
  #     - TLS_SAN_DNS=${TLS_SAN_DNS:-localhost,red.local}
  #     - TLS_SAN_IP=${TLS_SAN_IP:-127.0.0.1}
  #   volumes:
  #     - certs:/etc/ssl/red
  #   logging: *default-logging
  nginx:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    <<: *resource-limits-small
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Must match nginx.conf ssl_certificate paths (/etc/ssl/red/fullchain.pem and
      # /etc/ssl/red/privkey.pem), populated by the tls-init one-shot below.
      - certs:/etc/ssl/red:ro
    depends_on:
      backend:
        condition: service_healthy
      admin-dashboard:
        condition: service_healthy
      media-sfu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  coturn:
    image: coturn/coturn:4.6.2-r10
    restart: unless-stopped
    <<: *resource-limits-small
    command:
      - -n
      - --lt-cred-mech
      - --realm=red.sovereign
      - --user=turn:$${TURN_PASSWORD}
      - --static-auth-secret=$${TURN_SECRET}
      - --min-port=45000
      - --max-port=45050
      - --external-ip=${TURN_EXTERNAL_IP:-${TURN_PUBLIC_HOST}}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "45000-45050:45000-45050/udp"
      - "45000-45050:45000-45050/tcp"
    environment:
      <<: *common-variables
      TURN_SECRET_FILE: "/run/secrets/turn_secret"
      TURN_PASSWORD_FILE: "/run/secrets/turn_password"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3478' || exit 1"]
      <<: *healthcheck-defaults
      start_period: 10s
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - turn_secret
      - turn_password

  # ━━━━━━━━━━━━ 4. Observability ━━━━━━━━━━━━
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: red-prometheus
    restart: unless-stopped
    <<: *resource-limits-medium
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=50GB
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: red-alertmanager
    restart: unless-stopped
    <<: *resource-limits-small
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/observability/alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: red-grafana
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel,grafana-worldmap-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]
    secrets:
      - grafana_admin_password

  loki:
    image: grafana/loki:3.7.7
    container_name: red-loki
    restart: unless-stopped
    <<: *resource-limits-medium
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki-data:/loki
      - ./infrastructure/observability/loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: red-tempo
    restart: unless-stopped
    <<: *resource-limits-medium
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - tempo-data:/var/tempo
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  pyroscope:
    image: grafana/pyroscope:1.10.0
    container_name: red-pyroscope
    restart: unless-stopped
    <<: *resource-limits-medium
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.0
    container_name: red-otel-collector
    restart: unless-stopped
    <<: *resource-limits-small
    command: --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./infrastructure/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133"]
      <<: *healthcheck-defaults
    logging: *default-logging
    networks: ["red-net"]

  # Exporters
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: red-node-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro,rslave
      - /sys:/host/sys:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: red-cadvisor
    restart: unless-stopped
    <<: *resource-limits-medium
    privileged: true
    pid: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks: ["red-net"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      <<: *healthcheck-defaults
    logging: *default-logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: red-postgres-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - DATA_SOURCE_NAME=postgresql://admin:$${DB_PASSWORD}@postgres:5432/red_sovereign?sslmode=disable
    ports:
      - "9187:9187"
    networks: ["red-net"]
    depends_on:
      - postgres
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: red-redis-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=$${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks: ["red-net"]
    depends_on:
      - redis
    logging: *default-logging

  mongodb-exporter:
    image: percona/mongodb_exporter:v0.42.0
    container_name: red-mongodb-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - MONGODB_URI=mongodb://red_user:$${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/admin
    ports:
      - "9216:9216"
    networks: ["red-net"]
    depends_on:
      - mongo
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: red-nginx-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - NGINX_SCRAPE_URI=http://nginx:8088/stub_status
    ports:
      - "9113:9113"
    networks: ["red-net"]
    depends_on:
      - nginx
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: red-blackbox-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    ports:
      - "9115:9115"
    volumes:
      - ./infrastructure/observability/blackbox:/etc/blackbox_exporter
    networks: ["red-net"]
    logging: *default-logging

networks:
  red-net:
    driver: bridge
    enable_ipv6: false

volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  pyroscope-data:
    driver: local
  certs:
    driver: local
  backup-data:
    driver: local
  identity-secrets:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  sfu_ticket_secret:
    file: ./secrets/sfu_ticket_secret.txt
  red_admin_password:
    file: ./secrets/red_admin_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
  turn_secret:
    file: ./secrets/turn_secret.txt
  turn_password:
    file: ./secrets/turn_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  red_identity_private_key:
    file: ./secrets/red_identity_private_key.pem
  red_identity_public_key:
    file: ./secrets/red_identity_public_key.pem
name: red-sovereign

# ══════════════════════════════════════════════════════════════════
# 🏛️ YOUNES Sovereign Platform — Docker Compose
# PostgreSQL 16 + MongoDB 8 + Redis 7 + MinIO + Spring Boot + Nginx + MediaSFU + Asterisk + Coturn
# ══════════════════════════════════════════════════════════════════

services:
  # ━━━━━━━━━━━━ 1. الباك اند الرئيسي ━━━━━━━━━━━━
  backend:
    build:
      context: .
      dockerfile: backend-server/Dockerfile
    container_name: red-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-postgres:5432/red_sovereign
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - SPRING_DATA_MONGODB_URI=mongodb://red_user:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@db-mongo:27017/red_sovereign?authSource=admin
      - SPRING_DATA_REDIS_HOST=cache-redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - ASTERISK_AMI_HOST=pstn-gateway
      - ASTERISK_AMI_USER=red_admin
      - ASTERISK_AMI_PASSWORD=${AMI_PASSWORD:?AMI_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RED_ADMIN_USERNAME=${RED_ADMIN_USERNAME:?RED_ADMIN_USERNAME is required}
      - RED_ADMIN_PASSWORD=${RED_ADMIN_PASSWORD:?RED_ADMIN_PASSWORD is required}
      - DINSTAR_USERNAME=${DINSTAR_USERNAME:?DINSTAR_USERNAME is required}
      - DINSTAR_PASSWORD=${DINSTAR_PASSWORD:?DINSTAR_PASSWORD is required}
      - DINSTAR_IP=${DINSTAR_IP:-192.168.11.1}
      - DINSTAR_PORT=${DINSTAR_PORT:-443}
      - DINSTAR_SCHEME=${DINSTAR_SCHEME:-https}
      - MINIO_PASSWORD=${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - RED_IDENTITY_PRIVATE_KEY_PATH=/run/secrets/red_identity_private_key.pem
      - RED_IDENTITY_PUBLIC_KEY_PATH=/run/secrets/red_identity_public_key.pem
      - REFRESH_EXPIRATION_DAYS=${REFRESH_EXPIRATION_DAYS:-30}
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET is required}
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST:-127.0.0.1}
      - TURN_PORT=3478
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db-postgres: { condition: service_healthy }
      db-mongo: { condition: service_healthy }
      cache-redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 2. VoIP/Conference SFU ━━━━━━━━━━━━
  media-sfu:
    build: ./media-sfu
    container_name: red-media-sfu
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:?MEDIASOUP_ANNOUNCED_IP is required}
      - MEDIASOUP_WORKERS=${MEDIASOUP_WORKERS:-2}
    ports: ["4000:4000", "40000-40100:40000-40100/udp"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 3. TURN/STUN Relay ━━━━━━━━━━━━
  coturn:
    image: coturn/coturn
    container_name: red-turn
    restart: unless-stopped
    command:
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --realm=red.sovereign
      - --min-port=45000
      - --max-port=45050
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "45000-45050:45000-45050/udp"
    healthcheck:
      # صورة coturn لا تحوي curl — نفحص منفذ TURN عبر bash /dev/tcp
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3478' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 4. PSTN Gateway: Asterisk PBX ━━━━━━━━━━━━
  pstn-gateway:
    build: ./pstn-asterisk
    container_name: red-pstn-gateway
    restart: unless-stopped
    environment:
      - AMI_PASSWORD=${AMI_PASSWORD:?AMI_PASSWORD is required}
      - DINSTAR_IP=${DINSTAR_IP:-192.168.11.1}
      - DINSTAR_SIP_USER=${DINSTAR_SIP_USER:?DINSTAR_SIP_USER is required}
      - DINSTAR_SIP_PASSWORD=${DINSTAR_SIP_PASSWORD:?DINSTAR_SIP_PASSWORD is required}
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    expose: ["5038"]
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 5. PostgreSQL 16 ━━━━━━━━━━━━
  db-postgres:
    image: postgres:16
    container_name: red-db-sql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=red_sovereign
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=500"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "red_sovereign"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 6. MongoDB 8 ━━━━━━━━━━━━
  db-mongo:
    image: mongo:8
    container_name: red-db-nosql
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=red_user
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username red_user --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 7. Redis 7 ━━━━━━━━━━━━
  cache-redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    container_name: red-cache
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: ["red-net"]

  # ━━━━━━━━━━━━ 8. MinIO (S3-compatible) ━━━━━━━━━━━━
  minio:
    image: minio/minio
    container_name: red-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      - MINIO_ROOT_USER=redadmin
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: ["red-net"]

  # ━━━━ تهيئة شهادات TLS — ذاتية التوقيع بالتطوير ومعالجة تلقائية لجميع المسارات ━━━━
  # يدعم التوافقية الكاملة مع /etc/ssl/private/privkey.pem و /etc/ssl/certs/ و /etc/ssl/red/
  # ويعالج مشكلة فخ المجلدات الفارغة (Docker Bind Mount Trap) وتوليد الشهادات غير المكتمل
  certs-init:
    image: nginx:1.27-alpine
    container_name: red-certs-init
    restart: "no"
    command:
      - "sh"
      - "-c"
      - |
        mkdir -p /etc/ssl/red /etc/ssl/certs /etc/ssl/private /var/www/certbot
        for p in /etc/ssl/red/fullchain.pem /etc/ssl/red/privkey.pem /etc/ssl/certs/fullchain.pem /etc/ssl/certs/privkey.pem /etc/ssl/private/privkey.pem; do
          if [ -d "$$p" ]; then echo "[fix] Removing directory mistaken for cert file: $$p"; rm -rf "$$p"; fi
        done
        if [ -s /etc/ssl/red/fullchain.pem ] && [ -s /etc/ssl/red/privkey.pem ]; then
          echo '[ok] TLS cert and private key already present and valid';
        else
          echo '[init] Generating resilient self-signed TLS cert & key...';
          apk add --no-cache openssl >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 \
            -subj '/CN=red.local' \
            -addext 'subjectAltName=DNS:localhost,DNS:red.local,IP:127.0.0.1' \
            -keyout /etc/ssl/red/privkey.pem.tmp \
            -out /etc/ssl/red/fullchain.pem.tmp
          mv -f /etc/ssl/red/privkey.pem.tmp /etc/ssl/red/privkey.pem
          mv -f /etc/ssl/red/fullchain.pem.tmp /etc/ssl/red/fullchain.pem
          chmod 600 /etc/ssl/red/privkey.pem
          chmod 644 /etc/ssl/red/fullchain.pem
          echo '[ok] Self-signed TLS certs generated atomically';
        fi
        ln -sf /etc/ssl/red/fullchain.pem /etc/ssl/certs/fullchain.pem
        ln -sf /etc/ssl/red/privkey.pem /etc/ssl/certs/privkey.pem
        ln -sf /etc/ssl/red/privkey.pem /etc/ssl/private/privkey.pem
        chmod 755 /etc/ssl/private /etc/ssl/red /etc/ssl/certs 2>/dev/null || true
    volumes:
      - red-certs:/etc/ssl/red
      - certbot-www:/var/www/certbot

  # ━━━━━━━━━━━━ 9. Nginx Proxy + Admin UI ━━━━━━━━━━━━
  nginx:
    image: nginx:1.27-alpine
    container_name: red-proxy
    restart: unless-stopped
    ports: ["${RED_HTTP_PORT:-8088}:80", "${RED_HTTPS_PORT:-8443}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - red-certs:/etc/ssl/red:ro
      - certbot-www:/var/www/certbot:ro
    # Self-healing: معالجة ذاتية تضمن توفر المفتاح والشهادة والروابط التوافقية حتى لو شُغّلت الحاوية منفردة
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        mkdir -p /etc/ssl/red /etc/ssl/certs /etc/ssl/private /var/www/certbot
        for p in /etc/ssl/red/fullchain.pem /etc/ssl/red/privkey.pem /etc/ssl/certs/fullchain.pem /etc/ssl/certs/privkey.pem /etc/ssl/private/privkey.pem; do
          if [ -d "$$p" ]; then echo "[fix] Removing directory mistaken for cert file: $$p"; rm -rf "$$p"; fi
        done
        if [ ! -s /etc/ssl/red/fullchain.pem ] || [ ! -s /etc/ssl/red/privkey.pem ]; then
          echo '[fix] Generating fallback self-signed TLS certs...';
          apk add --no-cache openssl >/dev/null 2>&1;
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 \
            -subj '/CN=red.local' \
            -addext 'subjectAltName=DNS:localhost,DNS:red.local,IP:127.0.0.1' \
            -keyout /etc/ssl/red/privkey.pem.tmp \
            -out /etc/ssl/red/fullchain.pem.tmp;
          mv -f /etc/ssl/red/privkey.pem.tmp /etc/ssl/red/privkey.pem;
          mv -f /etc/ssl/red/fullchain.pem.tmp /etc/ssl/red/fullchain.pem;
          chmod 600 /etc/ssl/red/privkey.pem;
          chmod 644 /etc/ssl/red/fullchain.pem;
          echo '[fix] Fallback certs generated';
        else
          echo '[ok] TLS certs and private key present';
        fi
        ln -sf /etc/ssl/red/fullchain.pem /etc/ssl/certs/fullchain.pem;
        ln -sf /etc/ssl/red/privkey.pem /etc/ssl/certs/privkey.pem;
        ln -sf /etc/ssl/red/privkey.pem /etc/ssl/private/privkey.pem;
        chmod 755 /etc/ssl/private 2>/dev/null || true;
        exec nginx -g 'daemon off;'
    depends_on:
      backend: { condition: service_healthy }
      admin-panel: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: ["red-net"]

  admin-panel:
    build: ./admin_dashboard
    container_name: red-admin-ui
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: ["red-net"]

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  minio-data:
  red-certs:
  certbot-www:

networks:
  red-net:
    driver: bridge

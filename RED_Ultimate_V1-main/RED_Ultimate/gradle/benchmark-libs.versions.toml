# IMPORTANT: After changing a dependency, please run:
# ./gradlew --write-verification-metadata sha256 qa --rerun-tasks

[versions]
# Unified with gradle/test-libs.versions.toml: same androidx-test,
# espresso and coroutines-test lines so androidTest graphs resolve one way.
androidx-test = "1.5.0"
androidx-test-ext-junit = "1.1.5"
espresso = "3.4.0"
baselineprofile = "1.5.0-alpha03"

[plugins]
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }

[libraries]
# Macrobench/Baseline profiles
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
uiautomator = "androidx.test.uiautomator:uiautomator:2.3.0"
androidx-benchmark-macro = "androidx.benchmark:benchmark-macro-junit4:1.4.1"
androidx-benchmark-micro = "androidx.benchmark:benchmark-junit4:1.4.1"
kotlinx-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"

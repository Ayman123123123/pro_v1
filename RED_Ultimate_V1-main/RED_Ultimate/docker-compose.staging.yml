# RED Sovereign — Docker Compose Staging Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Staging settings:
# - Reduced resource limits
# - 7d Prometheus retention
# - No published ports (behind nginx)
# - Separate observability stack

x-resource-limits-small: &resource-limits-small
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: '0.5'
      reservations:
        memory: 128M
        cpus: '0.25'

x-resource-limits-medium: &resource-limits-medium
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: '1.0'
      reservations:
        memory: 512M
        cpus: '0.5'

x-resource-limits-large: &resource-limits-large
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '2.0'
      reservations:
        memory: 1G
        cpus: '1.0'

services:
  # Staging resource overrides
  postgres:
    <<: *resource-limits-large
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  mongo:
    <<: *resource-limits-large
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  redis:
    <<: *resource-limits-medium
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  minio:
    <<: *resource-limits-medium
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  backend:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    environment:
      SPRING_PROFILES_ACTIVE: "staging"
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g -XX:+UseZGC -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0"

  media-sfu:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    environment:
      MEDIASOUP_WORKERS: "2"

  admin-dashboard:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  nginx:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  coturn:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Staging observability stack
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    <<: *resource-limits-medium
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    <<: *resource-limits-small
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/observability/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - red-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  red-net:
    driver: bridge
    enable_ipv6: false
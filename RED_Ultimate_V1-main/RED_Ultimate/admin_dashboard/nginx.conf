# ⚠️ ملف غير مستعمَل — لا تنشره.
#
# لا يشير إليه أي شيء: صورة اللوحة تستعمل `dashboard.nginx.conf`
# (انظر Dockerfile:27)، وحاوية الوكيل تُركّب `RED_Ultimate/nginx.conf`
# من جذر المشروع (docker-compose.yml:217).
#
# أُبقي للاطّلاع فقط لأن إعداده أضعف من الملفَّين المستعملين: بلا أي
# رأس أمني وبلا CSP. لا تنسخ منه؛ استعمل `dashboard.nginx.conf`.

server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

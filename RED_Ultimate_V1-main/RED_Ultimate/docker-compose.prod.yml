# RED Sovereign — Docker Compose Production Override
# Extends base docker-compose.yml with production settings
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # coturn TURN/STUN
  coturn:
    image: coturn/coturn:4.6.2-r10
    container_name: red-coturn
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    environment:
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST}
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
      - TURN_REALM=${SIP_REALM}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "45000-45050:45000-45050/udp"
    networks:
      - red-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3478' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      -n
      --no-dtls
      --no-tls
      --lt-cred-mech
      --realm=${SIP_REALM}
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --external-ip=${TURN_PUBLIC_HOST}
      --min-port=45000
      --max-port=45050
      --verbose

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: red-prometheus
    restart: unless-stopped
    mem_limit: 1g
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: red-alertmanager
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - red-net

  # Grafana
  grafana:
    image: grafana/grafana:10.4.0
    container_name: red-grafana
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - red-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: red-node-exporter
    restart: unless-stopped
    mem_limit: 128m
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro,rslave
      - /sys:/host/sys:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # LEGENDARY FIX: network_mode:host يتعارض مع networks (compose يرفض المشروع كله)
    # node-exporter بهوست الشبكة يرى red-net عبر المضيف — نحذف networks ونبقي host.

  # cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: red-cadvisor
    restart: unless-stopped
    mem_limit: 512m
    privileged: true
    pid: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - red-net

  # Exporters
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: red-postgres-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - DATA_SOURCE_NAME=postgresql://admin:${DB_PASSWORD}@db-postgres:5432/red_sovereign?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - red-net
    depends_on:
      - db-postgres

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: red-redis-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      - REDIS_ADDR=cache-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - red-net
    depends_on:
      - cache-redis

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: red-nginx-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      - NGINX_SCRAPE_URI=http://nginx:8088/stub_status
    ports:
      - "9113:9113"
    networks:
      - red-net
    depends_on:
      - nginx

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local

networks:
  red-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
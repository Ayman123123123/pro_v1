; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; RED SOVEREIGN — chan_dongle Configuration
; DINSTAR DWG2000/DWG4000 GSM Gateway Dongle Configuration
; Each dongle port maps to a physical SIM slot (dongle0 = port 1, etc.)
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[general]
interval=15

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Dongle Port Definitions (8 ports typical for DINSTAR DWG4000)
; ═════════════════════════════════════════════════════════════════════════════
; audio=/dev/ttyUSB1  — voice channel (AT+CLCC, audio stream)
; data=/dev/ttyUSB2   — data channel (SMS, USSD, AT commands)
; imei=...            — optional, for identification
; imsi=...            — optional, for SIM identification
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[dongle0]
context=from-dinstar
audio=/dev/ttyUSB1
data=/dev/ttyUSB2
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle1]
context=from-dinstar
audio=/dev/ttyUSB3
data=/dev/ttyUSB4
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle2]
context=from-dinstar
audio=/dev/ttyUSB5
data=/dev/ttyUSB6
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle3]
context=from-dinstar
audio=/dev/ttyUSB7
data=/dev/ttyUSB8
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle4]
context=from-dinstar
audio=/dev/ttyUSB9
data=/dev/ttyUSB10
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle5]
context=from-dinstar
audio=/dev/ttyUSB11
data=/dev/ttyUSB12
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle6]
context=from-dinstar
audio=/dev/ttyUSB13
data=/dev/ttyUSB14
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

[dongle7]
context=from-dinstar
audio=/dev/ttyUSB15
data=/dev/ttyUSB16
exten=+861xxxxxxxxxx
imei=xxxxxxxxxxxxxxx
imsi=xxxxxxxxxxxxxxx

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; SMS Configuration
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[sms]
smscenter=+967712345678    ; Yemen Mobile SMSC (adjust per operator)
language=en
decode=yes
pdumode=0
incoming=full
max_sms_parts=10
delete=expired

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Voice / Call Settings
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[call]
dtmf=relax
callwaiting=yes
callerid=yes
busy=yes
progress=yes

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Network / Registration
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[network]
operator=auto
band=all
roaming=yes
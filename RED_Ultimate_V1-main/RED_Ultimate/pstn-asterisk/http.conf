[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8089
sessionlimit=200
session_inactivity=300000
session_keep_alive=15000
tlsenable = yes
tlsbindaddr = 0.0.0.0:8090
tlscertfile = /etc/asterisk/keys/fullchain.pem
tlsprivatekey = /etc/asterisk/keys/privkey.pem
; We use WSS (encrypted) for WebRTC client connections.
; TLS certificates generated at build time (self-signed for testing).
; NOTE: keys are tlscertfile/tlsprivatekey (cert_file/priv_key_file were
; removed in Asterisk 16+). The entrypoint regenerates this file at runtime;
; this static copy is a safe fallback with correct key names and non-conflicting
; TLS bind port (8090) so it never collides with plain WS on 8089.

; ═══════════════════════════════════════════════════════════════════════════
; RED Sovereign — Asterisk Indications (Country Tones) v3 — Legendary PSTN
; Yemen (ye) primary — cadence shared with UK/Bahrain alike
; ITU spec: Yemen uses UK-style cadence:
;   ring  = 400 Hz 1s on / 4s off (also heard as 400+425 mix on some exchanges)
;   dial  = 425 Hz continuous
;   busy  = 400 Hz 0.5s on / 0.5s off
;   congestion = 400 Hz 0.25s on / 0.25s off
; Source: stock indications.conf.sample style; [ye] tuned to Y-Telecom/Yemen Mobile
; Fallback [us] kept for North-American test clients.
; Loaded automatically when present in /etc/asterisk/indications.conf (no include needed).
; docker-entrypoint.sh ensures this file exists at container start.
;
; █ LEGENDARY PSTN STRATEGY — Ringback tone handling (see extensions.conf notes):
;   PREFERRED for all PSTN legs: Progress() (183 Session Progress with SDP) passes
;   through the REAL Yemen carrier ringback. Caller hears Sabafon / YOU / YemenMobile
;   actual network tone. No local generation needed — this is the professional fix.
;   Do NOT use Ringing() (180 without SDP) for PSTN-terminated calls; it GENERATES
;   local synthetic tone via indications.conf and hides carrier early media.
;   Ringing() is kept ONLY for WebRTC-to-WebRTC internal calls (no trunk).
;
;   FALLBACK per-provider local tones below are for testing WITHOUT trunk, or if
;   Progress() passthrough is impossible. Switch via CHANNEL(tone_zone) before Ringing():
;     Set(CHANNEL(tone_zone)=ye-sabafon)   ; 71x Sabafon  425 Hz
;     Set(CHANNEL(tone_zone)=ye-you)       ; 73x YOU      400 Hz
;     Set(CHANNEL(tone_zone)=ye-yemobile)  ; 77x/78x YemenMobile 440 Hz
;     Set(CHANNEL(tone_zone)=ye-ytelecom)  ; 70x Y Telecom  420 Hz
;   See extensions.conf [ye-operator-tone] context for automatic EXTEN-prefix detection.
; ═══════════════════════════════════════════════════════════════════════════
[general]
country=ye

; ── Yemen (default) ────────────────────────────────────────────────────
[ye]
description = Yemen
ringcadence = 1000,4000
; 425 Hz continuous dialtone (some switches use 400+425, we keep 425 pure)
dial = 425
; 400 Hz 0.5 on / 0.5 off
busy = 400/500,0/500
; 400 Hz 1.0 on / 4.0 off — ringback caller hears while Waiting/Dialing
ring = 400/1000,0/4000
; congestion faster than busy
congestion = 400/250,0/250
; callwaiting: two short 425 beeps then 3s silence
callwaiting = 425/200,0/600,425/200,0/3000
; stutter / msg waiting — 5 short pips then continuous
dialrecall = !425/100,!425/100,!425/100,425
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = !425/200,!425/200,!425/200,!425/200,!425/200,!425/600,425
; alternative UK-style mix for compatibility (not default):
; ring = 400+425/1000,0/4000

; ── Yemen per-operator sub-zones (fallback only — Progress() passthrough preferred) ──
; Use via CHANNEL(tone_zone) before Ringing(). Frequencies intentionally distinct
; for auditable diagnosis: Sabafon 425 Hz, YOU 400 Hz, YemenMobile 440 Hz, Y 420 Hz.
; All share Yemen cadence 1s on / 4s off. See extensions.conf [ye-operator-tone].
[ye-sabafon]
description = Yemen - Sabafon (71x) 425 Hz
ringcadence = 1000,4000
dial = 425
busy = 425/500,0/500
ring = 425/1000,0/4000
congestion = 425/250,0/250
callwaiting = 425/200,0/600,425/200,0/3000
dialrecall = !425/100,!425/100,!425/100,425
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = !425/200,!425/200,!425/200,!425/200,!425/200,!425/600,425

[ye-you]
description = Yemen - YOU (73x) 400 Hz
ringcadence = 1000,4000
dial = 400
busy = 400/500,0/500
ring = 400/1000,0/4000
congestion = 400/250,0/250
callwaiting = 400/200,0/600,400/200,0/3000
dialrecall = !400/100,!400/100,!400/100,400
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = !400/200,!400/200,!400/200,!400/200,!400/200,!400/600,400

[ye-yemobile]
description = Yemen - YemenMobile (77x/78x) 440 Hz
ringcadence = 1000,4000
dial = 440
busy = 440/500,0/500
ring = 440/1000,0/4000
congestion = 440/250,0/250
callwaiting = 440/200,0/600,440/200,0/3000
dialrecall = !440/100,!440/100,!440/100,440
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = !440/200,!440/200,!440/200,!440/200,!440/200,!440/600,440

[ye-ytelecom]
description = Yemen - Y Telecom (70x) 420 Hz
ringcadence = 1000,4000
dial = 420
busy = 420/500,0/500
ring = 420/1000,0/4000
congestion = 420/250,0/250
callwaiting = 420/200,0/600,420/200,0/3000
dialrecall = !420/100,!420/100,!420/100,420
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = !420/200,!420/200,!420/200,!420/200,!420/200,!420/600,420

; ── United States / North America (fallback for test clients) ──────────
[us]
description = United States / North America
ringcadence = 2000,4000
dial = 350+440
busy = 480+620/500,0/500
ring = 440+480/2000,0/4000
congestion = 480+620/250,0/250
callwaiting = 440/300,0/10000
dialrecall = !350+440/100,!350+440/100,!350+440/100,350+440
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
stutter = !350+440/100,!350+440/100,!350+440/100,!350+440/100,!350+440/100,!350+440/100,350+440

; ── United Kingdom (reference — Yemen shares this cadence) ──────────────
[uk]
description = United Kingdom
ringcadence = 400,200,400,2000
dial = 350+440
busy = 400/375,0/375
ring = 400+450/400,0/200,400+450/400,0/2000
congestion = 400/400,0/350,400/225,0/525
callwaiting = 400/100,0/2500,400/100,0/2500,400/100,0/2500,400/100
dialrecall = 350+440/750,0/100,350+440/750,0/100,350+440/750,0/100,350+440
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000

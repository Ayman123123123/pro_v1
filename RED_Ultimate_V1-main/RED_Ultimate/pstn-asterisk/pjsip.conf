[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; IPs الحقيقية تُولد ديناميكياً في docker-entrypoint.sh من TURN_PUBLIC_HOST=192.168.11.131 — هذا الملف Static يُحذف عند الإقلاع
external_media_address=192.168.11.131
external_signaling_address=192.168.11.131
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=127.0.0.0/8

[anonymous]
type=endpoint
context=from-untrusted
disallow=all
allow=alaw,ulaw
allow_subscribe=no

[dinstar-gw-192-168-11-2]
type=aor
contact=sip:192.168.11.2:5062
qualify_frequency=30

[dinstar-gw-192-168-11-2]
type=endpoint
context=from-dinstar
disallow=all
allow=alaw,ulaw,gsm
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=dinstar-gw-192-168-11-2

[dinstar-gw-192-168-11-2]
type=identify
endpoint=dinstar-gw-192-168-11-2
match=192.168.11.2

[dinstar-gateway]
type=aor
contact=sip:192.168.11.2:5062
qualify_frequency=30

[dinstar-gateway]
type=endpoint
context=from-dinstar
disallow=all
allow=alaw,ulaw,gsm
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=dinstar-gateway
from_user=asterisk
contact_user=asterisk

; --- WebRTC Configuration ---
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

[red-webrtc-client]
type=aor
max_contacts=10
remove_existing=yes

[red-webrtc-client]
type=auth
auth_type=userpass
password=REPLACE_ME_AT_DEPLOYMENT__generated_by_docker_entrypoint_sh
username=red-webrtc-client

[red-webrtc-client]
type=endpoint
aors=red-webrtc-client
auth=red-webrtc-client
context=from-red-client-webrtc
disallow=all
allow=opus,alaw,ulaw
dtls_auto_generate_cert=yes
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

; ═══════════════════════════════════════════════════════════════════════════
; RED Sovereign — Asterisk Dialplan v3
; ═══════════════════════════════════════════════════════════════════════════
; السياقات:
;   [from-red-backend]       ← مكالمات صادرة من التطبيق إلى GSM (عبر AMI)
;   [from-dinstar]           ← مكالمات واردة من GSM → UserEvent → انتظار
;   [from-incoming-bridge]   ← جسر المكالمة الواردة بعد قبول المستخدم
;   [from-dinstar-dtmf]      ← تمرير DTMF أثناء مكالمة نشطة
;   [from-untrusted]         ← رفض أي مكالمة غير مُفوَّضة
;   [from-red-client]        ← منع الالتفاف المباشر على الحد اليومي
;   [from-red-client-webrtc] ← مكالمات PSTN الصادرة من التطبيق عبر WebRTC
; ═══════════════════════════════════════════════════════════════════════════

; ─── Globals ──────────────────────────────────────────────────────────────
[globals]
DEFAULT_GW=dinstar-gateway
DIAL_TIMEOUT=60
RING_TIMEOUT=40

; ═══════════════════════════════════════════════════════════════════════════
; LEGENDARY PER-PROVIDER RINGTONE STRATEGY (Yemen operators)
; ═══════════════════════════════════════════════════════════════════════════
; Yemen numbering plan (YemenNumberPlan.kt / YemeniOperatorDetector.kt):
;   70x → واي Y Telecom      | 71x → سبأفون Sabafon
;   73x → يو YOU (MTN pre-2021) | 77x/78x → يمن موبايل Yemen Mobile
;   10x → يمن فورجي (data, not GSM) | 1x-5x → ثابت PSTN
;
; PROFESSIONAL PSTN APPROACH — PASS-THROUGH:
;   For ALL PSTN legs (from-red-backend, from-red-client-webrtc outbound
;   to DINSTAR, and from-dinstar inbound waiting), use Progress() which
;   sends 183 Session Progress WITH SDP. This passes through the REAL
;   carrier ringback tone from Sabafon/YOU/YemenMobile — caller hears the
;   operator's actual network ring, not a synthetic local tone. This is the
;   preferred, legendary fix.
;
;   NEVER use Ringing() (180 without SDP) for PSTN-terminated calls — it
;   GENERATES local tone from indications.conf and hides carrier early media.
;
;   Ringing() is kept ONLY for pure WebRTC-to-WebRTC internal calls where
;   there is no PSTN trunk to provide ringback.
;
; FALLBACK PER-PROVIDER LOCAL TONES (when passthrough impossible):
;   indications.conf defines sub-zones:
;     [ye-sabafon]  425 Hz | [ye-you] 400 Hz | [ye-yemobile] 440 Hz | [ye-ytelecom] 420 Hz
;   Switch before Ringing() via CHANNEL(tone_zone):
;     same => n,Gosub(ye-operator-tone,s,1(${EXTEN}))
;   or inline:
;     same => n,ExecIf($["${EXTEN:0:2}"="71"]?Set(CHANNEL(tone_zone)=ye-sabafon))
;   Context [ye-operator-tone] below handles +967/00967/0 prefix stripping and sets
;   tone_zone accordingly. Default remains [ye] (country=ye) for unknown prefixes.
; ═══════════════════════════════════════════════════════════════════════════

; ─── ye-operator-tone — per-provider tone_zone selector (Gosub) ─────────
; Usage: Gosub(ye-operator-tone,s,1(${EXTEN})) before Ringing()
; Sets CHANNEL(tone_zone) to ye-sabafon / ye-you / ye-yemobile / ye-ytelecom
; Preference: Progress() passthrough is better — this is fallback only.
; Normalizes +967, 00967, 967, 0 prefixes before prefix check.
[ye-operator-tone]
exten => s,1,NoOp(Select Yemen operator tone for ${ARG1})
  same => n,Set(_RAWNUM=${ARG1})
  same => n,Set(_NUM=${FILTER(0123456789+${_RAWNUM})})
  ; strip +967 / 00967 / 967 / 0
  same => n,ExecIf($["${_NUM:0:4}"="+967"]?Set(_NUM=${_NUM:4}))
  same => n,ExecIf($["${_NUM:0:5}"="00967"]?Set(_NUM=${_NUM:5}))
  same => n,ExecIf($["${_NUM:0:3}"="967"]?Set(_NUM=${_NUM:3}))
  same => n,ExecIf($["${_NUM:0:1}"="0"]?Set(_NUM=${_NUM:1}))
  same => n,GotoIf($["${_NUM:0:2}"="70"]?ytelecom)
  same => n,GotoIf($["${_NUM:0:2}"="71"]?sabafon)
  same => n,GotoIf($["${_NUM:0:2}"="73"]?you)
  same => n,GotoIf($["${_NUM:0:2}"="77"]?yemobile)
  same => n,GotoIf($["${_NUM:0:2}"="78"]?yemobile)
  same => n,Set(CHANNEL(tone_zone)=ye)
  same => n,Return()
  same => n(ytelecom),Set(CHANNEL(tone_zone)=ye-ytelecom)
  same => n,Return()
  same => n(sabafon),Set(CHANNEL(tone_zone)=ye-sabafon)
  same => n,Return()
  same => n(you),Set(CHANNEL(tone_zone)=ye-you)
  same => n,Return()
  same => n(yemobile),Set(CHANNEL(tone_zone)=ye-yemobile)
  same => n,Return()
; Alternative entry for direct EXTEN pattern match (without Gosub)
exten => _70X.,1,Set(CHANNEL(tone_zone)=ye-ytelecom)
  same => n,Return()
exten => _71X.,1,Set(CHANNEL(tone_zone)=ye-sabafon)
  same => n,Return()
exten => _73X.,1,Set(CHANNEL(tone_zone)=ye-you)
  same => n,Return()
exten => _77X.,1,Set(CHANNEL(tone_zone)=ye-yemobile)
  same => n,Return()
exten => _78X.,1,Set(CHANNEL(tone_zone)=ye-yemobile)
  same => n,Return()
exten => _X.,1,Set(CHANNEL(tone_zone)=ye)
  same => n,Return()

; ─── from-red-backend ─────────────────────────────────────────────────────
; المكالمات الصادرة إلى بوابات DINSTAR
; يُنشئ AMI قنوات Local في هذا السياق حصرًا.
; الخادم هو من يتحقق من الرقم اليمني ومن الحد اليومي وصلاحية PSTN.
[from-red-backend]
exten => _X.,1,NoOp(RED PSTN outbound: ${EXTEN} / callId=${RED_CALL_ID} sim=${RED_SIM_NUMBER})
 same => n,Set(GW=${IF($["${RED_GW}" != ""]?${RED_GW}:${DEFAULT_GW})})
  ; حارس: لا نسمح إلا بأسماء نظراء بسيطة لمنع حقن وجهة أخرى
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
  ; تسجيل callId في CDR userfield للربط بسجل قاعدة البيانات
 same => n,Set(CDR(userfield)=RED_DINSTAR:${GW}:${RED_CALL_ID}:${RED_SIM_NUMBER})
  ; تصدير callId كمتغيّر قناة — يقرؤه DinstarEventListener عبر VarSet
 same => n,Set(RED_CALL_ID=${RED_CALL_ID})
   ; إظهار رقم الشريحة الحقيقي للمستلم الخارجي (1:1 دائم)
  same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(num)=${RED_SIM_NUMBER}))
  same => n,ExecIf($["${RED_SIM_NUMBER}" != ""]?Set(CALLERID(ani)=${RED_SIM_NUMBER}))
   ; PSTN outbound: carrier ringback is passed through via Dial early media.
   ; Do NOT generate local tone — Progress() passthrough is automatic in Dial.
   ; For local testing without trunk, uncomment next line for per-provider tone:
   ; same => n,Gosub(ye-operator-tone,s,1(${EXTEN}))
   ; إرسال المكالمة — K=call-waiting, U=subroutine for DTMF forwarding
  same => n,Dial(PJSIP/${EXTEN}@${GW},${DIAL_TIMEOUT},KU(from-dinstar-dtmf))
 same => n,Hangup()
 same => n(badgw),NoOp(Rejected malformed gateway name: ${GW})
 same => n,Hangup(21)

; ─── from-dinstar ─────────────────────────────────────────────────────────
; المكالمات الواردة من شبكة GSM عبر أي بوابة DINSTAR
; الخطوة 1: UserEvent يُنبّه الخادم → يُ broadcast للمستخدم عبر WebSocket
; الخطوة 2: المستخدم يضغط "قبول" → Backend يُعيد توجيه القناة إلى from-incoming-bridge
; الخطوة 3: from-incoming-bridge يُجري Dial لـ WebRTC client → جسر المكالمة
; ⚠️ لا نُغلق القناة هنا — ننتظر Redirect من Backend
[from-dinstar]
exten => _X.,1,NoOp(Incoming GSM call from ${CALLERID(num)} on port ${EXTEN} via ${CHANNEL(endpoint)})
 ; تسجيل بيانات المكالمة الواردة
 same => n,Set(CDR(userfield)=INCOMING_DINSTAR:${CHANNEL(endpoint)})
 same => n,Set(CDR(accountcode)=${CALLERID(num)})
  ; إرسال UserEvent يُلتقطه DinstarEventListener في الخادم
  ; استخدم أسماء ManagerEvent القياسية: مكتبة Asterisk-Java لا تكشف
  ; اسم UserEvent أو الحقول المخصصة CallerID/Port/Gateway.
  same => n,UserEvent(DinstarIncomingCall,CallerIDNum:${CALLERID(num)},Channel:${CHANNEL(name)},Exten:${EXTEN},Context:from-dinstar)
  ; ⚠️ asterisk-java يُسقط UserEvent المخصص بصمت (مُثبت حياً) — المسار
  ; الأساسي الموثوق: استدعاء HTTP داخلي مباشر للخادم عبر شبكة Docker.
  ; ⚠️ asterisk-java يُسقط UserEvent المخصص بصمت (مُثبت حياً) — المسار
  ; الأساسي الموثوق: سكربت جسر يستقبل معاملات موضعية نظيفة (بلا اقتباس
  ; JSON مضمن) وينادي HTTP الداخلي للخادم عبر شبكة Docker.
  same => n,System(/usr/local/bin/pstn-incoming.sh "${CALLERID(num)}" "${EXTEN}" "${CHANNEL(name)}")
  ; إشارة مبكرة للمتصل GSM — Progress يرسل 183 Session Progress بلا Answer (لا احتساب بلا إجابة)
  same => n,Progress()
  ; انتظار Redirect من Backend (حد أقصى RING_TIMEOUT ثانية — محاذاة مع CallRingPolicy 45s / TTL 120s)
  same => n,Wait(${RING_TIMEOUT})
  ; إذا لم يُرَد أو لم يُعاد توجيه — إنهاء المكالمة
  same => n,NoOp(Call from ${CALLERID(num)} unanswered after ${RING_TIMEOUT}s)
  same => n,Hangup()

; امتداد s للمكالمات بدون رقم محدد
exten => s,1,NoOp(Incoming GSM call from ${CALLERID(num)} - no extension)
  same => n,Set(CDR(userfield)=INCOMING_DINSTAR:${CHANNEL(endpoint)})
  same => n,UserEvent(DinstarIncomingCall,CallerIDNum:${CALLERID(num)},Channel:${CHANNEL(name)},Exten:s,Context:from-dinstar)
  same => n,System(/usr/local/bin/pstn-incoming.sh "${CALLERID(num)}" "s" "${CHANNEL(name)}")
  same => n,Progress()
  same => n,Wait(${RING_TIMEOUT})
  same => n,Hangup()

; ─── from-incoming-bridge ──────────────────────────────────────────────────
; جسر المكالمات الواردة من DINSTAR إلى عميل WebRTC (التطبيق)
; PstnManager.acceptIncomingCall() يُعيد توجيه قناة DINSTAR إلى هنا
; exten = "s" لأن RedirectAction يستخدم s كامتداد افتراضي
; legendary fix: Progress() (183 with SDP) not Ringing() (180) — for GSM
; inbound legs we do NOT generate local synthetic ring; Progress() lets the
; GSM caller keep hearing early media while WebRTC Dial proceeds. If you
; MUST generate local per-provider tone (no trunk / WebRTC-only test),
; uncomment Gosub line below to set CHANNEL(tone_zone)=ye-* before Ringing():
;   same => n,Gosub(ye-operator-tone,s,1(${CALLERID(num)}))
;   same => n,Ringing()
; But for PSTN-terminated bridge, Progress() passthrough is preferred and
; per-provider tones in indications.conf are fallback only (see ye-* zones).
[from-incoming-bridge]
exten => s,1,NoOp(Bridging incoming GSM call to WebRTC client)
  same => n,Set(CDR(userfield)=INCOMING_BRIDGE)
  ; إرسال 183 Progress للمتصل GSM أثناء اتصال WebRTC الداخلي (early media
  ; مع SDP — يمرّر النغمة الحقيقية بدل توليد نغمة محلية. Ringing() يُستخدم
  ; فقط لمكالمات WebRTC-to-WebRTC الخالصة بلا trunk).
  same => n,Progress()
  ; Fallback per-provider local tone (uncomment if you need synthetic ring):
  ; same => n,Gosub(ye-operator-tone,s,1(${CALLERID(num)}))
  ; same => n,Ringing()
  same => n,Dial(PJSIP/red-webrtc-client,${DIAL_TIMEOUT},tT)
  same => n,Hangup()

; ─── from-dinstar-dtmf ────────────────────────────────────────────────────
; سياق معالجة DTMF أثناء مكالمة نشطة (لإرسال أرقام عبر الشبكة)
; يُستخدَم عبر خيار U() في Dial() من from-red-backend
[from-dinstar-dtmf]
exten => s,1,Return()
exten => _[0-9*#],1,NoOp(DTMF ${EXTEN} from backend during active call)
 same => n,SendDTMF(${EXTEN})
 same => n,Return()

; ─── from-untrusted ──────────────────────────────────────────────────────
; المكالمات من نظير غير معروف — ترفض دائمًا
; النظير [anonymous] في pjsip.conf يشير إلى هنا.
[from-untrusted]
exten => _[0-9*#+].,1,NoOp(Rejected anonymous SIP call to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=REJECTED_ANONYMOUS)
 same => n,Hangup(21)
exten => s,1,NoOp(Rejected anonymous SIP call with no extension)
 same => n,Hangup(21)
exten => i,1,Hangup(21)
exten => h,1,Hangup()

; ─── from-red-client ──────────────────────────────────────────────────────
; منع محاولة الالتفاف المباشر من عميل SIP على الحد اليومي والتفويض
[from-red-client]
exten => _X.,1,NoOp(Blocked direct client PSTN attempt from ${CALLERID(num)})
 same => n,Hangup(21)

; ─── from-red-client-webrtc ──────────────────────────────────────────────
; مكالمات PSTN الصادرة من التطبيق عبر WebRTC
; المستخدم يتصل بـ Asterisk عبر WSS، ويُحوّل للـ DINSTAR
[from-red-client-webrtc]
exten => _X.,1,NoOp(WebRTC PSTN call from app: ${EXTEN} caller=${CALLERID(num)})
 ; تسجيل CDR
 same => n,Set(CDR(userfield)=WEBRTC_PSTN:${CALLERID(num)})
 ; تحديد Gateway — يمكن تمريره عبر PJSIP_HEADER من Backend
 same => n,Set(GW=${IF($["${RED_GW}" != ""]?${RED_GW}:${DEFAULT_GW})})
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
   ; ربط المكالمة: WebRTC ← Asterisk → DINSTAR
   same => n,NoOp(Bridging WebRTC call to DINSTAR: ${EXTEN} via ${GW})
   ; إشارة مبكرة للمتصل WebRTC أثناء Dial الخارجي (183 Progress WITH SDP)
   ; legendary PSTN fix: Progress() passes real Yemen carrier ringback
   ; (Sabafon/YOU/YemenMobile). Ringing() (180) would generate synthetic
   ; local tone and hide carrier early media — use ONLY for WebRTC-to-WebRTC.
   ; For local fallback tone without trunk: Gosub(ye-operator-tone,s,1(${EXTEN})) then Ringing().
   same => n,Progress()
   same => n,Dial(PJSIP/${EXTEN}@${GW},${DIAL_TIMEOUT},KU(from-dinstar-dtmf))
 same => n,Hangup()
 same => n(badgw),NoOp(Rejected malformed gateway name: ${GW})
 same => n,Hangup(21)

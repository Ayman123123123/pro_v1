[from-red-backend]
; ═══════════════════════════════════════════════════════════════════
; المكالمات الصادرة إلى بوابات DINSTAR
; ═══════════════════════════════════════════════════════════════════
; يُنشئ AMI قنوات Local في هذا السياق حصرًا. الخادم هو من يتحقق من
; الرقم اليمني ومن الحد اليومي وصلاحية PSTN قبل الوصول إلى هنا.
;
; اختيار البوابة: مع وجود أكثر من جهاز DINSTAR لا يصحّ تثبيت وجهة
; واحدة. موزّع الأحمال في الخادم يختار الجهاز ويمرّر اسم نظير PJSIP
; في المتغيّر RED_GW عبر OriginateAction. عند غيابه — وهي حالة
; التوافق مع جهاز واحد — نعود إلى dinstar-gateway.
exten => _X.,1,NoOp(Authorized RED DINSTAR call to ${EXTEN})
 same => n,Set(GW=${IF($["${RED_GW}" != ""]?${RED_GW}:dinstar-gateway)})
 ; حارس: لا نسمح إلا بأسماء نظراء بسيطة، فالمتغيّر يدخل سلسلة Dial
 same => n,GotoIf($["${REGEX("^[A-Za-z0-9_-]+$" ${GW})}" = "0"]?badgw)
 same => n,Set(CDR(userfield)=RED_DINSTAR:${GW})
 same => n,NoOp(Routing ${EXTEN} via PJSIP endpoint ${GW})
 same => n,Dial(PJSIP/${EXTEN}@${GW},60)
 same => n,Hangup()
 same => n(badgw),NoOp(Rejected malformed gateway name: ${GW})
 same => n,Hangup(21)

[from-dinstar]
; ═══════════════════════════════════════════════════════════════════
; المكالمات الواردة من شبكة GSM
; ═══════════════════════════════════════════════════════════════════
; يُمرَّر اسم النظير المصدر حتى يعرف الخادم من أي جهاز وردت المكالمة
; عند تشغيل عدة بوابات.
exten => _X.,1,NoOp(Incoming DINSTAR GSM call from ${CALLERID(num)} on port ${EXTEN})
 same => n,Set(CDR(userfield)=INCOMING_DINSTAR:${CHANNEL(endpoint)})
 same => n,UserEvent(DinstarIncomingCall,CallerID:${CALLERID(num)},Port:${EXTEN},Gateway:${CHANNEL(endpoint)})
 same => n,Dial(PJSIP/red-backend,30)
 same => n,Hangup()

exten => s,1,NoOp(Incoming DINSTAR GSM call from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=INCOMING_DINSTAR:${CHANNEL(endpoint)})
 same => n,UserEvent(DinstarIncomingCall,CallerID:${CALLERID(num)},Gateway:${CHANNEL(endpoint)})
 same => n,Dial(PJSIP/red-backend,30)
 same => n,Hangup()

[from-red-client]
; PSTN بإذن الخادم فقط. أي عميل SIP/WebRTC مسجّل لا يستطيع طلب
; البوابة مباشرة — وإلا لالتُفَّ على الحد اليومي وعلى تدقيق الصلاحية.
exten => _X.,1,NoOp(Blocked direct client PSTN attempt)
 same => n,Hangup(21)

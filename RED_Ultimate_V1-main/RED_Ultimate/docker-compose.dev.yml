# RED Sovereign — Docker Compose Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Development tools: mailhog, pgadmin, redis-commander
# Loopback ports for host debugging
# Disabled Flyway, Hibernate ddl-auto=update

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-resource-limits-small: &resource-limits-small
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.5"
      reservations:
        memory: 128M
        cpus: "0.25"

x-resource-limits-medium: &resource-limits-medium
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
      reservations:
        memory: 256M
        cpus: "0.5"

x-resource-limits-large: &resource-limits-large
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "1.5"
      reservations:
        memory: 512M
        cpus: "0.75"

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  mongo:
    ports:
      - "127.0.0.1:27017:27017"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: red-prometheus-dev
    restart: unless-stopped
    <<: *resource-limits-medium
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      <<: *healthcheck-defaults
    logging: *default-logging

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: red-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *default-logging
    networks: ["red-net"]

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: red-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@red-sovereign.dev"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    logging: *default-logging
    networks: ["red-net"]

  redis-commander:
    image: ghcr.io/joeferraro/redis-commander:latest
    container_name: red-redis-commander-dev
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:red-password"
      HTTP_USER: "admin"
      HTTP_PASSWORD: "admin"
    ports:
      - "8081:8081"
    depends_on:
      - redis
    logging: *default-logging
    networks: ["red-net"]

volumes:
  pgadmin-data:
    driver: local

networks:
  red-net:
    driver: bridge
    enable_ipv6: false
    internal: false

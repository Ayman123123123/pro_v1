# RED Sovereign — Docker Compose Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  voicebridge:
    build:
      context: ./voicebridge
      dockerfile: Dockerfile.dev
    container_name: red-voicebridge-dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - VOICEBRIDGE_MAX_CALLS=10
      - VOICEBRIDGE_RTP_POOL=10
    volumes:
      - ./voicebridge/src:/app/src:ro
      - ./voicebridge/pom.xml:/app/pom.xml:ro
      - voicebridge-maven-cache:/root/.m2
    ports:
      - "8090:8090"
      - "5005:5005"  # Debug port
      - "12100-13100:12100-13100/udp"
    command: >
      sh -c "mvn spring-boot:run -Dspring-boot.run.jvmArguments='-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"

  kamailio:
    build:
      context: ./kamailio
      dockerfile: Dockerfile.dev
    container_name: red-kamailio-dev
    volumes:
      - ./kamailio/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    command: kamailio -f /etc/kamailio/kamailio.cfg -DD -E -e

  janus:
    build:
      context: ./janus
      dockerfile: Dockerfile.dev
    container_name: red-janus-dev
    volumes:
      - ./janus/janus.cfg:/etc/janus/janus.cfg:ro
      - ./janus/janus.jcfg:/etc/janus/janus.jcfg:ro
    command: janus -F /etc/janus -L /var/log/janus -D -D

  prometheus:
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1d'
      - '--web.enable-lifecycle'

  grafana:
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

  # Additional dev tools
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: red-mailhog-dev
    restart: unless-stopped
    mem_limit: 128m
    # NOTE: no healthcheck — mailhog image is FROM scratch (no shell/curl/wget),
    # any in-container probe would fail permanently. Liveness via published 8025.
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - red-net

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: red-pgadmin-dev
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@red-sovereign.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - red-net
    depends_on:
      - db-postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  voicebridge-maven-cache:
    driver: local
  pgadmin-data:
    driver: local
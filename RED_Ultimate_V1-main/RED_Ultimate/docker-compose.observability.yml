# RED Sovereign — Full Observability Stack Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Complete observability stack with:
# - Prometheus (metrics, 30d retention)
# - Alertmanager (alerting)
# - Grafana (dashboards)
# - Loki (logs)
# - Tempo (traces)
# - Pyroscope (profiling)
# - OTEL Collector (telemetry pipeline)
# - All exporters

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-resource-limits-small: &resource-limits-small
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: '0.5'
      reservations:
        memory: 128M
        cpus: '0.25'

x-resource-limits-medium: &resource-limits-medium
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: '1.0'
      reservations:
        memory: 512M
        cpus: '0.5'

x-resource-limits-large: &resource-limits-large
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: '2.0'
      reservations:
        memory: 1G
        cpus: '1.0'

x-resource-limits-xlarge: &resource-limits-xlarge
  deploy:
    resources:
      limits:
        memory: 4G
        cpus: '4.0'
      reservations:
        memory: 2G
        cpus: '2.0'

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: red-prometheus
    restart: unless-stopped
    <<: *resource-limits-xlarge
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.route-prefix=/'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      <<: *healthcheck-defaults
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: red-alertmanager
    restart: unless-stopped
    <<: *resource-limits-small
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/observability/alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      <<: *healthcheck-defaults
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    container_name: red-grafana
    restart: unless-stopped
    <<: *resource-limits-large
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel,grafana-worldmap-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/observability/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - red-net
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      <<: *healthcheck-defaults
    logging: *default-logging
    secrets:
      - grafana_admin_password

  loki:
    image: grafana/loki:3.1.0
    container_name: red-loki
    restart: unless-stopped
    <<: *resource-limits-large
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -target=all
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./infrastructure/observability/loki:/etc/loki
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.6.0
    container_name: red-tempo
    restart: unless-stopped
    <<: *resource-limits-large
    command:
      - -config.file=/etc/tempo.yaml
      - -target=all
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - tempo-data:/var/tempo
      - ./infrastructure/observability/tempo:/etc/tempo
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging

  pyroscope:
    image: grafana/pyroscope:1.10.0
    container_name: red-pyroscope
    restart: unless-stopped
    <<: *resource-limits-medium
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/ready"]
      <<: *healthcheck-defaults
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.0
    container_name: red-otel-collector
    restart: unless-stopped
    <<: *resource-limits-medium
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --feature-gates=+pkg.translator.prometheus.NormalizeName
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    volumes:
      - ./infrastructure/observability/otel:/etc/otelcol-contrib
    networks:
      - red-net
    depends_on:
      - tempo
      - loki
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133"]
      <<: *healthcheck-defaults
    logging: *default-logging

  # Exporters
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: red-node-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro,rslave
      - /sys:/host/sys:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: red-cadvisor
    restart: unless-stopped
    <<: *resource-limits-medium
    privileged: true
    pid: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      <<: *healthcheck-defaults
    logging: *default-logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: red-postgres-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - DATA_SOURCE_NAME=postgresql://admin:${DB_PASSWORD}@postgres:5432/red_sovereign?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - red-net
    depends_on:
      - postgres
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: red-redis-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - red-net
    depends_on:
      - redis
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: red-nginx-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    environment:
      - NGINX_SCRAPE_URI=http://nginx:8088/stub_status
    ports:
      - "9113:9113"
    networks:
      - red-net
    depends_on:
      - nginx
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: red-blackbox-exporter
    restart: unless-stopped
    <<: *resource-limits-small
    ports:
      - "9115:9115"
    volumes:
      - ./infrastructure/observability/blackbox:/etc/blackbox_exporter
    networks:
      - red-net
    logging: *default-logging

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  pyroscope-data:
    driver: local

networks:
  red-net:
    driver: bridge
    enable_ipv6: false

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
# RED Sovereign — Janus Gateway Configuration
# WebRTC-to-SIP Bridge for browser-based PSTN calls
# Architecture: Browser (WebRTC) → Janus (ICE/DTLS-SRTP) → SIP Plugin → Kamailio/Asterisk

[general]
configs_folder = /etc/janus
certificates_folder = /etc/janus/certs
logs_folder = /var/log/janus
pid_file = /var/run/janus/janus.pid

# Network settings
ipv4 = true
ipv6 = false
interface = eth0
public_ip = ${JANUS_PUBLIC_IP}
server_name = "RED Sovereign Janus Gateway"

# Media settings
rtp_port_range = "20000-40000"
ice_lite = false
ice_tcp = true
ice_udp = true
stun_server = ${STUN_SERVER:-stun.l.google.com}
stun_port = 19302
turn_server = ${TURN_SERVER}
turn_port = 3478
turn_type = "udp"
turn_user = ${TURN_USER}
turn_password = ${TURN_PASSWORD}

# Plugin settings
plugins_folder = /usr/lib/janus/plugins
disable_stdout = false
log_to_stdout = true
log_file = /var/log/janus/janus.log
log_level = 4
debug_level = 0
daemon = false

# Admin/Monitor
admin_secret = ${JANUS_ADMIN_SECRET}
admin_token = ${JANUS_ADMIN_TOKEN}
event_handlers = true

[transport-ws]
# WebSocket transport for browser signaling
type = ws
port = 8188
ip = 0.0.0.0
cert_pem = /etc/janus/certs/janus.pem
cert_key = /etc/janus/certs/janus.key
ciphers = HIGH:!aNULL:!MD5:@STRENGTH

[transport-wss]
# Secure WebSocket transport
type = wss
port = 8189
ip = 0.0.0.0
cert_pem = /etc/janus/certs/janus.pem
cert_key = /etc/janus/certs/janus.key
ciphers = HIGH:!aNULL:!MD5:@STRENGTH

[transport-http]
# REST API for plugin management
type = http
port = 8088
ip = 0.0.0.0

[plugins]
# SIP Plugin for WebRTC-to-SIP bridging
janus.plugin.sip.so = enabled
# Streaming plugin for media relay
janus.plugin.streaming.so = enabled
# Audio bridge for conferencing
janus.plugin.audiobridge.so = enabled
# Record/play
janus.plugin.recordplay.so = enabled

[sip]
# SIP Plugin Configuration
# Janus acts as a SIP endpoint registering to Kamailio/Asterisk
sip_port = 5060
sip_ip = 0.0.0.0
sip_transport = udp
sip_tls_port = 5061
sip_tls_ip = 0.0.0.0

# Realm and credentials (match Asterisk/Kamailio)
sip_realm = ${SIP_REALM:-red-sovereign}
sip_username = ${SIP_USERNAME:-janus-edge}
sip_password = ${SIP_PASSWORD}
sip_display_name = "Janus Edge Gateway"
sip_contact = "sip:${SIP_USERNAME}@${JANUS_PUBLIC_IP}:5060"
sip_from_user = ${SIP_USERNAME}
sip_from_domain = ${SIP_REALM}

# Registration settings
sip_register = true
sip_registrar = "sip:${KAMAILIO_PRIVATE_IP}:5060"
sip_register_expires = 600
sip_register_retry = 60

# Media settings
sip_rtp_port_range = "20000-40000"
sip_rtp_encryption = "dtls"
sip_ice = true
sip_ice_lite = false
sip_rtcp_mux = true
sip_rtp_timeout = 300
sip_rtp_keepalive = 30

# Codec preferences (Opus for WebRTC, G.711 for PSTN)
sip_audio_codecs = "opus,PCMU,PCMA,G722"
sip_video_codecs = "VP8,VP9,H264"

# DTLS/SRTP
sip_dtls = true
sip_dtls_auto_generate = true
sip_dtls_cert = /etc/janus/certs/janus.pem
sip_dtls_key = /etc/janus/certs/janus.key

# Security
sip_check_origin = true
sip_allowed_origins = "*"

# NAT handling
sip_nat_1xx = true
sip_nat_media = true
sip_force_symmetric_rtp = true
sip_rewrite_contact = true

# Event callbacks
sip_event_callback = true
sip_event_callback_url = "http://backend:8080/api/internal/janus/sip-event"

[streaming]
# Streaming plugin for media relay scenarios
streaming_port = 5004
streaming_ip = 0.0.0.0
streaming_rtp_port_range = "20000-40000"

[audiobridge]
# Audio bridge for conferencing
audiobridge_port = 5005
audiobridge_ip = 0.0.0.0

[recordplay]
# Record/playback
recordplay_port = 5006
recordplay_ip = 0.0.0.0
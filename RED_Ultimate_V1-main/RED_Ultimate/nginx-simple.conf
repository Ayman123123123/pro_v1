events { worker_connections 1024; }
http {
    server {
        listen 80;
        location / {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

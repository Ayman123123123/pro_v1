events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Return the API-appropriate status instead of Nginx's default 503.
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HSTS must never be emitted over plain HTTP.
    map $scheme $hsts_header {
        https   "max-age=31536000; includeSubDomains; preload";
        default "";
    }

    # Cross-Origin Embedder Policy for isolation
    map $scheme $coep_header {
        https   "require-corp";
        default "";
    }

    # Cross-Origin Opener Policy
    map $scheme $coop_header {
        https   "same-origin";
        default "";
    }

    # Cross-Origin Resource Policy
    map $scheme $corp_header {
        https   "same-origin";
        default "";
    }

    # Docker's embedded DNS tracks a replacement container's new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream backend-pool {
        zone backend_pool 64k;
        server backend:8080 resolve max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream sfu-pool {
        zone sfu_pool 64k;
        server media-sfu:4000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream admin-pool {
        zone admin_pool 64k;
        server admin-dashboard:3000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS with HTTP/2 and HTTP/3 (QUIC)
    server {
        listen 443 ssl http2 default_server;
        listen 443 quic reuseport default_server;
        listen [::]:443 ssl http2 default_server;
        listen [::]:443 quic reuseport default_server;
        server_name _;
        client_max_body_size 100m;

        ssl_certificate /etc/ssl/red/fullchain.pem;
        ssl_certificate_key /etc/ssl/red/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_early_data on;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy $coop_header always;
        add_header Cross-Origin-Resource-Policy $corp_header always;
        add_header Cross-Origin-Embedder-Policy $coep_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; media-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Liveness probe - no dependencies, always 200 when JVM alive
        location = /health/live {
            proxy_pass http://backend-pool/actuator/health/liveness;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Legacy health endpoint
        location = /health {
            proxy_pass http://backend-pool/actuator/health;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # Admin detailed health (ADMIN JWT)
        location = /health/detailed {
            proxy_pass http://backend-pool/actuator/health/readiness;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # SFU health
        location = /sfu-health {
            proxy_pass http://sfu-pool/health;
            proxy_set_header Host media-sfu;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Auth endpoints - strict rate limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend-pool;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-RED-Admin-Web $http_x_red_admin_web;
            proxy_set_header X-RED-CSRF $http_x_red_csrf;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # API endpoints - standard rate limiting
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://backend-pool;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-RED-Admin-Web $http_x_red_admin_web;
            proxy_set_header X-RED-CSRF $http_x_red_csrf;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Admin panel - separate rate limiting
        location /admin/ {
            limit_req zone=admin_limit burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://admin-pool;
            proxy_set_header Host admin-dashboard;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Actuator - internal only
        location /actuator/ {
            proxy_pass http://backend-pool;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # WebSocket for backend
        location /ws/ {
            limit_req zone=ws_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend-pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # WebSocket for SFU
        location /sfu {
            limit_req zone=ws_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://sfu-pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host media-sfu;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # App updates: static APK downloads
        location /updates/ {
            alias /usr/share/nginx/updates/;
            autoindex off;
            types { application/vnd.android.package-archive apk; }
            add_header Content-Disposition 'attachment' always;
            expires 1h;
        }

        # Admin dashboard SPA fallback
        location / {
            proxy_pass http://admin-pool;
            proxy_set_header Host admin-dashboard;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}

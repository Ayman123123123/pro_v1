events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Return the API-appropriate status instead of Nginx's default 503.
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HSTS must never be emitted over plain HTTP. Keeping this conditional also
    # allows one server block to serve ports 80 and 443 without route drift.
    map $scheme $hsts_header {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    # Docker's embedded DNS tracks a replacement container's new IP. `resolve`
    # is available in the open-source Nginx 1.27 line and avoids stale upstream
    # addresses after a backend/admin/SFU restart.
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream backend-pool {
        zone backend_pool 64k;
        server backend:8080 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream sfu-pool {
        zone sfu_pool 64k;
        server media-sfu:4000 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream admin-pool {
        zone admin_pool 64k;
        server admin-panel:3000 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream asterisk-ws-pool {
        zone asterisk_ws_pool 64k;
        server pstn-gateway:8089 resolve max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        client_max_body_size 100m;

        ssl_certificate /etc/ssl/red/fullchain.pem;
        ssl_certificate_key /etc/ssl/red/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; media-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Readiness: backend now returns 503 if a mandatory data service is down.
        location = /health/live {
            proxy_pass http://backend-pool/health/live;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location = /health {
            proxy_pass http://backend-pool/health;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend-pool;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Deliberately replace an untrusted client-supplied XFF value.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-RED-Admin-Web $http_x_red_admin_web;
            proxy_set_header X-RED-CSRF $http_x_red_csrf;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend-pool;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-RED-Admin-Web $http_x_red_admin_web;
            proxy_set_header X-RED-CSRF $http_x_red_csrf;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Actuator is intentionally reachable only from private/container ranges.
        location /actuator/ {
            proxy_pass http://backend-pool;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # One canonical WebSocket location prevents HTTP/HTTPS configuration drift.
        location /ws/ {
            limit_req zone=ws_limit burst=10 nodelay;
            proxy_pass http://backend-pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host backend;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # SIP over WebSocket — يتصل التطبيق بـ Asterisk عبر WSS للمكالمات
        location /ws/sip {
            limit_req zone=ws_limit burst=5 nodelay;
            proxy_pass http://asterisk-ws-pool/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host pstn-gateway;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /sfu {
            limit_req zone=ws_limit burst=10 nodelay;
            proxy_pass http://sfu-pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host media-sfu;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /sfu-health {
            proxy_pass http://sfu-pool/health;
            proxy_set_header Host media-sfu;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Media is downloaded through authenticated /api/media/**. A direct
        # /storage proxy would bypass MediaAccessService and its grant checks.

        location / {
            proxy_pass http://admin-pool;
            proxy_set_header Host admin-panel;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

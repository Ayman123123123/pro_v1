apiVersion: v1
kind: Secret
metadata:
  name: red-backend-secrets
  namespace: red-sovereign
  labels:
    app: red-backend
    component: secrets
type: Opaque
stringData:
  # NOTE: No hardcoded credentials in git. All empty values below MUST be
  # injected at deploy time (CI/CD, external-secrets / Vault / SealedSecrets).
  # Key names match backend application.yml placeholders + docker-compose.
  # Compose services: db-postgres (db red_sovereign, user admin),
  # db-mongo, cache-redis, minio:9000. In-cluster/external k8s Service names
  # below must resolve in the target cluster (no such Services ship in this repo).
  # Database (compose service: db-postgres, db red_sovereign, user admin)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/red_sovereign"
  SPRING_DATASOURCE_USERNAME: "admin"
  DB_USER: "admin"
  DB_PASSWORD: ""

  # MongoDB (compose service: db-mongo; deploy pipeline must template user/password
  # from MONGO_USER/MONGO_PASSWORD into the URI for DocumentDB)
  SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/red_sovereign?authSource=admin"
  MONGO_USER: "red_user"
  MONGO_PASSWORD: ""

  # Redis (compose service: cache-redis)
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # JWT
  JWT_SECRET: ""
  SFU_TICKET_SECRET: ""

  # MinIO (compose service: minio:9000)
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "redadmin"
  MINIO_PASSWORD: ""
  MINIO_BUCKET: "red-media"
  MINIO_BUCKET_MEDIA: "red-media"
  MINIO_BUCKET_AVATARS: "red-avatars"
  MINIO_BUCKET_STORIES: "red-stories"
  MINIO_REGION: "us-east-1"

  # TURN / Push (compose: static-auth-secret via TURN_SECRET; prod long-term
  # credentials via TURN_USERNAME/TURN_PASSWORD + SIP_REALM)
  TURN_SECRET: ""
  TURN_USERNAME: ""
  TURN_PASSWORD: ""
  SIP_REALM: "red.sovereign"
  TURN_PUBLIC_HOST: ""
  TURN_EXTERNAL_IP: ""

  # Admin (username non-secret; password injected)
  RED_ADMIN_USERNAME: "red_admin"
  RED_ADMIN_PASSWORD: ""

  # Rate Limits
  RATELIMIT_LOGIN: "5"
  RATELIMIT_REGISTER: "3"
  RATELIMIT_PASSWORD_RESET: "2"
  RATELIMIT_API_DEFAULT: "100"
  RATELIMIT_WS: "50"
  RATELIMIT_MEDIA: "10"

  # TURN Servers (JSON array)
  TURN_SERVERS: '[]'

  # Zipkin/Jaeger
  ZIPKIN_ENDPOINT: "http://jaeger:9411/api/v2/spans"
# NOTE: No static tls-cert Secret checked in. TLS is issued by cert-manager
# (ClusterIssuer letsencrypt-prod) into `red-tls-secret` referenced by Ingress.

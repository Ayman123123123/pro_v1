apiVersion: v1
kind: Secret
metadata:
  name: red-backend-secrets
  namespace: red-sovereign
  labels:
    app: red-backend
    component: secrets
type: Opaque
stringData:
  # Database
  DATABASE_URL: "jdbc:postgresql://postgres:5432/red_prod"
  DATABASE_USERNAME: "red_user"
  DATABASE_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"

  # MongoDB
  MONGODB_URI: "mongodb://mongodb:27017/red_prod"
  MONGODB_DATABASE: "red_prod"
  MONGODB_SSL_ENABLED: "false"

  # Redis
  REDIS_URL: "redis://redis:6379"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  REDIS_SSL_ENABLED: "false"

  # JWT
  JWT_SECRET: "CHANGE_ME_256_BIT_SECRET_KEY_AT_LEAST_32_CHARS"

  # MinIO
  MINIO_URL: "http://minio:9000"
  MINIO_ACCESS_KEY: "CHANGE_ME_MINIO_ACCESS"
  MINIO_SECRET_KEY: "CHANGE_ME_MINIO_SECRET"
  MINIO_BUCKET: "red-media"
  MINIO_REGION: "us-east-1"

  # SSL
  SSL_KEYSTORE_PASSWORD: "CHANGE_ME_KEYSTORE_PASSWORD"
  SSL_KEY_ALIAS: "red-backend"

  # VAPID Push
  VAPID_PUBLIC_KEY: "CHANGE_ME_VAPID_PUBLIC"
  VAPID_PRIVATE_KEY: "CHANGE_ME_VAPID_PRIVATE"

  # Admin
  RED_ADMIN_USERNAME: "admin"
  RED_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  RED_ADMIN_EMAIL: "admin@red-sovereign.example.com"

  # Rate Limits
  RATELIMIT_LOGIN: "5"
  RATELIMIT_REGISTER: "3"
  RATELIMIT_PASSWORD_RESET: "2"
  RATELIMIT_API_DEFAULT: "100"
  RATELIMIT_WS: "50"
  RATELIMIT_MEDIA: "10"

  # TURN Servers (JSON array)
  TURN_SERVERS: '[]'

  # Zipkin/Jaeger
  ZIPKIN_ENDPOINT: "http://jaeger:9411/api/v2/spans"
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert
  namespace: red-sovereign
  labels:
    app: red-backend
    component: tls
type: kubernetes.io/tls
data:
  # Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt
  # Then base64 encode: cat tls.crt | base64 -w0
  tls.crt: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUZhekNDQTFPZ0F3SUJBZ0lVYkV4Y0JnT0w0Zz09Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0="
  tls.key: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JSUpRZ0lCQURBTkJna3Foa2lHOXcwQkFRRUZBQVNDQ1N3d2dna29CZ2dxaGtpRzkyTmtBUTRJQ0R3QXdnZ0lLQWoKLS0tLS1FTkQgU1JJIEVORC0tLS0t"
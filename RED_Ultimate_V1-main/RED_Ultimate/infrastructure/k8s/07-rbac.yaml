apiVersion: v1
kind: ServiceAccount
metadata:
  name: red-backend
  namespace: red-sovereign
  labels:
    app: red-backend
    component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: red-backend
  namespace: red-sovereign
  labels:
    app: red-backend
    component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: red-backend
  namespace: red-sovereign
  labels:
    app: red-backend
    component: backend
subjects:
  - kind: ServiceAccount
    name: red-backend
    namespace: red-sovereign
roleRef:
  kind: Role
  name: red-backend
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: red-admin-dashboard
  namespace: red-sovereign
  labels:
    app: red-admin-dashboard
    component: frontend
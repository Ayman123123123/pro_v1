apiVersion: v1
kind: ConfigMap
metadata:
  name: red-backend-config
  namespace: red-sovereign
  labels:
    app: red-backend
    component: config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SERVER_IO_THREADS: "4"
  SERVER_WORKER_THREADS: "64"
  DB_POOL_MAX: "20"
  DB_POOL_MIN: "5"
  REDIS_POOL_MAX: "20"
  REDIS_POOL_MAX_IDLE: "10"
  REDIS_POOL_MIN_IDLE: "2"
  JWT_ACCESS_EXPIRY: "900000"
  JWT_REFRESH_EXPIRY: "604800000"
  ARGON2_ITERATIONS: "3"
  ARGON2_MEMORY: "65536"
  ARGON2_PARALLELISM: "4"
  MAX_MESSAGE_LENGTH: "4096"
  MAX_MEDIA_SIZE: "52428800"
  MESSAGE_RETENTION_DAYS: "90"
  BURN_MAX_TIMER: "86400"
  MAX_GROUP_MEMBERS: "1000"
  MAX_GROUP_ADMINS: "10"
  MAX_CALL_PARTICIPANTS: "50"
  MAX_CALL_DURATION: "14400"
  FEATURE_REGISTRATION: "true"
  FEATURE_GROUPS: "true"
  FEATURE_CALLS: "true"
  FEATURE_STORIES: "true"
  FEATURE_COMMUNITIES: "true"
  FEATURE_PUSH: "true"
  FEATURE_ADMIN_DASHBOARD: "true"
  RED_SERVER_NAME: "RED Sovereign"
  RED_SERVER_DOMAIN: "red-sovereign.example.com"
  CORS_ALLOWED_ORIGINS: "https://app.red-sovereign.example.com,https://admin.red-sovereign.example.com"
  WS_ALLOWED_ORIGINS: "https://app.red-sovereign.example.com"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_COM_RED: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: red-admin-dashboard-config
  namespace: red-sovereign
  labels:
    app: red-admin-dashboard
    component: config
data:
  NODE_ENV: "production"
  VITE_API_BASE_URL: "https://api.red-sovereign.example.com"
  VITE_WS_URL: "wss://api.red-sovereign.example.com"
  VITE_APP_NAME: "RED Admin Dashboard"
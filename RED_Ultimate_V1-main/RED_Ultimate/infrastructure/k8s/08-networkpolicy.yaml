apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: red-backend-netpol
  namespace: red-sovereign
  labels:
    app: red-backend
    component: backend
spec:
  podSelector:
    matchLabels:
      app: red-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # Allow from admin dashboard
    - from:
        - podSelector:
            matchLabels:
              app: red-admin-dashboard
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL (RDS in VPC private subnets; no DB pods in-cluster,
    # so podSelector would never match and would blackhole traffic)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
    # Allow MongoDB (DocumentDB in VPC private subnets)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 27017
    # Allow Redis (ElastiCache in VPC private subnets)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 6379
    # Allow MinIO
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # Allow external HTTPS (for push, webhooks, etc.)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Allow Prometheus metrics scraping
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: red-admin-dashboard-netpol
  namespace: red-sovereign
  labels:
    app: red-admin-dashboard
    component: frontend
spec:
  podSelector:
    matchLabels:
      app: red-admin-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow backend API
    - to:
        - podSelector:
            matchLabels:
              app: red-backend
      ports:
        - protocol: TCP
          port: 8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: red-ingress
  namespace: red-sovereign
  labels:
    app: red-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "red-backend"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Security headers
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.red-sovereign.example.com
        - admin.red-sovereign.example.com
      secretName: red-tls-secret
  rules:
    # API Backend
    - host: api.red-sovereign.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: red-backend
                port:
                  number: 8088

    # Admin Dashboard
    - host: admin.red-sovereign.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: red-admin-dashboard
                port:
                  number: 80
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: red-backend
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['backend:8080']}]
  - job_name: postgres
    static_configs: [{targets: ['postgres-exporter:9187']}]
  - job_name: redis
    static_configs: [{targets: ['redis-exporter:9121']}]
  - job_name: mongodb
    static_configs: [{targets: ['mongodb-exporter:9216']}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: ['minio:9000']}]
  - job_name: media-sfu
    metrics_path: /health
    static_configs: [{targets: ['media-sfu:4000']}]
  - job_name: tls-certificate
    metrics_path: /probe
    params: {module: [https_tls]}
    static_configs: [{targets: ['https://nginx:443/health']}]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

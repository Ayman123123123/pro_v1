server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            log: log
            container_name: container_name
            container_id: container_id
      - labels:
          stream:
          container_name:
          container_id:
      - output:
          source: log

  - job_name: red-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: red-backend
          service: backend
          __path__: /var/log/backend/*.log

  - job_name: red-nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: red-nginx
          service: nginx
          __path__: /var/log/nginx/*.log

  - job_name: red-media-sfu
    static_configs:
      - targets:
          - localhost
        labels:
          job: red-media-sfu
          service: media-sfu
          __path__: /var/log/media-sfu/*.log
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'red-backend'
          static_configs:
            - targets: ['backend:8080']
        - job_name: 'red-media-sfu'
          static_configs:
            - targets: ['media-sfu:4000']
        - job_name: 'red-nginx'
          static_configs:
            - targets: ['nginx:80']
        - job_name: 'postgres-exporter'
          static_configs:
            - targets: ['postgres-exporter:9187']
        - job_name: 'redis-exporter'
          static_configs:
            - targets: ['redis-exporter:9121']
        - job_name: 'mongodb-exporter'
          static_configs:
            - targets: ['mongodb-exporter:9216']
        - job_name: 'blackbox-exporter'
          static_configs:
            - targets: ['blackbox-exporter:9115']
        - job_name: 'tempo'
          static_configs:
            - targets: ['tempo:3200']
        - job_name: 'loki'
          static_configs:
            - targets: ['loki:3100']
        - job_name: 'pyroscope'
          static_configs:
            - targets: ['pyroscope:4040']
        - job_name: 'grafana'
          static_configs:
            - targets: ['grafana:3000']

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  logging:
    loglevel: warn

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: service.name
        value: "red-sovereign"
        action: insert
      - key: deployment.environment
        value: "production"
        action: insert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp, otlphttp, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [loki, logging]

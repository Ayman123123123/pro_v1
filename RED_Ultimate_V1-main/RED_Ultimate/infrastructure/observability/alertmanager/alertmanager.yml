global:
  resolve_timeout: 5m
route:
  receiver: red-ops-webhook
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: red-ops-webhook
    webhook_configs:
      - url: http://backend:8080/api/ops/alerts/webhook
        send_resolved: true
        max_alerts: 10

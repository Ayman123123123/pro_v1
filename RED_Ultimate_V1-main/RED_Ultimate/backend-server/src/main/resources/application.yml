server:
  port: 8080

spring:
  mongodb:
    uri: mongodb://${MONGO_USER:red_user}:${MONGO_PASSWORD:}@db-mongo:27017/red_sovereign?authSource=admin
  data:
    redis:
      host: cache-redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

  datasource:
    url: jdbc:postgresql://db-postgres:5432/red_sovereign
    username: ${DB_USER:red_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: false
    # Windows Docker often reports Postgres healthy before it accepts JDBC.
    connect-retries: 30
    connect-retries-interval: 5s

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# Spring Boot Actuator properties belong under `management`, not `spring`.
# The previous nesting was silently ignored, so the intended exposure policy
# and health-detail restriction were never applied.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: red-backend
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ══════════════════════════════════════════
# 🏛️ YOUNES Sovereign Configuration
# ══════════════════════════════════════════
red:
  # Enable only behind a proxy that discards client-supplied X-Forwarded-For.
  trust-x-forwarded-for: ${RED_TRUST_X_FORWARDED_FOR:false}
  dinstar:
    # false = no hardware / Docker cannot see the LAN box. IP calls stay on.
    enabled: ${DINSTAR_ENABLED:false}
    number-learning:
      auto-enabled: true
    heartbeat-ms: ${DINSTAR_HEARTBEAT_MS:30000}
    # بوابة البذرة: تُسجَّل تلقائيًا في الأسطول عند الإقلاع. (192.168.11.2 هو DINSTAR UC2000-VE الحقيقي، .1 هو الراوتر)
    ip: ${DINSTAR_IP:192.168.11.2}
    ips: ${DINSTAR_IPS:}
    port: ${DINSTAR_PORT:443}
    scheme: ${DINSTAR_SCHEME:https}
    username: ${DINSTAR_USERNAME:admin}
    password: ${DINSTAR_PASSWORD:}
    # SPKI pins اختيارية (sha256/...) — عند تعبئتها تُتحقق هوية شهادة البوابة
    # حتى مع trust-all المحلي: OkHttp يرفض أي سلسلة لا تطابق الدبوس.
    # صيغة القيمة: sha256/xxx,sha256/yyy (فاصلة بين بوابات متعددة).
    cert-pins: ${DINSTAR_CERT_SHA256_PINS:}
    connect-timeout: 10s
    read-timeout: 30s
    max-retries: 3
    # مهل بالثواني لعملاء OkHttp لكل بوابة
    connect-timeout-seconds: ${DINSTAR_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${DINSTAR_READ_TIMEOUT:10}
    # مهلة قصيرة أثناء فحص النطاق: عنوان بلا جهاز يجب أن يسقط بسرعة
    probe-timeout-seconds: ${DINSTAR_PROBE_TIMEOUT:2}
    discovery:
      # الفحص معطّل افتراضيًا: لا يُطلق الخادم مسحًا للشبكة بلا قرار صريح.
      enabled: ${DINSTAR_DISCOVERY_ENABLED:false}
      # نطاقات الإدارة بصيغة CIDR ‎/24..‎/30 وعلى عناوين خاصة فقط.
      subnets: ${DINSTAR_DISCOVERY_SUBNETS:}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}
  jwt:
    secret: ${JWT_SECRET:}
    # JWT_SECRET must be set via environment variable — empty string will fail startup check in JwtService
    access-expiration-minutes: 15
    refresh-expiration-days: ${REFRESH_EXPIRATION_DAYS:30}
  identity-authority:
    private-key-path: ${RED_IDENTITY_PRIVATE_KEY_PATH:}
    public-key-path: ${RED_IDENTITY_PUBLIC_KEY_PATH:}
    certificate-valid-days: ${RED_DEVICE_CERTIFICATE_VALID_DAYS:90}
  admin:
    username: ${RED_ADMIN_USERNAME:red_admin}
    password: ${RED_ADMIN_PASSWORD:}
  # Production default is strict secure cookies. Local HTTP development must opt in
  # explicitly with RED_ADMIN_COOKIE_SECURE=false; never weaken production globally.
  admin-cookie:
    secure: ${RED_ADMIN_COOKIE_SECURE:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:redadmin}
    secret-key: ${MINIO_PASSWORD:}
    bucket: ${MINIO_BUCKET:red-media}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:redadmin}
    secret-key: ${MINIO_PASSWORD:}
    bucket-media: ${MINIO_BUCKET_MEDIA:red-media}
    bucket-avatars: ${MINIO_BUCKET_AVATARS:red-avatars}
    bucket-stories: ${MINIO_BUCKET_STORIES:red-stories}
  turn:
    secret: ${TURN_SECRET:}
    public-host: ${TURN_PUBLIC_HOST:127.0.0.1}
    port: 3478
    # Open Relay (Metered.ca) — TURN مجاني عبر الإنترنت
    # يتجاوز CGNAT + الفيروال — 20GB مجاناً شهرياً
    openrelay:
      enabled: ${OPENRELAY_ENABLED:false}
      username: ${OPENRELAY_USERNAME:openrelayproject}
      password: ${OPENRELAY_PASSWORD:openrelayproject}
  pstn:
    daily-limit-default: 100
    signal-threshold: 20
    # سر تسجيل WebRTC في Asterisk — يُقرأ من WEBRTC_SIP_SECRET (نفس القيمة
    # التي يولّد منها docker-entrypoint.sh auth password لنظير red-webrtc-client).
    # ملاحظة: docker-compose يمرّر WEBRTC_SIP_SECRET لكلٍ من backend و pstn-gateway
    # بنفس القيمة؛ أي اختلاف بينهما يجعل SIP REGISTER يفشل بـ 401/403.
    sip-secret: ${WEBRTC_SIP_SECRET:red-secret-token}
    bridge-secret-ttl-minutes: ${PSTN_BRIDGE_SECRET_TTL_MINUTES:60}
    turn-url: ${PSTN_TURN_URL:}
    turn-username: ${PSTN_TURN_USERNAME:}
    turn-password: ${PSTN_TURN_PASSWORD:}
    # WebRTC-PSTN bridge: Asterisk WSS endpoint visible to the Android app.
    # Behind nginx this is typically wss://host:8443/ws/sip; direct is ws://host:8089/ws
    wss-url: ${ASTERISK_WSS_URL:wss://localhost:8089/ws}
  rate-limit:
    enabled: true
    default-requests-per-minute: 60
  # Lifecycle defaults are deliberately conservative. Change only after legal,
  # billing and incident-response retention requirements are approved.
  retention:
    audit-days: ${RED_RETENTION_AUDIT_DAYS:365}
    cdr-days: ${RED_RETENTION_CDR_DAYS:365}
    health-days: ${RED_RETENTION_HEALTH_DAYS:90}
    telemetry-days: ${RED_RETENTION_TELEMETRY_DAYS:90}
    batch-size: ${RED_RETENTION_BATCH_SIZE:10000}

logging:
  level:
    root: INFO
    com.red.server: INFO
    org.springframework.security: WARN
    org.flyway: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

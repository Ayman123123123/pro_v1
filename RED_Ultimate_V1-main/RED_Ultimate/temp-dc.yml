version: '3.8'

services:
  # System C & Core Logic: Unified Backend
  app-server:
    build: ./server
    ports: ["8080:8080"]
    restart: always
    depends_on: [postgres, mongo, redis]

  # System A: VoIP SFU (4K Media)
  mediasoup:
    build: ./mediasoup-sfu
    network_mode: "host" # Required for high-performance RTC

  # System B: PSTN Bridge (Asterisk)
  asterisk:
    image: andrius/asterisk
    volumes: ["./asterisk/config:/etc/asterisk"]
    ports: ["5060:5060/udp", "8088:8088"]

  # Storage & Performance
  postgres: { image: "postgres:16", environment: { POSTGRES_PASSWORD: "admin" } }
  mongo: { image: "mongo:8" }
  redis: { image: "redis:7" }
  minio: { image: "minio/minio", command: "server /data" }

  # Admin Authority
  admin-panel:
    build: ./admin
    ports: ["3000:3000"]

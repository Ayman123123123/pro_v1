  <!-- Center emerald dot -->
  <circle cx="24" cy="24.96" r="0.8639999999999999" fill="#00C98C"/>

  <!-- Sparkle 1 (top-right, gold) -->
  <g transform="translate(37,14)">
    <path d="M 0,-1.2000000000000002 L 0.28800000000000003,-0.384 L 1.2000000000000002,0 L 0.28800000000000003,0.384 L 0,1.2000000000000002 L -0.28800000000000003,0.384 L -1.2000000000000002,0 L -0.28800000000000003,-0.384 Z" fill="#FFE27A"/>
  </g>

  <!-- Sparkle 2 (top-right small, gold) -->
  <g transform="translate(40,20)">
    <path d="M 0,-0.72 L 0.192,-0.24 L 0.72,0 L 0.192,0.24 L 0,0.72 L -0.192,0.24 L -0.72,0 L -0.192,-0.24 Z" fill="#FFE27A" fill-opacity="0.8"/>
  </g>

  <!-- Sparkle 3 (bottom-left, emerald) -->
  <g transform="translate(10,34)">
    <path d="M 0,-0.96 L 0.24,-0.28800000000000003 L 0.96,0 L 0.24,0.28800000000000003 L 0,0.96 L -0.24,0.28800000000000003 L -0.96,0 L -0.24,-0.28800000000000003 Z" fill="#00E6A0"/>
  </g>

  <!-- Small accent dots -->
  <circle cx="40.8" cy="26.400000000000002" r="0.5760000000000001" fill="#35CBE0" fill-opacity="0.6"/>
  <circle cx="7.199999999999999" cy="21.6" r="0.48" fill="#00E6A0" fill-opacity="0.6"/>
  <circle cx="9.600000000000001" cy="9.600000000000001" r="0.384" fill="#FFE27A" fill-opacity="0.7"/>
  <circle cx="38.400000000000006" cy="37.44" r="0.384" fill="#E8B84A" fill-opacity="0.7"/>


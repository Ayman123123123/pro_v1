<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<meta http-equiv="pragma" content="no-cache">
<title>DataRestore</title>
<link href="css/main.css" rel="stylesheet" type="text/css">
<script language="JavaScript" type="text/JavaScript" src="common/func.js"></script>
<script language="javascript" type="text/javascript">
function Permission()
{
	var permit = 1;
	if(permit == 0)
	{
		window.alert("You have no permission.\n Please visit the Access Control page.");
		return 0;
	}
	return 1;
}

function from_check_config()
{
	if(Permission() == 0)
	{
		return false;
	}
	
	if (document.getElementById("ConfigFile").value == "")
	{
		alert("Configuration: please select a configuration file to upload!");
		return false;			
	}
	return true;
}
function ConfigBackup()
{
	if(Permission())
	{
		window.location.href="backup.cfg";
	}
}
</script>
<style type="text/css">
table.tc {
	table-layout:fixed;
	word-wrap:break-word;
	word-break:break-all;
}

table.tc td {
	text-overflow:ellipsis;
	overflow:hidden;
	white-space: nowrap;
}
</style>
</head>
<body>

 <table width="600px" border=0 align="center" cellpadding=0 cellspacing=0>
  <tr class="title">
   <td width="1%"><img src="image/subarc_l.gif" alt="subarc_left" align="left"></td>
   <td>Config Restore and Backup</td>
   <td width="1%"><img src="image/subarc_r.gif" alt="subarc_right" align="right"></td>
  </tr>
 </table>


 <table width="600px" align="center" class="TB">
  <tr>
   	<td width="5%">&nbsp;</td>
    <td width="90%">&nbsp;</td>
    <td width="5%">&nbsp;</td>
  </tr>
  
  <tr>
    <td>&nbsp;</td>
    <td  class="td_title">&nbsp;Send data file from your computer to the device.</td>
    <td>&nbsp;</td>
  </tr>
  
  <tr>
   <td>&nbsp;</td>
   <td>  
     <form action="/goform/HttpConfigUpload" enctype="multipart/form-data" method="post" name="HttpConfigUpload" id="HttpConfigUpload">
       <table width="100%" class="tc">
         <tr>
          <td width="20%">Configuration</td>
          
          <td width="60%"><input name="ConfigFile" id="ConfigFile" type="file" size="32"></td>
          <td width="20%"><input class="button" id="upload" name="upload" type="submit" value="Restore"  onClick="return from_check_config();"></td>
         </tr>
       </table>    
     </form>
   </td>
   <td>&nbsp;</td>   
  </tr>
  <tr>
	<td>&nbsp;</td>
	<td class="td_title">&nbsp;Data Backup</td>
	<td>&nbsp;</td>
  </tr>
  <tr>
	<td>&nbsp;</td>
		<td>
			<table width="540px" >
			<tr>
			<td width="80%">Click 'Backup' for download <strong>configuration</strong> file to your computer.</td>
			<td width="20%"><input class="button" type="button" value="Backup" onClick="ConfigBackup();"></td> 
			</tr>
			</table>
	   </td>
	   <td>&nbsp;</td>
    </tr>
      <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>	
		<td>&nbsp;</td>	
     </tr>
 </table>

</ol></li></ol>
</td></tr></table>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="pragma" content="no-cache">
<title>Phone Number Learning</title>
<link href="css/main.css" rel="stylesheet" type="text/css">
<script language="JavaScript" type="text/JavaScript" src="common/func.js"></script>
<script language="javascript" type="text/javascript">
var RowCount = 0;
var TableSize = 8;
function MM_callJS(rownum)
{
    RowCount = parseInt(rownum);
        
    if(RowCount>0) {
         document.getElementById("HBPhoneNumberRuleNone").style.display="none";
    } 
    else 
    {
    }
    
    mouse_click();
}

function mouse_click()
{
    var i = 0,Selectcount = 0;
    
    for (i = 0; i < TableSize;i++)
    {
        if (document.getElementById("HBPhoneNumberRuleEnable"+i) != null && eval("document.forms[0].HBPhoneNumberRuleEnable"+i+".checked") == true)
        {
            Selectcount++;
        }
    }

    if (Selectcount==1)
    {
        document.forms[0].Del.disabled = false;
        document.forms[0].Mod.disabled = false;
    }
    else if (Selectcount>1)
    {
        document.forms[0].Del.disabled = false;
        document.forms[0].Mod.disabled = true;
    }
    else
    {
        document.forms[0].Del.disabled = true;
        document.forms[0].Mod.disabled = true;
    }
    
    if (RowCount >= TableSize)
    {
        document.forms[0].Add.disabled = true;
    }
}

function AddData()
{
    location.href = "enHBPhoneNumberAdd.htm";
}

function DelData()
{
    if(confirm("Sure to delete?"))
    {  
        document.forms[0].action="/goform/HBPhoneNumberRuleDelete";
        return true;
    }
    return false;
}

function ModData()
{
    document.forms[0].action="/goform/HBPhoneNumberRuleGoModify";
    document.forms[0].submit();
}


function CheckAll()
{
    var i;
    if(document.getElementById("HBPhoneNumberCheckAll").checked == true)
    {
        for(i = 0; i < TableSize; i++)
        {
            if(document.getElementById("HBPhoneNumberRuleEnable"+i) != null )
            {
                document.getElementById("HBPhoneNumberRuleEnable"+i).checked = true;
            }
            
        }
    }
    else
    {
        for(i = 0; i < TableSize; i++)
        {
            if(document.getElementById("HBPhoneNumberRuleEnable"+i) != null )
            {
                document.getElementById("HBPhoneNumberRuleEnable"+i).checked = false;
            }
        }
    }
    mouse_click();
}
</script>
</head>
<body onLoad="MM_callJS('1')">
<form action="/goform/HBPhoneNumberSet" method="post" name="HBPhoneNumberSet" id="HBPhoneNumberSet">
  
 <table width="900px" border=0 align="center" cellpadding=0 cellspacing=0>
  <tr class="title">
   <td width="1%"><img src="image/subarc_l.gif" alt="subarc_left" align="left"></td>
   <td>Phone Number Learning</td>
   <td width="1%"><img src="image/subarc_r.gif" alt="subarc_right" align="right"></td>
  </tr>
 </table>
<table class="content" width="900px" align="center">
  <tr class="thead">
    <td width="5%">&nbsp;</td>    
    <td width="5%">Index</td>
    <td width="5%">Type</td>
    <td width="12%">Dest Number</td>
    <td width="25%">Send Text</td>
    <td width="12%">Check From</td>
    <td width="25%">Keywords</td>
    <td width="8%">Port Group</td>
  </tr>    
  <tr id="HBPhoneNumberRuleNone" BGCOLOR="#FFFFFF" align="center">
    <td>&nbsp;</td>
    <td>---</td>
    <td>---</td>
    <td>---</td>
    <td>---</td>
    <td>---</td>
    <td>---</td>
    <td>---</td>
  </tr>   
  <tr id='HBPhoneNumberRule0' align='center'>
<td><input name='HBPhoneNumberRuleEnable0' type='checkbox' id='HBPhoneNumberRuleEnable0' onClick='mouse_click();'></td>
<td>0</td>
<td>SMS</td>
<td>333</td>
<td>MMN</td>
<td></td>
<td>[*][N]</td>
<td>0</td>
</tr>

  <tr id="last" align="center">
    <td><input name='HBPhoneNumberCheckAll' type='checkbox' id='HBPhoneNumberCheckAll' onClick="CheckAll();"></td>
    <td>All</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
    <td>&nbsp;</td>
  </tr> 
</table>
<p align="center">
 <input name="Add"  class="button" type="button" id="Add" value="Add" onClick="AddData();"> 
 &nbsp;&nbsp;&nbsp;&nbsp;
 <input name="Del"  class="button" type="submit" id="Del" value="Del" onClick="return DelData();"> 
 &nbsp;&nbsp;&nbsp;&nbsp;
 <input name="Mod"  class="button" type="submit" id="Mod" value="Modify" onClick="ModData();"> 
</p>
<p style="display:none">
<input name='eeee' type='checkbox' id='eeee' checked>
</p>
</form>
</body>
</html>

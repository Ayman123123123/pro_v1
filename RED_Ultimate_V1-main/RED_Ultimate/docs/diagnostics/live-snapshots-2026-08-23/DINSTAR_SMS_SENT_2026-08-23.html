function charCompare_length_limit(szname,limit){
	var c;
	var ch = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+";
	if(szname.length > limit)
		return false;
	for (var i = 0; i < szname.length; i++){
		c = szname.charAt(i);
		if (ch.indexOf(c) == -1){
				return false;
		}
	}
	return true;
}

function IsLeapYear(iYear) 
{
 	if (iYear % 4 == 0 && iYear % 100 != 0)
 	{
 		return true;
 	} 
 	else if(iYear % 400 == 0) 
 	{
   		return true;
 	} 
  	else 
  	{
   		return false;
  	}
}

function GetDayCount(month,year)
{
	if(month==1 || month==3 || month==5 || month==7 || month==8 || month==10 || month==12)
	{
		return 31;
	}
	else if(month==4 || month==6 || month==9 || month==11)
	{
		return 30;
	}
	else if(month == 2)
	{
		if(IsLeapYear(year))
		{
			return 29;
		}
		else
		{
			return 28;
		}
	}
	else
	{
		return 0;
	}
}

function MM_CalllJS(TotalPort, SelsectPort, StartTime, EndTime, SendFlag)
{
	var i = 0;	
	var totalPort = parseInt(TotalPort);
	var selectPort = parseInt(SelsectPort);
	var startTime, endTime;
	
	for(var i=0; i<totalPort; i++)
	{
		if(i == selectPort)
		{
			document.getElementById("SelectPort").options[i].selected=true;
		}
		else
		{
			document.getElementById("SelectPort").options[i].selected=false;
		}			
	}
	if(selectPort == 255)
	{
		document.getElementById("SelectPort").options[i].selected=true;
	}
	else
	{
		document.getElementById("SelectPort").options[i].selected=false;
	}
	
	if(SendFlag == 1)
	{
		startTime = new Date(StartTime);
		endTime = new Date(EndTime);
	}
	else
	{
		startTime = new Date('2010/1/1 00:00:00');
		endTime = new Date();
	}
	
		
	document.getElementById("StartDay").options.add(new Option("28",28));
	document.getElementById("StartDay").options.add(new Option("29",29));
	document.getElementById("StartDay").options.add(new Option("30",30));
	document.getElementById("StartDay").options.add(new Option("31",31));
	
	document.getElementById("EndDay").options.add(new Option("28",28));
	document.getElementById("EndDay").options.add(new Option("29",29));
	document.getElementById("EndDay").options.add(new Option("30",30));
	document.getElementById("EndDay").options.add(new Option("31",31));
	
	document.forms[0].StartYear.value = parseInt(startTime.getFullYear());
	document.forms[0].StartMonth.value = parseInt(startTime.getMonth())+1;
	document.forms[0].StartDay.value = parseInt(startTime.getDate());
	
	document.forms[0].EndYear.value = parseInt(endTime.getFullYear());
	document.forms[0].EndMonth.value = parseInt(endTime.getMonth())+1;
	document.forms[0].EndDay.value = parseInt(endTime.getDate());	
	mouse_click();	
}

function mouse_click()
{
	var StartDayCount = GetDayCount(document.forms[0].StartMonth.value, document.forms[0].StartYear.value);	
	var EndDayCount = GetDayCount(document.forms[0].EndMonth.value, document.forms[0].EndYear.value);
	var StartDay = document.forms[0].StartDay.value;
	var EndDay = document.forms[0].EndDay.value;
	
	while (document.forms[0].StartDay.length > 27)
	{
		document.getElementById("StartDay").options.remove(27);
	}
	
	var i;
	for (i=28; i<=StartDayCount; i++)
	{
		document.getElementById("StartDay").options.add(new Option(""+i,i));
	}
	
	while (document.forms[0].EndDay.length > 27)
	{
		document.getElementById("EndDay").options.remove(27);
	}	

	var j;
	for (j=28; j<=EndDayCount; j++)
	{
		document.getElementById("EndDay").options.add(new Option(""+j,j));
	}

	document.forms[0].StartDay.value = StartDay;
	document.forms[0].EndDay.value = EndDay;
	
	return true;
}

function form_check()
{
	if(parseInt(document.forms[0].StartYear.value) > parseInt(document.forms[0].EndYear.value))
	{
		alert("The end year must more than the start year!");
		return false;
	}
	else if(parseInt(document.forms[0].StartYear.value) == parseInt(document.forms[0].EndYear.value))
	{
		if(parseInt(document.forms[0].StartMonth.value) > parseInt(document.forms[0].EndMonth.value))
		{
			alert("The end month must not be less than the start month in the same year!");
			return false;
		}
		else if(parseInt(document.forms[0].StartMonth.value) == parseInt(document.forms[0].EndMonth.value))
		{
			if(parseInt(document.forms[0].StartDay.value) > parseInt(document.forms[0].EndDay.value))
			{
				alert("The end day must not be less than the start day in the same month!");
				return false;
			}
		}
	}
	
	if(false == charCompare_length_limit(document.forms[0].SmsNumber.value.length, 31))
	{
		alert("Number is incorrect, and input length must be less than 31!");
		document.forms[0].SmsNumber.select();
		return false;
	}
		
	if(isRegDigit(document.getElementById("IMSI").value) == false || document.getElementById("IMSI").value.length > 15)
	{
		alert("IMSI is incorrect, and length must be less than 16!");
		document.getElementById("IMSI").select();
		return false;
	}
	
	return true;
}

function text_focus(text_id)

function text_blur(text_id)
{

server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:red_user}:${MONGO_PASSWORD:}@db-mongo:27017/red_sovereign?authSource=admin
    redis:
      host: cache-redis
      port: 6379
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

  datasource:
    url: jdbc:postgresql://db-postgres:5432/red_sovereign
    username: ${DB_USER:red_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# RED Sovereign Configuration
red:
  dinstar:
    ip: ${DINSTAR_IP:192.168.11.1}
    port: ${DINSTAR_PORT:80}
    scheme: ${DINSTAR_SCHEME:http}
    username: ${DINSTAR_USERNAME:}
    password: ${DINSTAR_PASSWORD:}

  minio:
    endpoint: http://minio:9000
    access-key: ${MINIO_USER:redadmin}
    secret-key: ${MINIO_PASSWORD:}
    bucket: red-media

  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}
    refresh-expiration-days: ${REFRESH_EXPIRATION_DAYS:30}

  turn:
    host: ${TURN_PUBLIC_HOST:127.0.0.1}
    port: ${TURN_PORT:3478}
    secret: ${TURN_SECRET:}

  identity-authority:
    private-key-path: ${RED_IDENTITY_PRIVATE_KEY_PATH:}
    public-key-path: ${RED_IDENTITY_PUBLIC_KEY_PATH:}
    certificate-valid-days: ${RED_DEVICE_CERTIFICATE_VALID_DAYS:90}

  bootstrap-admin:
    username: ${RED_ADMIN_USERNAME:}
    password: ${RED_ADMIN_PASSWORD:}

# Logging
logging:
  level:
    com.red: DEBUG
    org.springframework.web: INFO

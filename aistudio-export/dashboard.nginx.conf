server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # لا نُفصح عن إصدار nginx في الردود وصفحات الخطأ.
  server_tokens off;

  # ─── Security headers ───
  #
  # ⚠️ تحذير nginx جوهري: `add_header` **لا يُورَّث** إلى أي كتلة
  # `location` تُعرّف `add_header` خاصًا بها. كتلة الأصول الساكنة
  # أدناه تضيف `Cache-Control`، فكانت تُسقط كل الرؤوس الأمنية عن
  # ملفات JS وCSS — أي عن الشيفرة القابلة للتنفيذ تحديدًا. لذلك
  # تُعاد الرؤوس صراحةً في كل كتلة تستعمل add_header.
  #
  # ملاحظة: `X-Younes-Version` أُزيل — الإفصاح عن إصدار التطبيق
  # يساعد المهاجم على مطابقة ثغرة معروفة بلا فائدة تشغيلية مقابلة.

  # سياسة أمن المحتوى — الدفاع الأهم ضد XSS، وكانت غائبة تمامًا.
  # 'unsafe-inline' للأنماط ضرورة يفرضها antd (يحقن أنماطًا في الوقت
  # الفعلي)؛ أما السكربتات فمقيّدة بـ 'self' بلا استثناء.
  # `connect-src` يسمح بـ ws/wss لبثّ السجل الحي.
  set $red_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'";

  add_header Content-Security-Policy $red_csp always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # ─── SPA fallback — كل المسارات تعود لـ index.html ───
  location / {
    try_files $uri $uri/ /index.html;

    # HTML لا يُخزَّن: وإلا بقي المستخدم على نسخة قديمة تشير إلى
    # ملفات أصول حُذفت بعد النشر، فتظهر صفحة بيضاء.
    add_header Cache-Control "no-store, must-revalidate" always;

    add_header Content-Security-Policy $red_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # ─── Static assets — تخزين 7 أيام + immutable ───
  # آمن لأن Vite يبصم أسماء الملفات بالمحتوى (hash).
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;

    add_header Cache-Control "public, immutable" always;
    add_header Content-Security-Policy $red_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # ─── منع الوصول إلى الملفات المخفية (.git/.env وما شابه) ───
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Container liveness only. Browser /health must hit the Kotlin API via
  # the edge Nginx on 8088 — never this plaintext placeholder.
  location = /panel-alive {
    access_log off;
    default_type text/plain;
    return 200 "alive\n";
  }
}

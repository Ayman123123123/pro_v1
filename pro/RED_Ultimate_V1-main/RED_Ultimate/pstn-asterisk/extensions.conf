[from-red-backend]
; AMI originates only Local channels into this context. Backend validates Yemeni numbers and limits first.
exten => _X.,1,NoOp(Authorized RED DINSTAR call to ${EXTEN})
 same => n,Set(CDR(userfield)=RED_DINSTAR)
 same => n,Dial(PJSIP/${EXTEN}@dinstar-gateway,60)
 same => n,Hangup()

[from-dinstar]
; Route incoming GSM calls through Asterisk AMI/Stasis to notify backend and ring the Android app
exten => _X.,1,NoOp(Incoming DINSTAR GSM call from ${CALLERID(num)} on port ${EXTEN})
 same => n,Set(CDR(userfield)=INCOMING_DINSTAR)
 same => n,UserEvent(DinstarIncomingCall,CallerID:${CALLERID(num)},Port:${EXTEN})
 same => n,Dial(PJSIP/red-backend,30)
 same => n,Hangup()

exten => s,1,NoOp(Incoming DINSTAR GSM call from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=INCOMING_DINSTAR)
 same => n,UserEvent(DinstarIncomingCall,CallerID:${CALLERID(num)})
 same => n,Dial(PJSIP/red-backend,30)
 same => n,Hangup()

[from-red-client]
; PSTN is backend-authorized only. A registered SIP/WebRTC client cannot dial the gateway directly.
exten => _X.,1,NoOp(Blocked direct client PSTN attempt)
 same => n,Hangup(21)

name: Build RED Android

on:
  push:
    branches:
      - 'fix/**'
      - 'extracted/**'
    paths:
      - 'project/**'
      - 'workflow-ready/**'
  workflow_dispatch:
    inputs:
      server_url:
        description: "RED server URL (http://IP:8088)"
        default: "http://192.168.1.50:8088"
        required: true
      target_abi:
        description: "Target ABI"
        default: "arm64-v8a"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub runner already provides Android SDK + sdkmanager. We only
      # accept licenses here and let Gradle/AGP install any missing platform
      # or build-tools package. This avoids brittle manual package names.
      - name: Accept Android SDK licenses
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed | head -80 || true
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          kotlin.compiler.execution.strategy=in-process
          android.suppressUnsupportedCompileSdk=37
          android.builder.sdkDownload=true
          EOF

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-red-${{ runner.os }}-${{ hashFiles('project/**/libs.versions.toml','project/**/gradle-wrapper.properties') }}

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "server_url=${{ github.event.inputs.server_url }}" >> "$GITHUB_OUTPUT"
            echo "target_abi=${{ github.event.inputs.target_abi }}" >> "$GITHUB_OUTPUT"
          else
            echo "server_url=http://192.168.1.50:8088" >> "$GITHUB_OUTPUT"
            echo "target_abi=arm64-v8a" >> "$GITHUB_OUTPUT"
          fi

      - name: Android integrity gate
        run: |
          ROOT="project/pro/RED_Ultimate_V1-main/RED_Ultimate"
          cd "$ROOT"
          python3 scripts/check-android-integrity.py
          python3 scripts/check-kotlin-static.py

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ROOT="project/pro/RED_Ultimate_V1-main/RED_Ultimate"
          cd "$ROOT"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          cat >> gradle.properties <<EOF
          RED_SERVER_URL=${{ steps.inputs.outputs.server_url }}
          RED_TARGET_ABI=${{ steps.inputs.outputs.target_abi }}
          EOF
          ./gradlew :app:assembleDebug -PRED_SKIP_BUILD_LOGIC=true --stacktrace --no-daemon --info 2>&1 | tee build-output.log

      - name: Extract build errors
        if: always()
        run: |
          LOG="project/pro/RED_Ultimate_V1-main/RED_Ultimate/build-output.log"
          if [ -f "$LOG" ]; then
            {
              echo "## Build result: ${{ steps.build.outcome }}"
              echo
              echo "### Compiler/Gradle errors"
              echo '```'
              grep -E "^e: |error: |: error:|FAILURE:|What went wrong|Execution failed|Unresolved reference|Cannot access|Could not |SDK location|license|build-tools|platforms;android" "$LOG" | head -200 || echo "(none found)"
              echo '```'
              echo
              echo "### Last 180 lines"
              echo '```'
              tail -n 180 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build log was not produced; inspect earlier steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: project/pro/RED_Ultimate_V1-main/RED_Ultimate/build-output.log
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: red-app-debug
          path: project/pro/RED_Ultimate_V1-main/RED_Ultimate/red-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find project/pro/RED_Ultimate_V1-main/RED_Ultimate/red-app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" red-app-debug.apk
          gh release upload v1.0.0 red-app-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK attached to release v1.0.0"

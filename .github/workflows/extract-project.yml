name: Extract pro.rar project
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to push extracted files to"
        default: "extracted/v1.0.0"
        required: true
      release_tag:
        description: "Release tag to download pro.rar from"
        default: "v1.0.0"
        required: true
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full p7zip-rar unrar-free jq rsync git-lfs || true
          sudo apt-get install -y unrar git-lfs || true
          git --version || true
          7z --help || true
          unrar || true
      - name: Download pro.rar from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/work
          # Determine inputs with defaults (works for workflow_dispatch and push)
          RELEASE_TAG="${{ github.event.inputs.release_tag || '' }}"
          RELEASE_TAG="${RELEASE_TAG:-v1.0.0}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch || '' }}"
          TARGET_BRANCH="${TARGET_BRANCH:-extracted/v1.0.0}"
          echo "Downloading pro.rar from release $RELEASE_TAG..."
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pro.rar' \
            --dir /tmp/work \
            --clobber || true
          echo "Download result:" && ls -lh /tmp/work || true
          echo "pro.rar info:" && file /tmp/work/pro.rar || true
      - name: Extract pro.rar
        run: |
          set -euo pipefail
          mkdir -p /tmp/work/extracted
          cd /tmp/work
          extracted_ok=0
          if command -v unrar >/dev/null 2>&1; then
            echo "Trying unrar..."
            unrar x -o+ pro.rar extracted/ && extracted_ok=1 || echo "unrar failed, will try 7z"
          fi
          if [ "$extracted_ok" -ne 1 ] && command -v 7z >/dev/null 2>&1; then
            echo "Trying 7z..."
            7z x pro.rar -oextracted -y && extracted_ok=1 || echo "7z failed"
          fi
          if [ "$extracted_ok" -ne 1 ]; then
            echo "ERROR: could not extract pro.rar" >&2
            exit 1
          fi
          echo "Extraction complete. Top-level entries:"
          ls -la extracted/ || true
          echo "Total extracted size:"
          du -sh extracted/ || true
          echo "Sample extracted files (up to 100 lines):"
          find extracted -maxdepth 3 -type f | sed -n '1,100p' || true
      - name: Prepare target branch and copy files
        run: |
          set -euo pipefail
          # Recompute TARGET (works for both dispatch and push runs)
          TARGET="${{ github.event.inputs.target_branch || '' }}"
          TARGET="${TARGET:-extracted/v1.0.0}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$TARGET" origin/main
          mkdir -p project
          echo "Copying extracted files into project/ with excludes..."
          rsync -a \
            --exclude='build/' \
            --exclude='.gradle/' \
            --exclude='.idea/caches/' \
            --exclude='.idea/libraries/' \
            --exclude='local.properties' \
            --exclude='*.iml' \
            --exclude='captures/' \
            --exclude='.externalNativeBuild/' \
            --exclude='.cxx/' \
            --exclude='*.apk' \
            --exclude='*.aab' \
            --exclude='.git/' \
            --exclude='.DS_Store' \
            /tmp/work/extracted/ project/
          echo "Resulting project/ size:"
          du -sh project/ || true
          echo "File count:"
          find project -type f | wc -l || true
      - name: Set up Git LFS and track large files
        run: |
          set -euo pipefail
          git lfs install --system || git lfs install || true
          echo "Tracking files larger than 100MB with Git LFS..."
          large_count=0
          while IFS= read -r -d '' f; do
            git lfs track "${f#./}" || git lfs track "$f" || true
            large_count=$((large_count+1))
            echo "LFS: $f"
          done < <(find project -type f -size +100M -print0)
          echo "Large files tracked: $large_count"
          if [ -f .gitattributes ]; then
            echo ".gitattributes content:" && cat .gitattributes || true
          fi
      - name: Generate FILE_MANIFEST.md and MISSING_FILES.md (robust)
        run: |
          # generate manifest using temporary files to avoid broken-pipe errors
          # and disable pipefail for pipelines that may SIGPIPE when head exits early
          set -euo pipefail
          MANIFEST="project/FILE_MANIFEST.md"
          MISSING="project/MISSING_FILES.md"
          TMP_LIST=/tmp/pro_files_list.txt
          TMP_TYPES=/tmp/pro_file_types.txt
          TMP_TOP=/tmp/pro_top50.txt
          find project -type f -printf "%f\t%s\t%p\n" > "$TMP_LIST" || true

          total_files=$(wc -l < "$TMP_LIST" || echo 0)
          total_dirs=$(find project -type d | wc -l || echo 0)

          # File types summary
          awk -F"\t" '{ name=$1; size=$2; ext="[no-ext]"; if (match(name, /\.([^.]+)$/, arr)) ext="."arr[1]; cnt[ext]++; tot[ext]+=size } END { for (e in cnt) printf "%s\t%d\t%d\n", e, cnt[e], tot[e] }' "$TMP_LIST" > "$TMP_TYPES" || true

          # Top 50 largest files: disable pipefail around pipelines that may cause SIGPIPE
          set +o pipefail
          sort -rn -k2 "$TMP_LIST" | head -n 50 > "$TMP_TOP" || true
          set -o pipefail

          {
            echo "# FILE_MANIFEST"
            echo
            echo "Generated on: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Source: pro.rar from release ${{ github.event.inputs.release_tag || 'v1.0.0' }}"
            echo
            echo "- Total files: $total_files"
            echo "- Total directories: $total_dirs"
            echo
            echo "## File types summary (extension — count — total size bytes)"
            if [ -s "$TMP_TYPES" ]; then
              awk -F"\t" '{printf "- %s — %s files — %s bytes\n", $1, $2, $3}' "$TMP_TYPES"
            else
              echo "(no files)"
            fi
            echo
            echo "## Top 50 largest files (path — size bytes)"
            if [ -s "$TMP_TOP" ]; then
              awk -F"\t" '{printf "- %s — %s bytes\n", $1, $2}' "$TMP_TOP"
            else
              echo "(no files)"
            fi
            echo
            echo "## Detected project type"
            ptype="Unknown"
            if find project -name "pubspec.yaml" -print -quit | grep -q .; then ptype="Flutter (Dart)"; fi
            if find project -name "package.json" -print -quit | grep -q .; then ptype="Node.js / React / React Native"; fi
            if find project \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | grep -q .; then ptype="Android / Gradle (Java/Kotlin)"; fi
            if find project -name "AndroidManifest.xml" -print -quit | grep -q .; then ptype="$ptype + Android resources"; fi
            if find project -name "*.csproj" -print -quit | grep -q .; then ptype=".NET / Xamarin"; fi
            if find project -name "*.unity" -print -quit | grep -q .; then ptype="Unity"; fi
            if find project -name "Capacitor.config.*" -print -quit | grep -q .; then ptype="Capacitor"; fi
            if find project -name "nativescript.config.ts" -print -quit | grep -q .; then ptype="NativeScript"; fi
            echo "- $ptype"
          } > "$MANIFEST"

          {
            echo "# MISSING_FILES"
            echo
            echo "Files that could not be committed to git (e.g. too large for push)."
            echo
          } > "$MISSING"

          echo "Manifest written to $MANIFEST"
          ls -l "$MANIFEST" || true
      - name: Commit and push (with LFS fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TARGET="${{ github.event.inputs.target_branch }}"
          # fallback if empty
          TARGET="${TARGET:-extracted/v1.0.0}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract project from pro.rar (${{ github.event.inputs.release_tag }})"
          PUSH_LOG=/tmp/push.log
          if git push --set-upstream origin "$TARGET" 2>&1 | tee "$PUSH_LOG"; then
            echo "Push succeeded."
          else
            echo "Push failed; attempting LFS fallback..."
            cat "$PUSH_LOG" || true
            git lfs ls-files -n | while IFS= read -r f; do
              [ -z "$f" ] && continue
              git rm --cached "$f" 2>/dev/null || true
              rm -f "$f" || true
              echo "- $f ($(stat -c%s "$f" 2>/dev/null || echo "unknown") bytes)" >> project/MISSING_FILES.md || true
            done
            if [ -f .gitattributes ]; then
              grep -v 'filter=lfs' .gitattributes > .gitattributes.tmp || true
              mv .gitattributes.tmp .gitattributes || true
              if [ ! -s .gitattributes ]; then rm -f .gitattributes || true; fi
            fi
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit || true
            fi
            git push --force-with-lease --set-upstream origin "$TARGET" || true
          fi
      - name: Create pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TARGET="${{ github.event.inputs.target_branch }}"
          TARGET="${TARGET:-extracted/v1.0.0}"
          sleep 3
          if gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr view "$TARGET" --repo "$GITHUB_REPOSITORY" --json url -q '.url'
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET" \
              --title "Extract project from release ${{ github.event.inputs.release_tag }}" \
              --body "Automated extraction of `pro.rar` from release `${{ github.event.inputs.release_tag }}`.\n- Files extracted into `project/`\n- Build artifacts excluded\n- Files >100MB tracked via Git LFS (or listed in `project/MISSING_FILES.md` if LFS was unavailable)\n- See `project/FILE_MANIFEST.md` for inventory"

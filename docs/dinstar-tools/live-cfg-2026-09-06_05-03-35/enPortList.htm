function find_repeat_sipPort()
{
	var mPortCount=0;
    if(IsSipSamePort)
    {
        mPortCount = 1;
    }
    else
	{
        mPortCount = PortCount;
	}
    var i = 0;
    var j = 0;
    for(i = 0; i < mPortCount; i++)
    {
        var port1 = parseInt(document.getElementById(("SipLocalPort"+i)).value, 10);
        for(j = i + 1; j < mPortCount; j++)
        {
            var port2 = parseInt(document.getElementById(("SipLocalPort"+j)).value, 10);
            if(port1 == port2)
            {
                alert("The Local Sip Port of port "+i+" is same as port "+j);
                return false;
            }
        }
    }

    var groupPort = '[{"port":"0","SIPPortNum":"5060"}]';
    var groupPortObj = eval('('+groupPort+')');
    for(i = 0; i < groupPortObj.length; i++)
    {
        var portGroup = parseInt(groupPortObj[i].SIPPortNum);
        for(j = 0; j < mPortCount; j++)
        {
            var port = parseInt(document.getElementById(("SipLocalPort"+j)).value);
            if(port != 0 && portGroup != 0)
            {
                if(port == portGroup) {
                    alert("The Local Sip Port of port "+j+" is same as port group "+groupPortObj[i].port);
                    return false;
                }
            }
        }
    }
    return true;
}

function LastStrIsDigital(value, index)
{
	var re = /^\d+$/;
	var match = value.substr(value.length - index);
	if(re.test(match) == false)
	{
		return false;
	}
	return true;
}

function IncreaseStrIsDigital(value)
{
	var re = /^\d{0,4}$/;
	if(re.test(value) == false)
	{
		return false;
	}
	return true;
}

function strDelEndStr (strSource,strEnd)
{
    var str=strSource;
    var str1=strEnd;
    var len=str.length;
    if(len<=0)
	{
		return "error";
	}     
    var len1=str1.length;
    len=len-len1;
    var str3=str.substring(0,len);
    return str3;
}


function split_str(text, step)
{
	var strs = new Array();
	var str  = text;
	var n    = str.replace(/[^0-9]/ig, ".");
	strs     = n.split(".");
	n        = strs.pop();
	
	if((isNaN(n) == false) && (n.length >16))
	{
		alert("The number of digits at the end of the string should not exceed 16 ");
		return "error";
	}
	
	var s    = strDelEndStr (str, n );
	if(s == "error")
	{
		return "error";
	}
	var num  = parseInt(n,10);
    num      = num + step ;
    var strN = num.toString();
    var numStart = "";
    if(n.length > strN.length)
    {
        var ln =n.length - strN.length;
        while(ln)
        {
            numStart+="0";
            ln--;
        }
        strN = numStart+strN;
    }
    s = s + strN;
	return s;
}

function split_string_num(source)
{
	var position = 0;
	var str="", num="";
	for(i=source.length - 1; i >= 0; i--)
	{
		if(source[i] == '0' || source[i] =='1' || source[i] =='2' || source[i] =='3' || source[i] =='4' || source[i] =='5'
		|| source[i] =='6' || source[i] =='7' || source[i] =='8' || source[i] =='9')
		{
			position = i;
		}
		else
		{
			break;
		}
	}

	if(position != 0)
	{
		str = source.substring(0, position);
	}
	num = source.substring(position);
	return [str, num]
}
